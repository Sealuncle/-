<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="2모드 콘솔">
<meta name="mobile-web-app-capable" content="yes">
<title>레버리지 2모드 매매 콘솔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090b; --bg2:#0d0f12; --card:#16181d; --card2:#1c1f25; --line:#24272e;
  --tx:#f2f4f7; --tx2:#9aa1ad; --tx3:#5f6672;
  --red:#e8443a; --amber:#f5a623; --green:#22c55e; --orange:#f2761f; --blue:#3b82f6; --purple:#8b5cf6;
  --ok:#22c55e; --warn:#f5a623; --bad:#e8443a;
  --shadow:none;
  --r:20px; --r2:14px;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}

/* ── 라이트 테마 ─────────────────────────────── */
html[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#ffffff; --card:#ffffff; --card2:#f2f4f7; --line:#e3e6ea;
  --tx:#14171c; --tx2:#5a626e; --tx3:#8b929e;
  --red:#d93a30; --amber:#c67b06; --green:#16a34a; --orange:#dc6510; --blue:#2563eb; --purple:#7c3aed;
  --ok:#16a34a; --warn:#c67b06; --bad:#d93a30;
  --shadow:0 1px 2px rgba(16,20,28,.05), 0 1px 8px rgba(16,20,28,.04);
}
html[data-theme="light"] .card{box-shadow:var(--shadow)}
html[data-theme="light"] .top,
html[data-theme="light"] .tabs{background:rgba(255,255,255,.92)}
html[data-theme="light"] input,
html[data-theme="light"] select,
html[data-theme="light"] textarea{background:#fff}
html[data-theme="light"] input[readonly]{background:#f2f4f7}
html[data-theme="light"] tbody tr:hover{background:#f6f7f9}
html[data-theme="light"] td{border-bottom-color:#eef0f3}
html[data-theme="light"] .toggle{background:#cfd4db}
html[data-theme="light"] .toggle::after{background:#fff}
html[data-theme="light"] .toggle.on{background:#16a34a}
html[data-theme="light"] .toggle.on::after{background:#fff}
html[data-theme="light"] .btn{background:#14171c;color:#fff}
html[data-theme="light"] .btn:hover{background:#000}
html[data-theme="light"] .btn.g{background:#fff;color:var(--tx)}
html[data-theme="light"] .btn.dg{background:#fff;border-color:#e9b5b1;color:#b93a30}
html[data-theme="light"] .btn.dg:hover{background:#fdf2f1}
html[data-theme="light"] .chip.on{background:#14171c;color:#fff;border-color:#14171c}
html[data-theme="light"] .call.buy{background:#eefbf3;border-color:#b7e6c9;color:#146b38}
html[data-theme="light"] .call.sell{background:#fdf1f0;border-color:#f2c4bf;color:#a2352c}
html[data-theme="light"] .call.hold{background:#f4f6f8;border-color:#e3e6ea;color:var(--tx2)}
html[data-theme="light"] .call.warn{background:#fdf6e7;border-color:#f0dcae;color:#8a6206}
html[data-theme="light"] .call b{color:#14171c}
html[data-theme="light"] .badge.a{background:#fdf1ee;border-color:#f0c8bd;color:#a8452e}
html[data-theme="light"] .badge.s{background:#eef4fb;border-color:#c4d8ef;color:#25578c}
html[data-theme="light"] .toast{background:#14171c;color:#fff}
html[data-theme="light"] .foot{color:#aeb4bd}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.5;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--blue)}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}

/* ── top bar ─────────────────────────────── */
.top{position:sticky;top:0;z-index:40;background:rgba(8,9,11,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:56px}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--tx2);text-transform:uppercase;white-space:nowrap}
.brand b{color:var(--tx);font-weight:600}
.top .sp{flex:1}
.today{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--tx3)}
.icobtn{background:var(--card);border:1px solid var(--line);border-radius:10px;height:32px;padding:0 12px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--tx2);cursor:pointer}
.icobtn:hover{border-color:#3a3f49;color:var(--tx)}

/* ── tabs (bottom on mobile, inline on desktop) ── */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(8,9,11,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .inner{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;padding:12px 4px 14px;cursor:pointer;color:var(--tx3);display:flex;flex-direction:column;align-items:center;gap:5px;border-top:2px solid transparent;margin-top:-1px}
.tab .g{font-size:17px;line-height:1}
.tab .t{font-family:var(--mono);font-size:10px;letter-spacing:.1em}
.tab.on{color:var(--tx);border-top-color:var(--tx)}
@media(min-width:820px){
  body{padding-bottom:40px}
  .tabs{position:sticky;top:56px;bottom:auto;border-top:0;border-bottom:1px solid var(--line)}
  .tabs .inner{display:flex;gap:4px;padding:0 16px}
  .tab{flex-direction:row;gap:8px;padding:12px 16px;border-top:0;border-bottom:2px solid transparent;margin:0}
  .tab.on{border-bottom-color:var(--tx)}
}

/* ── page head ───────────────────────────── */
.page{padding:22px 0 40px;display:none}
.page.on{display:block}
.eyebrow{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--tx3);text-transform:uppercase;margin-bottom:14px}
h1{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--tx2);font-size:13px;margin:0 0 20px}

/* ── cards / grid ────────────────────────── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card+.card{margin-top:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr}
@media(min-width:720px){.g2{grid-template-columns:1fr 1fr}}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.sec-h .n{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--tx3);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.sec-h h2{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.sec-h .hint{margin-left:auto;font-size:11px;color:var(--tx3);font-family:var(--mono);letter-spacing:.06em}

/* ── stat ────────────────────────────────── */
.stat .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--tx3);text-transform:uppercase}
.stat .v{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.01em;margin-top:6px}
.stat .d{font-size:11.5px;color:var(--tx3);margin-top:3px;font-family:var(--mono)}
.statrow{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:720px){.statrow{grid-template-columns:repeat(4,1fr)}}
.statrow .card{padding:16px}
.up{color:var(--green)} .down{color:var(--red)} .mut{color:var(--tx2)}

/* ── legend / list rows ──────────────────── */
.lrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.dot{width:11px;height:11px;border-radius:3px;flex:none}
.lrow .nm{font-weight:600;font-size:14.5px}
.lrow .sp{flex:1}
.lrow .pc{font-family:var(--mono);font-weight:600;font-size:14px}
.lrow .amt{font-family:var(--mono);font-size:12.5px;color:var(--tx3);min-width:74px;text-align:right}

/* ── tables ──────────────────────────────── */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:0 18px}
table{border-collapse:collapse;width:100%;min-width:560px}
th{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--tx3);text-transform:uppercase;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:500}
th:first-child,td:first-child{text-align:left}
td{padding:9px 10px;border-bottom:1px solid #1b1e24;font-family:var(--mono);font-size:13px;text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#1a1d23}
td.nm{font-family:var(--sans);font-weight:600}
.empty{color:var(--tx3);font-size:13px;text-align:center;padding:24px 0;font-family:var(--mono)}

/* ── form ────────────────────────────────── */
.fgrid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:560px){.fgrid{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.fgrid.c3{grid-template-columns:repeat(3,1fr)}}
label.f{display:block}
label.f .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--tx3);text-transform:uppercase;display:block;margin-bottom:6px}
input,select,textarea{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-family:var(--mono);font-size:14px;outline:none
}
input:focus,select:focus,textarea:focus{border-color:#454b57;box-shadow:0 0 0 3px rgba(255,255,255,.04)}
input[readonly]{color:var(--tx2);background:#101216}
textarea{min-height:110px;resize:vertical;line-height:1.6}
.btn{background:var(--tx);color:#0b0c0f;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13.5px;cursor:pointer}
.btn:hover{background:#fff}
.btn.g{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.g:hover{border-color:#454b57}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:8px}
.btn.dg{background:none;border:1px solid #3a2426;color:#c9564d}
.btn.dg:hover{background:#241618}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-family:var(--mono);font-size:12px;color:var(--tx2);cursor:pointer}
.chip.on{background:var(--tx);color:#0b0c0f;border-color:var(--tx);font-weight:600}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw .t{font-size:13.5px}
.sw .t small{display:block;color:var(--tx3);font-size:11px;font-family:var(--mono);margin-top:2px}
.toggle{width:44px;height:25px;border-radius:999px;background:#2a2e36;border:0;position:relative;cursor:pointer;flex:none}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#767d89;transition:.16s}
.toggle.on{background:#2f6b45}
.toggle.on::after{left:22px;background:#5ce08e}

/* ── callouts ────────────────────────────── */
.call{border-radius:var(--r2);padding:14px 16px;font-size:13.5px;line-height:1.55;border:1px solid}
.call .hd{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-bottom:5px}
.call.buy{background:#0f2018;border-color:#1e4630;color:#9ff0bd}
.call.sell{background:#221114;border-color:#4a2126;color:#f4a9a2}
.call.hold{background:#141619;border-color:#2a2e36;color:var(--tx2)}
.call.warn{background:#221c0e;border-color:#4a3b16;color:#f3ce87}
.call b{color:#fff}
.badge{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:3px 9px;border-radius:999px;border:1px solid}
.badge.a{background:#2a1410;border-color:#5a271f;color:#ffab9c}
.badge.s{background:#0f1c26;border-color:#1f3d52;color:#8fc8ef}
.note{font-size:11.5px;color:var(--tx3);line-height:1.6;margin-top:10px}
.note b{color:var(--tx2);font-weight:600}
.dl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-family:var(--mono);font-size:13px}
.dl dt{color:var(--tx3);font-size:11.5px;letter-spacing:.06em}
.dl dd{margin:0;text-align:right}
.foot{text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:#3a3f49;padding:26px 0 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#eef0f3;color:#0b0c0f;font-size:13px;font-weight:600;padding:10px 18px;border-radius:999px;z-index:99;opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1;bottom:104px}
@media(min-width:820px){.toast{bottom:24px}.toast.on{bottom:32px}}
svg{display:block;max-width:100%}
.scroll-x{overflow-x:auto}
</style>
<script>
(function(){
  var t = null;
  try { t = localStorage.getItem('lev2mode:theme'); } catch(e){}
  var mq = window.matchMedia('(prefers-color-scheme: light)');
  function apply(m){
    var eff = (m==='system'||!m) ? (mq.matches?'light':'dark') : m;
    document.documentElement.setAttribute('data-theme', eff);
    var mt = document.querySelector('meta[name="theme-color"]');
    if(mt) mt.setAttribute('content', eff==='light' ? '#f6f7f9' : '#08090b');
  }
  window.__themeApply = apply;
  window.__themeMQ = mq;
  apply(t||'system');
  mq.addEventListener('change', function(){
    var cur=null; try{ cur=localStorage.getItem('lev2mode:theme'); }catch(e){}
    if(!cur||cur==='system') apply('system');
  });
})();
</script>
</head>
<body>

<div class="top"><div class="wrap">
  <div class="brand">변리사의 <b>레버리지 콘솔</b></div>
  <div class="sp"></div>
  <span id="syncDot" style="font-size:10px;color:var(--tx3)" title="클라우드 동기화 상태">●</span>
  <div class="today" id="topDate"></div>
  <button class="icobtn" id="btnTheme" title="화면 테마">◐</button>
  <button class="icobtn" id="btnSync" title="저장소 최신본 다시 불러오기">동기화</button>
  <button class="icobtn" id="btnSave">저장</button>
</div></div>

<nav class="tabs"><div class="inner">
  <button class="tab on" data-p="ov"><span class="g">◎</span><span class="t">개요</span></button>
  <button class="tab" data-p="soxl"><span class="g">▲</span><span class="t">SOXL</span></button>
  <button class="tab" data-p="tqqq"><span class="g">◆</span><span class="t">TQQQ</span></button>
  <button class="tab" data-p="set"><span class="g">⚙</span><span class="t">설정</span></button>
</div></nav>

<main class="wrap">
  <section class="page on" id="p-ov"></section>
  <section class="page" id="p-soxl"></section>
  <section class="page" id="p-tqqq"></section>
  <section class="page" id="p-set"></section>
  <div class="foot">@patent_leverage &nbsp;·&nbsp; LOC 종가매매 2모드 콘솔 &nbsp;·&nbsp; <span id="buildTag"></span></div>
</main>

<div class="toast" id="toast"></div>

<script>
const APPS_SCRIPT = "/** 레버리지 2모드 콘솔 — 브리지 v3  (시세 + 데이터 동기화)\n *  1) 시세: GOOGLEFINANCE 이력에서 최근 2개 확정 일별 종가(날짜 포함)\n *  2) 동기화: 앱 데이터를 이 시트의 _sync 탭에 저장/불러오기 (본인 전용 클라우드)\n *\n *  설정: 아래 TOKEN 을 본인만 아는 문자열로 바꾸세요. 앱의 「동기화 암호」와 같아야 합니다.\n *  배포: 배포 > 새 배포 > 웹 앱 / 실행 계정 = 나 / 액세스 권한 = 모든 사용자\n *  ※ 코드 수정 후에는 반드시 「배포 관리 → 새 버전」으로 재배포해야 반영됩니다.\n */\nvar TOKEN = 'CHANGE-ME';          // ★ 반드시 변경\n\nfunction doGet(e) {\n  var p = (e && e.parameter) || {};\n  if (p.action === 'load') return jsonOut(loadState(p), p);\n  if (p.action === 'meta') return jsonOut(meta(p), p);\n  if (p.action === 'ping') return jsonOut({ ok: true, v: 4 }, p);\n  return jsonOut(quotes(p), p);\n}\n\nfunction meta(p) {\n  if (p.token !== TOKEN) return { error: 'bad token' };\n  var sh = SpreadsheetApp.getActive().getSheetByName('_sync');\n  if (!sh || sh.getLastRow() < 1) return { empty: true };\n  return { ok: true, savedAt: String(sh.getRange(1, 2).getValue() || '') };\n}\n\nfunction doPost(e) {\n  var p = (e && e.parameter) || {};\n  if (p.token !== TOKEN) return jsonOut({ error: 'bad token' }, p);\n  var body = (e && e.postData && e.postData.contents) || '';\n  if (!body) return jsonOut({ error: 'empty body' }, p);\n  var sh = sheet('_sync');\n  // 충돌 감지: 클라이언트가 마지막으로 본 저장 시각(ifmatch)과 현재가 다르면\n  // 다른 기기가 그 사이에 저장한 것 → 덮어쓰기 거부 (force=1 이면 강행)\n  var cur = String(sh.getLastRow() >= 1 ? (sh.getRange(1, 2).getValue() || '') : '');\n  if (p.force !== '1' && cur && p.ifmatch !== undefined && p.ifmatch !== cur)\n    return jsonOut({ error: 'conflict', savedAt: cur }, p);\n  sh.clear();\n  var CH = 40000, rows = [];\n  for (var i = 0; i < body.length; i += CH) rows.push([body.slice(i, i + CH)]);\n  sh.getRange(1, 1, rows.length, 1).setValues(rows);\n  sh.getRange(1, 2).setValue(new Date().toISOString());\n  return jsonOut({ ok: true, savedAt: sh.getRange(1, 2).getValue(), bytes: body.length }, p);\n}\n\nfunction loadState(p) {\n  if (p.token !== TOKEN) return { error: 'bad token' };\n  var ss = SpreadsheetApp.getActive(), sh = ss.getSheetByName('_sync');\n  if (!sh || sh.getLastRow() < 1) return { empty: true };\n  var vals = sh.getRange(1, 1, sh.getLastRow(), 1).getValues();\n  var body = vals.map(function (r) { return r[0]; }).join('');\n  return { ok: true, savedAt: String(sh.getRange(1, 2).getValue() || ''), state: body };\n}\n\nfunction quotes(p) {\n  var t = (p.tickers || 'SOXL,TQQQ').split(',')\n          .map(function (s) { return s.trim().toUpperCase(); }).filter(String).slice(0, 20);\n  var sh = sheet('_quote'); sh.clear();\n  sh.getRange('A1').setFormula('=IFERROR(GOOGLEFINANCE(\"CURRENCY:USDKRW\"),\"\")');\n  for (var i = 0; i < t.length; i++)\n    sh.getRange(1, 3 + i * 3)\n      .setFormula('=IFERROR(GOOGLEFINANCE(\"' + t[i] + '\",\"close\",TODAY()-15,TODAY()),\"\")');\n  SpreadsheetApp.flush(); Utilities.sleep(1500); SpreadsheetApp.flush();\n  var tz = 'America/New_York';\n  // 완료된 마지막 세션 계산: ET 16:05 이전이면 당일 세션은 미완료\n  var nowET = new Date(Utilities.formatDate(new Date(), tz, \"yyyy/MM/dd HH:mm:ss\"));\n  var closed = nowET.getHours() > 16 || (nowET.getHours() === 16 && nowET.getMinutes() >= 5);\n  var cut = new Date(nowET.getFullYear(), nowET.getMonth(), nowET.getDate(), 12);\n  if (!closed) cut.setDate(cut.getDate() - 1);\n  while (cut.getDay() === 0 || cut.getDay() === 6) cut.setDate(cut.getDate() - 1);\n  var cutoff = Utilities.formatDate(cut, tz.split('/')[0] === 'America' ? Session.getScriptTimeZone() : tz, 'yyyy-MM-dd');\n  cutoff = cut.getFullYear() + '-' + ('0' + (cut.getMonth() + 1)).slice(-2) + '-' + ('0' + cut.getDate()).slice(-2);\n  var out = { fx: Number(sh.getRange('A1').getValue()) || 0,\n              asOf: new Date().toISOString(), src: 'googlefinance-history',\n              cutoff: cutoff, prices: {} };\n  for (var i = 0; i < t.length; i++) {\n    var vals = sh.getRange(1, 3 + i * 3, 20, 2).getValues()\n      .filter(function (r) { return r[0] instanceof Date && Number(r[1]) > 0; })\n      .filter(function (r) { return Utilit   mode: 'local',
  async get(){
    if (window.storage) {
      try { const r = await window.storage.get(KEY); this.mode='cloud'; if(r&&r.value) return JSON.parse(r.value); }
      catch(e){ this.mode='cloud'; }

  async rawGet(k){
    if (window.storage) { try { const r=await window.storage.get(k); if(r&&r.value!=null) return r.value; } catch(e){} }
    try { return localStorage.getItem(k); } catch(e){ return null; }

    try { localStorage.setItem(k,v); } catch(e){}

/* ============================================================
   1-2. 자격증명 보안 (PIN 기반 AES-GCM 암호화)
   ── 웹앱 주소·접근 토큰은 평문 저장하지 않고, PIN으로 봉인할 수 있습니다.
      PIN을 걸면 앱을 열 때마다 PIN을 입력해야 시트에 접근합니다.
   ============================================================ */
const CRED_KEY='lev2mode:cred', CRED_FIELDS=['gsUrl','gsToken','tdKey'];
const b64={ enc:buf=>btoa(String.fromCharCode(...new Uint8Array(buf))),
            dec:str=>Uint8Array.from(atob(str), c=>c.charCodeAt(0)) };
async function deriveKey(pin, salt){
  const base=await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function sealCreds(pin, obj){
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pin, salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  return {v:1, s:b64.enc(salt), i:b64.enc(iv), c:b64.enc(ct)};
}
async function openCreds(pin, box){
  const key=await deriveKey(pin, b64.dec(box.s));
  const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64.dec(box.i)}, key, b64.dec(box.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
const credBox=()=>{ try{ return JSON.parse(localStorage.getItem(CRED_KEY)||'null'); }catch(e){ return null; } };
const isLocked=()=>!!credBox();

/** 엑셀 NETWORKDAYS(start,end) — 주말 제외, 양끝 포함 */
function networkDays(a,b){
  if(!a||!b) return 0;
  let s=new Date(a), e=new Date(b), sign=1;
  if(s>e){ [s,e]=[e,s]; sign=-1; }
  let n=0; const cur=new Date(s);
  while(cur<=e){ const w=cur.getDay(); if(w!==0&&w!==6) n++; cur.setDate(cur.getDate()+1); }
  return sign*n;
}

/* ── 미국 거래 세션 시계 ─────────────────────────────────
   기준 종가 = "완료된 마지막 미국 세션"의 종가.
   ET 16:05 이전에는 당일 세션이 미완료이므로 전 거래일이 기준. */
function usEasternNow(){
  const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',
    year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})
    .formatToParts(new Date());
  const g=t=>+p.find(x=>x.type===t).value;
  return {y:g('year'),m:g('month'),d:g('day'),H:g('hour'),M:g('minute')};
}
const fmtD=dt=>dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
function lastCompletedUsSession(){
  const n=usEasternNow();
  const closed=(n.H>16)||(n.H===16&&n.M>=5);        // 16:05 버퍼
  let dt=new Date(n.y,n.m-1,n.d,12);
  if(!closed) dt.setDate(dt.getDate()-1);
  while(dt.getDay()===0||dt.getDay()===6) dt.setDate(dt.getDate()-1);
  return fmtD(dt);
}
function targetUsSession(){                          // 지금 낼 주문이 체결될 세션
  const n=usEasternNow();
  const closed=(n.H>16)||(n.H===16&&n.M>=5);
  let dt=new Date(n.y,n.m-1,n.d,12);
  if(closed) dt.setDate(dt.getDate()+1);
  while(dt.getDay()===0||dt.getDay()===6) dt.setDate(dt.getDate()+1);
  return fmtD(dt);
}

function fKRW(v){
  const a=Math.abs(v), sg=v<0?'-':'';
  if(a>=1e8) return sg+(a/1e8).toFixed(2)+'억';
  if(a>=1e4) return sg+Math.round(a/1e4).toLocaleString('ko-KR')+'만';
  return sg+Math.round(a).toLocaleString('ko-KR');

/* ════════════════════════════════════════════════════════════════
   StrategyCore — 2모드 분할매매 공통 전략 엔진
   콘솔과 백테스터에 "문자 단위로 동일하게" 삽입된다.
   UI 렌더링과 원장 조작은 이 모듈 밖에서 한다.
   ════════════════════════════════════════════════════════════════ */
const StrategyCore = (() => {
  'use strict';

  const ENGINE_VERSION = '2mode-core-1.0.0';
  const STRATEGY_SCHEMA_VERSION = 2;

  const cents = v => Math.round(v * 100);

  /* ── 매수 지정가 ─────────────────────────────────────────────
     전략 조건: 종가 < 전일종가 × (1 + 매수제한률)  (엄격 부등식)
     이 부등식을 만족하는 가장 높은 센트 가격을 지정가로 쓴다. */
  function calcStrictBuyLimitCents(prevClose, rate) {
    const rawCents = prevClose * (1 + rate) * 100;
    return Math.ceil(rawCents - 1e-10) - 1;
  }
  function calcBuyLimit(prevClose, rate) {
    return calcStrictBuyLimitCents(prevClose, rate) / 100;
  }

  /* ── 주문 수량 (지정가 기준 사전 확정) ─────────────────────
     실제 종가가 지정가보다 낮아도 수량을 사후에 늘리지 않는다. */
  function calcPlannedBuyQty(availableBuyBudget, buyLimit, buyFeeRate) {
    if (!(buyLimit > 0) || !(availableBuyBudget > 0)) return 0;
    return Math.floor(availableBuyBudget / (buyLimit * (1 + (buyFeeRate || 0))));
  }

  /* ── 목표가 ──────────────────────────────────────────────────
     exact  : P×(1+buyFee)×(1+r)÷(1−sellFee), 조건 충족 최소 센트로 올림
     legacy-approx : P×(1+r+(2+r)×f)  — 구 시트 호환(올림 없음) */
  function calcTargetPrice(buyPrice, targetReturnRate, buyFeeRate, sellFeeRate, feeModel) {
    if (feeModel === 'legacy-approx') {
      const f = buyFeeRate;
      return buyPrice * (1 + targetReturnRate + (2 + targetReturnRate) * f);
    }
    const raw = buyPrice * (1 + buyFeeRate) * (1 + targetReturnRate) / (1 - sellFeeRate);
    return Math.ceil(raw * 100 - 1e-10) / 100;
  }

  /* ── VXN 4단계 ───────────────────────────────────────────── */
  function classifyVxn(value, cfg) {
    if (value === null || value === undefined || !isFinite(value)) {
      return { stage: 'missing', multiplier: null, forceSafe: false };
    }
    if (value < cfg.vxnStableThreshold) {
      return { stage: 'stable', multiplier: cfg.vxnStableMultiplier, forceSafe: false };
    }
    if (value < cfg.vxnCautionThreshold) {
      return { stage: 'normal', multiplier: cfg.vxnNormalMultiplier, forceSafe: false };
    }
    if (value < cfg.vxnPanicThreshold) {
      return { stage: 'caution', multiplier: cfg.vxnCautionMultiplier,
               forceSafe: !!cfg.vxnForceSafeOnCaution };
    }
    return { stage: 'panic', multiplier: cfg.vxnPanicMultiplier,
             forceSafe: !!cfg.vxnForceSafeOnPanic };
  }
  const VXN_STAGE_KO = { stable: '안정', normal: '보통', caution: '경계', panic: '패닉', missing: '데이터 없음' };

  /* ── 유효 모드 ───────────────────────────────────────────────
     baseMode('공세'|'안전'|'방어') 에 VXN 강제안전을 결합한다.
     '방어'(위험필터)는 VXN보다 우선한다. */
  function resolveEffectiveMode(baseMode, vxnStageInfo, vxnEnabled) {
    if (!vxnEnabled || !vxnStageInfo) return baseMode;
    if (baseMode === '방어') return baseMode;
    if (vxnStageInfo.forceSafe) return '안전';
    return baseMode;
  }

  /* ── 최종 매수 배수 ──────────────────────────────────────────
     위험필터 배수 × VXN 배수. VXN 데이터 누락 시 null(매수 보류). */
  function resolveBuyMultiplier(riskRatio, vxnStageInfo, vxnEnabled) {
    const r = isFinite(riskRatio) ? riskRatio : 1;
    if (!vxnEnabled) return r;
    if (!vxnStageInfo || vxnStageInfo.stage === 'missing' || vxnStageInfo.multiplier === null) return null;
    return r * vxnStageInfo.multiplier;
  }

  /* ── 매수 주문 평가 ──────────────────────────────────────────
     ctx = { prevClose, buyCapRate, chunkAmount, cash, buyFeeRate,
             multiplier(null=VXN누락), openLots, maxOpenLots(0=무제한),
             blockedBySellRule(bool) }
     반환 = { allowed, reason, limit, plannedQty, budget } */
  function evaluateBuyOrder(ctx) {
    const out = { allowed: false, reason: '', limit: null, plannedQty: 0, budget: 0 };
    if (ctx.blockedBySellRule) { out.reason = 'SELL_DAY_RULE'; return out; }
    if (ctx.multiplier === null) { out.reason = 'VXN_DATA_MISSING'; return out; }
    if (ctx.multiplier <= 0) { out.reason = 'MULTIPLIER_ZERO'; return out; }
    const cap = ctx.maxOpenLots > 0 ? ctx.maxOpenLots : Infinity;
    if (ctx.openLots >= cap) { out.reason = 'MAX_OPEN_LOTS'; return out; }
    if (!(ctx.prevClose > 0)) { out.reason = 'NO_PREV_CLOSE'; return out; }

    const limit = calcBuyLimit(ctx.prevClose, ctx.buyCapRate);
    const budget = Math.min(ctx.chunkAmount * ctx.multiplier, ctx.cash); // 차입 금지
    const qty = calcPlannedBuyQty(budget, limit, ctx.buyFeeRate);
    out.limit = limit; out.budget = budget; out.plannedQty = qty;
    if (qty <= 0) { out.reason = 'INSUFFICIENT_CASH'; return out; }
    out.allowed = true; out.reason = 'OK';
    return out;
  }

  /* ── 매수 체결 판정 ────────────────────────────────────────── */
  function isBuyFilled(actualClose, buyLimit) {
    return cents(actualClose) <= cents(buyLimit);
  }

  /* ── 보유 세션 수 ────────────────────────────────────────────
     완료된 거래 세션 인덱스 기준. 매수 세션 자체는 0으로 센다
     (기존 콘솔·백테스터의 '매수 다음날부터' 규칙 유지). */
  function calcHoldingSessions(currentSessionIndex, buySessionIndex) {
    return currentSessionIndex - buySessionIndex;
  }

  /* ── 매도 평가 ───────────────────────────────────────────────
     lot = { targetPrice, maxHoldSessions, buySessionIndex, qty }
     반환 = { shouldSell, kind('TARGET'|'EXPIRE'|null), heldSessions }
     실제 정산가는 항상 당일 종가다. */
  function evaluateSellForLot(lot, actualClose, currentSessionIndex) {
    const held = calcHoldingSessions(currentSessionIndex, lot.buySessionIndex);
    if (held < 1) return { shouldSell: false, kind: null, heldSessions: held };
    if (held >= lot.maxHoldSessions) return { shouldSell: true, kind: 'EXPIRE', heldSessions: held };
    if (cents(actualClose) >= cents(lot.targetPrice)) {
      return { shouldSell: true, kind: 'TARGET', heldSessions: held };
    }
    return { shouldSell: false, kind: null, heldSessions: held };
  }
  function evaluateSellOrders(lots, actualClose, currentSessionIndex) {
    return (lots || []).map(l => Object.assign(
      { lot: l }, evaluateSellForLot(l, actualClose, currentSessionIndex)));
  }

  /* ── 전략 설정 정규화·지문 ─────────────────────────────────── */
  const STRATEGY_KEYS = [
    'symbol', 'capital', 'splits', 'maxOpenLots',
    'buyFeeRate', 'sellFeeRate', 'feeModel', 'feeNettingMode',
    'quantityModel', 'buyLimitFormulaVersion',
    'aggrTarget', 'aggrHold', 'safeTarget', 'safeHold',
    'buyCap', 'sellDayBuyRule',
    'rsiSource', 'rsiPeriod', 'rsiUpper', 'rsiLower', 'defaultMode',
    'vxnEnabled', 'vxnModel', 'vxnSource',
    'vxnStableThreshold', 'vxnCautionThreshold', 'vxnPanicThreshold',
    'vxnStableMultiplier', 'vxnNormalMultiplier', 'vxnCautionMultiplier', 'vxnPanicMultiplier',
    'vxnForceSafeOnCaution', 'vxnForceSafeOnPanic', 'vxnLagSessions',
    'riskMaFilter', 'riskVolFilter', 'safeCut', 'safeCutRatio', 'defenseRatio',
    'holidayCalendar'
  ];
  function canonicalizeStrategyConfig(cfg) {
    const out = {
      engineVersion: ENGINE_VERSION,
      schemaVersion: STRATEGY_SCHEMA_VERSION
    };
    for (const k of STRATEGY_KEYS) {
      let v = cfg[k];
      if (v === undefined || v === null) v = null;
      else if (typeof v === 'boolean') v = v ? 1 : 0;
      else if (typeof v === 'number' && !isFinite(v)) v = null;
      out[k] = v;
    }
    return out;
  }
  function stableStringify(obj) {
    if (obj === null || typeof obj !== 'object') return JSON.stringify(obj);
    if (Array.isArray(obj)) return '[' + obj.map(stableStringify).join(',') + ']';
    return '{' + Object.keys(obj).sort()
      .map(k => JSON.stringify(k) + ':' + stableStringify(obj[k])).join(',') + '}';
  }
  async function hashStrategyConfig(cfg) {
    const canon = canonicalizeStrategyConfig(cfg);
    const text = stableStringify(canon);
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    const hex = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    return { hash: hex, short: hex.slice(0, 8), canonical: canon, text };
  }

  return {
    ENGINE_VERSION, STRATEGY_SCHEMA_VERSION, VXN_STAGE_KO, STRATEGY_KEYS,
    cents, calcStrictBuyLimitCents, calcBuyLimit, calcPlannedBuyQty,
    calcTargetPrice, classifyVxn, resolveEffectiveMode, resolveBuyMultiplier,
    evaluateBuyOrder, isBuyFilled, calcHoldingSessions,
    evaluateSellForLot, evaluateSellOrders,
    canonicalizeStrategyConfig, stableStringify, hashStrategyConfig
  };
})();

const CONTRACT_MIGRATION_ID = 'contract-1';

/** 부팅 시 하루 1회 상태 스냅샷. 마이그레이션·정산 사고로부터 복구 지점 확보 */
async function backupState(tag){
  try{
    const key='lev2mode:backup:'+(tag||todayISO());
    const listKey='lev2mode:backup:list';
    if(await Store.rawGet?.(key)) return;                       // 이미 있음
    await Store.rawSet?.(key, JSON.stringify({at:Date.now(), state:S}));
    let list=[]; try{ list=JSON.parse(await Store.rawGet?.(listKey)||'[]'); }catch(e){}
    list=list.filter(k=>k!==key); list.push(key);
    while(list.length>7){ const old=list.shift(); try{ await Store.rawDel?.(old); }catch(e){} }
    await Store.rawSet?.(listKey, JSON.stringify(list));
  }catch(e){ console.warn('백업 실패(치명적 아님):', e.message); }
}

/** 목표가·기한을 매수 시점 계약으로 로트에 고정한다.
    - 기존 로트: 마이그레이션 시점의 현행 설정값으로 1회 스탬프 (동작 변화 없음, 이후 소급 변동 종료)
    - 신규 로트: stampNewLot() 이 정확식으로 스탬프
    - 멱등: ct 가 이미 있으면 건드리지 않는다 */
function migrateContracts(){
  let n=0;
  for(const k of Object.keys(S.books||{})){
    const b=S.books[k]; if(!b) continue;
    (b.lots||[]).forEach(l=>{
      if(!l || !l.d || l.ct) return;
      const t = l.mode==='안전'? num(b.safeTarget) : num(b.aggrTarget);
      l.ct = {
        tp  : r2(num(l.p)*(1+t+(2+t)*num(b.fee))),          // 현행(근사식) 값 그대로 고정
        hold: l.mode==='안전'? num(b.safeDays) : num(b.aggrDays),
        fm  : 'legacy-approx',
        ev  : StrategyCore.ENGINE_VERSION,
        contractMigrated:true, contractSource:'legacy-current-settings'
      };
      n++;
    });
    b.contractMigrationId = CONTRACT_MIGRATION_ID;
  }
  return n;
}

/** 신규 로트 계약 스탬프 (정확식) */
function stampNewLot(b, lot){
  const t = lot.mode==='안전'? num(b.safeTarget) : num(b.aggrTarget);
  lot.ct = {
    tp  : StrategyCore.calcTargetPrice(num(lot.p), t, num(b.fee), num(b.fee), 'exact'),
    hold: lot.mode==='안전'? num(b.safeDays) : num(b.aggrDays),
    fm  : 'exact',
    ev  : StrategyCore.ENGINE_VERSION
  };
  return lot;
}
function lotTarget(b,l){ return l.ct? num(l.ct.tp) : r2(num(l.p)*(1+(l.mode==='안전'?num(b.safeTarget):num(b.aggrTarget))*1)+0); }
function lotHoldLimit(b,l){ return l.ct? num(l.ct.hold) : (l.mode==='안전'? num(b.safeDays):num(b.aggrDays)); }

/** 보유 세션 수: ⑥ 일별 기록의 실제 세션(종가 존재일)으로 센다.
    기록이 성긴 경우 주말제외 근사(networkDays)로 보수 폴백하고 경고 플래그를 준다. */
function heldSessions(b, lotDateISO, cutoffISO){
  const nd = Math.max(0, networkDays(D(lotDateISO), D(cutoffISO)) - 1);
  const recDays = new Set((b.records||[])
    .filter(r=> r.d && num(r.close)>0 && r.d>lotDateISO && r.d<=cutoffISO)
    .map(r=> r.d));
  const sess = recDays.size;
  if(sess===0 && nd>0) return {held:nd, src:'networkDays', gap:nd};
  const gap = Math.max(0, nd - sess);
  return {held:sess, src:'records', gap};
}


/* ============================================================
   4. 주간 RSI → 모드 판정  (QQQ주간RSI 시트 수식 이식)
   ============================================================ */
function rsiTable(b){
  const w = (b.weekly||[]).slice().sort((x,y)=> x.d<y.d?-1:1);
  const P=b.rsiPeriod, up=b.rsiUpper, dn=b.rsiLower;
  const out=[]; let ag=null, al=null, mode=b.baseMode;
  for(let i=0;i<w.length;i++){
    const c=w[i].c, prev=i>0?w[i-1].c:null;
    let ch=null, rsi=null, sig='';
    if(prev!=null){
      ch = c-prev;
      const g=Math.max(ch,0), l=Math.max(-ch,0);
      ag = (ag==null)? g : (ag*(P-1)+g)/P;
      al = (al==null)? l : (al*(P-1)+l)/P;
      rsi = (al===0)?100:100-100/(1+ag/al);
      const pr = out.length?out[out.length-1].rsi:null;
      if(pr!=null){
        if(pr>=up && rsi<pr) sig='안전';
        else if(pr<=dn && rsi>pr) sig='공세';
      }
    }
    if(sig) mode=sig;
    const ap=D(w[i].d); if(ap) ap.setDate(ap.getDate()+3);
    out.push({d:w[i].d, c, ch, rsi, sig, mode, apply: ap? ap.toISOString().slice(0,10):w[i].d});
  }
  return out;
}
function autoMode(b){
  const t=rsiTable(b); if(!t.length) return {mode:b.baseMode, row:null, tbl:t};
  const td=todayISO(); let row=null;
  for(const r of t){ if(r.apply<=td) row=r; }
  if(!row) row=t[t.length-1];
  return {mode:row.mode, row, tbl:t};
}

/* ============================================================
   5. 매매 엔진  (SOXL/TQQQ 2모드매매 시트 ①~⑦ 이식)
   ============================================================ */
/* ── VXN 기반 변동성 필터 ─────────────────────────────────
   VXN(나스닥100 변동성지수) 수준으로 신규매수 투입액을 조절한다.
   낮으면 증액, 높으면 감액, 패닉 구간은 신규매수 중단.
   보유 로트의 익절·기한 매도는 영향받지 않는다(청산은 항상 허용). */
function vxnState(b){
  const on=!!b.vxnOn;
  const ser=(b.vxnSeries||[]).filter(x=>x&&x.d&&num(x.c)>0).sort((x,y)=> x.d<y.d?-1:1);
  const cut=lastCompletedUsSession();
  const usable=ser.filter(x=> x.d<=cut);
  const last=usable.length? usable[usable.length-1] : null;
  const prev=usable.length>1? usable[usable.length-2] : null;
  if(!on)   return {on:false, level:'미사용', ratio:null, forceSafe:false, last, prev, stale:null};
  if(!last) return {on:true,  level:'데이터 없음', ratio:null, forceSafe:false, last:null, prev:null, stale:null,
                    warn:'VXN 시계열이 없습니다 — 시세 갱신에서 VXN을 받아오거나 직접 입력하세요'};
  const v=num(last.c);
  const cls=StrategyCore.classifyVxn(v,{
    vxnStableThreshold:num(b.vxnCalm), vxnCautionThreshold:num(b.vxnWarn), vxnPanicThreshold:num(b.vxnPanic),
    vxnStableMultiplier:num(b.vxnCalmRatio), vxnNormalMultiplier:num(b.vxnNormRatio),
    vxnCautionMultiplier:num(b.vxnWarnRatio), vxnPanicMultiplier:num(b.vxnPanicRatio),
    vxnForceSafeOnCaution:!!b.vxnForceSafe, vxnForceSafeOnPanic:!!b.vxnForceSafe});
  const level=StrategyCore.VXN_STAGE_KO[cls.stage], ratio=cls.multiplier;
  const stale=Math.max(0, networkDays(D(last.d), D(cut))-1);
  return {on:true, level, ratio, v, last, prev, stage:cls.stage,
          chg: prev? v-num(prev.c) : null, stale,
          forceSafe: cls.forceSafe,
          warn: stale>=2? `VXN 기록이 ${stale}거래일 오래됐습니다`:''};
}

function engine(b){
  const fx = S.fx||1;
  const E = {};
  E.seedUSD   = b.seedKRW/fx + b.seedUSD;                 // E4 총 최초 투자금($)
  // ── 실현금 회계: 수수료 반영 + 당일 상계 절감(왕복수수료 환급) + 실체결 단가(bp/sp) 지원
  const feeR = num(b.fee);
  E.bought=0; E.sold=0; E.qty=0; E.feeSaved=0;
  (b.records||[]).forEach(r=>{
    const bq=num(r.buy), sq=num(r.sell), cl=num(r.close);
    const bpx=num(r.bp)>0? num(r.bp) : cl;                 // 실 매수단가 (없으면 종가)
    const spx=num(r.sp)>0? num(r.sp) : cl;                 // 실 매도단가 (없으면 종가)
    E.bought += bq*bpx*(1+feeR);
    E.sold   += sq*spx*(1-feeR);
    const off = 2*feeR*cl*Math.min(bq,sq);                 // 상계 사다리 왕복수수료 절감
    E.feeSaved += off;
    E.qty    += bq - sq;
  });
  E.cash      = E.seedUSD - E.bought + E.sold + E.feeSaved;   // E8 예수금 (수수료 반영)
  E.evalUSD   = E.qty * num(b.price);                     // E9
  E.totalUSD  = E.cash + E.evalUSD;                       // E10
  E.totalKRW  = E.totalUSD * fx;                          // E11
  E.pnlUSD    = E.totalUSD - E.seedUSD;                   // E12
  E.pnlKRW    = E.totalKRW - (b.seedKRW + b.seedUSD*fx);  // E13
  E.rateKRW   = (b.seedKRW+b.seedUSD*fx)? E.pnlKRW/(b.seedKRW+b.seedUSD*fx):0;
  E.rateUSD   = E.seedUSD? E.pnlUSD/E.seedUSD:0;
  E.chunk     = b.splits? E.seedUSD/b.splits:0;           // E18 1덩이 금액

  // ── 전일 종가(=직전 거래일 종가) 결정 ──────────────────────
  //   기본: ⑥ 일별 매매 기록의 가장 최근 종가 (사용자가 매일 직접 입력하는 값 = 가장 신뢰도 높음)
  //   해제 시: 설정에서 직접 입력한 값
  E.cutoff = lastCompletedUsSession();               // 완료된 마지막 미국 세션
  E.session = targetUsSession();                     // 오늘 주문이 체결될 세션
  const recSorted=(b.records||[]).filter(r=>r.d&&num(r.close)>0).sort((x,y)=> x.d<y.d?-1:1);
  const eligible=recSorted.filter(r=> r.d<=E.cutoff);          // 미완료 세션 종가는 기준에서 제외
  E.lastRec = eligible.length? eligible[eligible.length-1] : null;
  E.futureRec = recSorted.filter(r=> r.d>E.cutoff);            // 장중 가격이 섞여 들어온 기록 (경고용)
  E.prevFromRecord = !!b.prevFromRecord && !!E.lastRec;
  E.prevClose = E.prevFromRecord ? num(E.lastRec.close) : num(b.prevClose);
  E.prevSrc   = E.prevFromRecord ? (E.lastRec.d+' 종가') : '직접 입력';
  E.prevStale = E.prevFromRecord ? Math.max(0, networkDays(D(E.lastRec.d), D(E.cutoff))-1) : null;

  // ③ 모드
  const am = autoMode(b);
  E.rsi = am;
  E.vxn = vxnState(b);
  let mode;
  if(b.manualMode!=='자동') mode=b.manualMode;
  else if(!b.useRSI) mode=b.baseMode;
  else if(b.riskState==='방어') mode='안전';
  else if(b.riskState==='안전') mode='안전';
  else if(E.vxn.forceSafe) mode='안전';
  else mode=am.mode;
  E.mode = mode;
  E.target = mode==='안전'? b.safeTarget : b.aggrTarget;   // B35
  E.limit  = mode==='안전'? b.safeDays  : b.aggrDays;      // B36

  // 위험필터 매수비율 (G30) + 안전모드 매수축소
  let ratio = b.riskState==='방어' ? 0 : num(b.riskRatio);
  if(b.safeCut && mode==='안전') ratio = Math.min(ratio, num(b.safeCutRatio));
  if(E.vxn.on && E.vxn.ratio!=null) ratio = ratio * E.vxn.ratio;   // VXN 배수 적용
  E.ratio = ratio;

  // ⑤ 로트 원장 — 계약(ct) 고정값 우선, 보유일은 기록 세션 기준
  E.sessGapWarn = 0;
  E.lots = (b.lots||[]).filter(l=>l.d).map((l,i)=>{
    const sp  = l.ct? num(l.ct.tp)
                    : r2(num(l.p)*(1+(l.mode==='안전'?num(b.safeTarget):num(b.aggrTarget))
                        +(2+(l.mode==='안전'?num(b.safeTarget):num(b.aggrTarget)))*num(b.fee)));
    const hs  = heldSessions(b, l.d, E.cutoff);
    const held= hs.held;
    if(hs.src==='records' && hs.gap>=3) E.sessGapWarn++;
    const lim = l.ct? num(l.ct.hold) : (l.mode==='안전'? num(b.safeDays) : num(b.aggrDays));
    const expired = held>=lim;
    let sell=0;
    if(held>=1) sell = expired? num(l.q) : (E.prevClose>=sp? num(l.q):0);   // J (전일종가 기준 예상)
    const fill = sell? (expired? E.prevClose : sp) : null;                  // K 최소 예상 체결가 — 정산은 실제 종가
    const loss = sell>0 && (fill*(1-num(b.fee)) < num(l.p)*(1+num(b.fee)));
    return {i, ...l, sp:r2(sp), held, lim, expired, sell, fill, loss, heldSrc:hs.src,
            type: expired?'MOC 강제매도':'LOC 익절 @'+fUSD(sp)};
  });
  E.sellLots  = E.lots.filter(l=>l.sell>0).length;              // E37
  E.lossLots  = E.lots.filter(l=>l.loss).length;                // G37
  E.sellQty   = E.lots.reduce((s,l)=>s+l.sell,0);               // B42
  E.sellAmt   = E.lots.reduce((s,l)=>s+l.sell*(l.fill||0),0);   // B43

  // 매도일 매수금지 규칙 (AA37)
  const rule = num(b.sellDayBuyRule);
  E.allowBuy = rule===0 ? true : (E.sellLots===0 ? true : (rule===1 ? E.lossLots>0 : E.lossLots===E.sellLots));
  E.buyVerdict = E.allowBuy
    ? (rule===0?'허용 (규칙 미적용)': E.sellLots===0?'허용 (오늘 매도 없음)': rule===1?'허용 (손실 매도 포함)':'허용 (전부 손실 매도)')
    : (rule===1?'금지 (이익 매도만 있음)':'금지 (이익 매도 포함)');

  // ④ 오늘 주문 — StrategyCore 표준 (엄격 센트 지정가 · 지정가 기준 사전 수량 · 차입 금지)
  E.opMode = b.opMode || 'ACTIVE';
  E.buyLimit = E.prevClose>0 ? StrategyCore.calcBuyLimit(E.prevClose, num(b.buyLimitPct)) : 0;
  E.full = E.lots.length >= b.splits;      // 표시용 — 분할 수는 1덩이 금액 기준일 뿐 (매수 차단 안 함)
  E.over = E.lots.length > b.splits;
  const vxnMissing = E.vxn.on && E.vxn.ratio==null;
  E.buyEval = StrategyCore.evaluateBuyOrder({
    prevClose:E.prevClose, buyCapRate:num(b.buyLimitPct),
    chunkAmount:E.chunk, cash:Math.max(0,E.cash), buyFeeRate:num(b.fee),
    multiplier: vxnMissing? null : ratio,
    openLots:E.lots.length, maxOpenLots:0,
    blockedBySellRule: !E.allowBuy
  });
  const opBlocked = E.opMode!=='ACTIVE';
  E.buyQty = (opBlocked || !E.buyEval.allowed) ? 0 : E.buyEval.plannedQty;
  E.buyAmt = E.buyQty*E.buyLimit;

  E.buyMsg = opBlocked ? (E.opMode==='EXIT_ONLY' ? '신규매수 중단 — 기존 로트 청산 대기' : '신규매수 일시중단 — 운용 설정')
           : E.buyEval.reason==='SELL_DAY_RULE' ? '매수 금지 — 매도일 매수금지 규칙'
           : E.buyEval.reason==='VXN_DATA_MISSING' ? '매수 보류 — 직전 세션 VXN 데이터 없음 (매도 관리는 정상)'
           : E.buyEval.reason==='MULTIPLIER_ZERO' ? (E.vxn.on && E.vxn.level==='패닉' ? '신규매수 중단 — VXN 패닉 구간' : '신규매수 중단 — 위험필터 방어 상태')
           : E.buyEval.reason==='INSUFFICIENT_CASH' ? '수량 0 — 예수금 부족 또는 매수비율 축소'
           : `LOC 매수 ${E.buyQty}주 @ ${fUSD(E.buyLimit)}`
             + (ratio!==1?` · 투입액 ${Math.round(ratio*100)}% 적용`:'')
             + (E.over?` · 보유 덩이 ${E.lots.length}/${b.splits} 초과 (재투자 복리)`:'');

  E.ladder = ladder(b,E);
  return E;
}

/* ── ⑧ 체결 정산 ────────────────────────────────────────
   실제 종가를 넣으면 "원래 로직" 기준으로 원장·기록을 어떻게 정리할지 계산한다.
   상계 사다리는 주문 방식일 뿐이고, 부기는 원래 로직을 따라야
   목표수익률·보유기한이 전략 의도대로 다시 계산된다.

   원래 로직:  종가 p 에서
     · 매도 = 보유 1일 이상이면서 (기한도래 or 목표매도가 ≤ p) 인 로트 전량
     · 매수 = p ≤ 매수지정가 이면 계획 수량 N
     · 원장 = 매도된 로트 행 삭제 + 매수 체결 시 N주 신규 로트(종가·오늘 모드)
   보유수량 증감은 N − S 로, 실제 상계 체결분과 정확히 일치한다. */
function settle(b,E,close,dateISO){
  const p=num(close), fee=num(b.fee);
  const sells=E.lots.filter(l=> l.held>=1 && (l.expired || cents(l.sp)<=cents(p)))
    .map(l=>({...l, planSell:num(l.q), actSell:num(l.q),
              gain:(p*(1-fee)-num(l.p)*(1+fee))*num(l.q), loss:p*(1-fee)<num(l.p)*(1+fee)}));
  const S=sells.reduce((s,l)=>s+num(l.q),0);
  const buyFills = E.buyQty>0 && StrategyCore.isBuyFilled(p, E.buyLimit);
  const N = buyFills? E.buyQty : 0;

  // 매도일 매수금지 규칙을 실제 종가로 재판정 (계획 시점 예측과 다를 수 있음)
  const rule=num(b.sellDayBuyRule), lossN=sells.filter(l=>l.loss).length;
  const allowNow = rule===0 ? true : (sells.length===0 ? true : (rule===1 ? lossN>0 : lossN===sells.length));

  return {p, d:dateISO, sells, S, N, buyFills, net:N-S, mode:E.mode,
          proceeds:S*p, cost:N*p, cash:(S-N)*p,
          realized:sells.reduce((s,l)=>s+l.gain,0),
          ruleFlip: allowNow!==E.allowBuy, allowNow,
          keepLots:(b.lots||[]).length - sells.length + (N>0?1:0)};
}

/* ── ⑦ 상계 사다리 ─────────────────────────────────────────
   원칙: 어떤 종가 p 에서도 기존 로직의 순매매수량과 동일하되
        매수·매도 지정가가 겹치지 않도록 재배치 (자전거래 방지).
   v(p) = (p ≤ 매수지정가 ? N : 0) − Σ(목표가 ≤ p 인 LOC 매도) − MOC 강제매도
------------------------------------------------------------ */
/* ── 전략 지문·검증본 (P0-배지) ─────────────────────────────
   백테스터 strategyConfigOf 와 동일한 키 구성으로 콘솔 북을 매핑한다.
   콘솔에 없는 백테스터 전용 필드는 표준값으로 고정한다. */

    buyFeeRate: num(b.fee), sellFeeRate: num(b.fee),
    feeModel: 'exact', feeNettingMode: 'legacy-overlap-netting',
    quantityModel: 'order-limit-price', buyLimitFormulaVersion: 'strict-cents-1',
    aggrTarget: num(b.aggrTarget), aggrHold: num(b.aggrDays),
    safeTarget: num(b.safeTarget), safeHold: num(b.safeDays),
    buyCap: num(b.buyLimitPct), sellDayBuyRule: num(b.sellDayBuyRule),
    rsiSource: b.rsiSource, rsiPeriod: num(b.rsiPeriod),
    rsiUpper: num(b.rsiUpper), rsiLower: num(b.rsiLower),
    defaultMode: b.baseMode,
    vxnEnabled: !!b.vxnOn, vxnModel: 'four-stage', vxnSource: 'index',
    vxnStableThreshold: num(b.vxnCalm), vxnCautionThreshold: num(b.vxnWarn), vxnPanicThreshold: num(b.vxnPanic),
    vxnStableMultiplier: num(b.vxnCalmRatio), vxnNormalMultiplier: num(b.vxnNormRatio),
    vxnCautionMultiplier: num(b.vxnWarnRatio), vxnPanicMultiplier: num(b.vxnPanicRatio),
    vxnForceSafeOnCaution: !!b.vxnForceSafe, vxnForceSafeOnPanic: !!b.vxnForceSafe,
    vxnLagSessions: 1,
    riskMaFilter: false, riskVolFilter: false,
    safeCut: !!b.safeCut, safeCutRatio: num(b.safeCutRatio), defenseRatio: 0,

  };
}

function ladder(b,E){
  const N = E.buyQty;
  const mocLots = E.lots.filter(l=>l.expired && l.held>=1);
  const locLots = E.lots.filter(l=>!l.expired && l.held>=1 && num(l.q)>0);
  const moc = mocLots.reduce((s,l)=>s+num(l.q),0);
  const loc = locLots.map(l=>({p:r2(l.sp), q:num(l.q)}));

  /* 배분용 잔여 수량 원장.
     기한도래(MOC) 로트는 어떤 가격에서도 청산 대상이므로 sp=0 으로 두어 항상 먼저 소진한다.
     (매수와 상계되면 MOC 물량이 LOC 매도 행에 흡수되기 때문) */
  const pool=[
    ...mocLots.map(l=>({n:l.i+1, d:l.d, buy:num(l.p), sp:0,        q:num(l.q), rem:num(l.q), moc:true})),
    ...locLots.map(l=>({n:l.i+1, d:l.d, buy:num(l.p), sp:r2(l.sp), q:num(l.q), rem:num(l.q), moc:false}))
  ].sort((a,x)=> a.sp-x.sp || a.n-x.n);
  /* 주문 수량을 로트에 배분. maxPrice 이하 목표가 로트만 대상. */
  const alloc=(src, qty, maxPrice)=>{
    let rem=qty; const out=[];
    for(const c of src){
      if(rem<=0) break;
      if(maxPrice!=null && cents(c.sp)>cents(maxPrice)) continue;
      if(c.rem<=0) continue;
      const take=Math.min(rem, c.rem);
      c.rem-=take; rem-=take;
      out.push({n:c.n, d:c.d, buy:c.buy, take, partial:take<c.q});
    }
    return out;
  };

  const setP = new Set(loc.map(l=>cents(l.p)));
  setP.add(cents(r2(E.buyLimit+0.01)));
  const th = Array.from(setP).sort((a,x)=>a-x).map(c=>c/100);
  const V = p => {
    let v = (cents(p) <= cents(E.buyLimit) ? N : 0) - moc;
    for(const l of loc) if(cents(l.p) <= cents(p)) v -= l.q;
    return v;
  };
  const v = [ V(th.length? th[0]-0.01 : 0) ];
  th.forEach(t=> v.push(V(t)));
  const P = x=>Math.max(0,x), M = x=>Math.max(0,-x);
  const rows=[];
  const mocNet = P(v[v.length-1]) - M(v[0]);
  if(mocNet<0) rows.push({side:'매도', kind:'MOC', qty:-mocNet, price:null,
      cond:'종가 무조건 체결', memo:'기한도래 강제매도 순매도분',
      lots:alloc(pool, -mocNet, null)});
  if(mocNet>0) rows.push({side:'매수', kind:'MOC', qty:mocNet, price:null,
      cond:'종가 무조건 체결', memo:'상계 후 순매수분', lots:[]});
  for(let j=1;j<v.length;j++){
    const bq = P(v[j-1])-P(v[j]);
    const sq = M(v[j])-M(v[j-1]);
    if(bq>0){ const lp=r2(th[j-1]-0.01);
      rows.push({side:'매수',kind:'LOC',qty:bq,price:lp,
        cond:`종가 ≤ ${fUSD(lp)} 시 체결`, memo:'상계 사다리 매수 (매일 재주문)', lots:[]}); }
    if(sq>0){ const lp=th[j-1];
      rows.push({side:'매도',kind:'LOC',qty:sq,price:lp,
        cond:`종가 ≥ ${fUSD(lp)} 시 체결`, memo:'상계 사다리 매도 (매일 재주문)',
        lots:alloc(pool, sq, lp)}); }
  }
  rows.sort((a,x)=> (a.price??-1e9)-(x.price??-1e9));

  // 로트 번호 → 오늘 걸린 주문 (원장 표에서 역참조)
  const lotMap={};
  rows.forEach(r=> (r.lots||[]).forEach(l=>{
    (lotMap[l.n]=lotMap[l.n]||[]).push({kind:r.kind, price:r.price, take:l.take, partial:l.partial});
  }));

  const buys = rows.filter(r=>r.side==='매수'), sells=rows.filter(r=>r.side==='매도');
  const maxBuy  = Math.max(...buys.map(r=>r.price??-Infinity), -Infinity);
  const minSell = Math.min(...sells.map(r=>r.price?? Infinity),  Infinity);
  return {
    rows, lotMap,
    buyQty : buys.reduce((s,r)=>s+r.qty,0),
    sellQty: sells.reduce((s,r)=>s+r.qty,0),
    buyAmt : buys.reduce((s,r)=>s+r.qty*(r.price||0),0),
    overlap: maxBuy>=minSell,
    saved  : Math.min(N, E.sellQty)*2*b.fee*(E.buyLimit||0)
  };
}

function lineChart(pts,{h=230,fmt=fKRW,stroke='#f2f4f7',fill=false}={}){
  if(pts.length<2) return `<div class="empty">데이터가 2개 이상 쌓이면 그래프가 그려집니다</div>`;
  const W=760,H=h,PL=64,PR=16,PT=18,PB=30;
  const ys=pts.map(p=>p.v), mn=Math.min(...ys), mx=Math.max(...ys), pad=(mx-mn)*0.12||Math.abs(mx)*0.05||1;
  const lo=mn-pad, hi=mx+pad;
  const X=i=> PL+(W-PL-PR)*(pts.length===1?0:i/(pts.length-1));
  const Y=v=> PT+(H-PT-PB)*(1-(v-lo)/(hi-lo||1));
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const area=fill? `<path d="${d} L${X(pts.length-1).toFixed(1)} ${H-PB} L${X(0).toFixed(1)} ${H-PB} Z" fill="url(#lg)" opacity=".35"/>`:'';
  let grid='';
  for(let k=0;k<4;k++){ const v=lo+(hi-lo)*(k/3), y=Y(v);
    grid+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#242830" stroke-dasharray="3 6"/>`+
          `<text x="${PL-10}" y="${y+4}" text-anchor="end" fill="#5f6672" font-size="11" font-family="IBM Plex Mono">${fmt(v)}</text>`; }
  const lab=[0,Math.floor((pts.length-1)/2),pts.length-1].map((i,k)=>
    `<text x="${X(i)}" y="${H-8}" text-anchor="${k===0?'start':k===2?'end':'middle'}" fill="#5f6672" font-size="10.5" font-family="IBM Plex Mono">${pts[i].d}</text>`).join('');
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${stroke}" stop-opacity=".45"/><stop offset="1" stop-color="${stroke}" stop-opacity="0"/></linearGradient></defs>
    ${grid}${area}<path d="${d}" fill="none" stroke="${stroke}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(pts.length-1)}" cy="${Y(last.v)}" r="4.5" fill="${stroke}"/>${lab}</svg>`;
}

function donut(items){
  const tot=items.reduce((s,i)=>s+i.v,0)||1, R=92, r=58, C=110;
  let a=-Math.PI/2, seg='';
  for(const it of items){
    const sw=(it.v/tot)*Math.PI*2; if(sw<=0) continue;
    const e=a+sw, big=sw>Math.PI?1:0;
    const p=(rad,ang)=>[C+rad*Math.cos(ang),C+rad*Math.sin(ang)];
    const [x1,y1]=p(R,a),[x2,y2]=p(R,e),[x3,y3]=p(r,e),[x4,y4]=p(r,a);
    seg+=`<path d="M${x1} ${y1} A${R} ${R} 0 ${big} 1 ${x2} ${y2} L${x3} ${y3} A${r} ${r} 0 ${big} 0 ${x4} ${y4} Z" fill="${it.c}"/>`;
    a=e;
  }
  return `<svg viewBox="0 0 220 220" style="width:200px;margin:0 auto">${seg}</svg>`;
}

function multiLine(series,labels){
  if(!series.length||series[0].pts.length<2) return `<div class="empty">스냅샷이 2개 이상 쌓이면 비중 추이가 표시됩니다</div>`;
  const W=760,H=170,PL=8,PR=8,PT=12,PB=14;
  const n=series[0].pts.length;
  const X=i=>PL+(W-PL-PR)*(n===1?0:i/(n-1));
  const Y=v=>PT+(H-PT-PB)*(1-v/100);
  let g='';
  for(const k of [25,50,75]) g+=`<line x1="${PL}" y1="${Y(k)}" x2="${W-PR}" y2="${Y(k)}" stroke="#20242b" stroke-dasharray="3 6"/>`;
  const paths=series.map(s=>`<path d="${s.pts.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ')}" fill="none" stroke="${s.c}" stroke-width="2.2" stroke-linejoin="round"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}">${g}${paths}</svg>`+
    `<div class="chips" style="margin-top:10px">${labels.map(l=>`<span class="chip"><span class="dot" style="background:${l.c};display:inline-block;margin-right:6px;vertical-align:-1px"></span>${esc(l.t)}</span>`).join('')}</div>`;
}

const PAL=['#e8443a','#f5a623','#22c55e','#f2761f','#3b82f6','#8b5cf6','#14b8a6','#ec4899'];

function portfolio(){
  const fx=S.fx||1;
  const items=(S.holdings||[]).filter(o=>num(o.q)>0)
      .map(o=>({t:o.t, q:num(o.q), p:num(o.p), v:num(o.q)*num(o.p)}));
  const cash = S.cashKRW/fx + S.cashUSD;
  const stockUSD = items.reduce((s,i)=>s+i.v,0);
  const totalUSD = stockUSD + cash;
  const rows = items.concat([{t:'현금',q:null,p:null,v:cash}])
                    .sort((a,b)=>b.v-a.v)
                    .map((r,i)=>({...r, c:PAL[i%PAL.length], w: totalUSD? r.v/totalUSD*100:0}));
  return {rows, items, cash, stockUSD, totalUSD, totalKRW: totalUSD*fx};
}

function snapshot(force){
  const P=portfolio(); const d=todayISO();
  const w={}; P.rows.forEach(r=> w[r.t]=+r.w.toFixed(2));
  const rec={d, krw:Math.round(P.totalKRW), usd:+P.totalUSD.toFixed(2), w};
  S.snapshots = S.snapshots||[];
  const last=S.snapshots[S.snapshots.length-1];
  if(last && last.d===d){ if(force) S.snapshots[S.snapshots.length-1]=rec; }
  else S.snapshots.push(rec);
  if(S.snapshots.length>400) S.snapshots=S.snapshots.slice(-400);
  touch();
}

          <td style="text-align:left;font-size:12px;color:var(--tx2)">${esc(r.cond)}</td></tr>`).join('')
          : `<tr><td colspan="6" class="empty">오늘 낼 주문이 없습니다</td></tr>`}</tbody>

        <b>방어</b>는 신규매수 0, <b>안전</b>은 모드를 안전으로 강제합니다. 최종 적용 매수비율 <b>${Math.round(E.ratio*100)}%</b>.</div>
    </div>

    <div class="card" style="margin-top:14px">

            <dt>구간</dt><dd><span class="badge ${E.vxn.level==='패닉'||E.vxn.level==='경계'?'a':'s'}">${esc(E.vxn.level)}</span></dd>
            <dt>투입 배수</dt><dd>${E.vxn.ratio!=null? '×'+E.vxn.ratio.toFixed(2):'—'}</dd>
            <dt>모드 강제</dt><dd>${E.vxn.forceSafe?'안전 모드로 전환됨':'없음'}</dd>
          </div>
          ${E.vxn.warn? `<div class="call warn" style="margin-top:10px">${esc(E.vxn.warn)}</div>`:''}
        </div>
        <div>

            ${fld(k+':vxnWarn','경계 하한',b.vxnWarn)}
            ${fld(k+':vxnNormRatio','보통 배수',b.vxnNormRatio)}
            ${fld(k+':vxnPanic','패닉 하한',b.vxnPanic)}

        </div>

      <label class="f" style="margin-top:14px"><span class="l">VXN 일별 종가 — 「날짜 값」 한 줄에 하나 (시세 갱신 시 자동 채워짐)</span>
        <textarea id="vx-${k}" placeholder="2026-07-22\t21.40&#10;2026-07-23\t22.10">${(b.vxnSeries||[]).slice(-120).map(w=>w.d+'\t'+w.c).join('\n')}</textarea></label>
      <div class="btnrow"><button class="btn sm" data-vx="${k}">VXN 반영</button>
        <span class="note" style="margin:0;align-self:center">${(b.vxnSeries||[]).length}일 보관 · 완료된 세션만 판정에 사용</span></div>
      <div class="note"><b>동작 규칙</b> — VXN &lt; ${b.vxnCalm}: 안정(×${b.vxnCalmRatio}) · ${b.vxnCalm}~${b.vxnWarn}: 보통(×${b.vxnNormRatio}) ·
        ${b.vxnWarn}~${b.vxnPanic}: 경계(×${b.vxnWarnRatio}) · ${b.vxnPanic} 이상: 패닉(×${b.vxnPanicRatio}).
        이 배수는 <b>신규매수 투입액에만</b> 곱해집니다. 보유 로트의 익절·기한 매도는 그대로 실행되므로 청산이 막히지 않습니다.</div>

  </div>

  <!-- ③ 현재 모드 -->
  <div class="sec">

    <div class="card">
      <div class="grid g2">
        <div>
          <div style="font-size:13px;color:var(--tx2);margin-bottom:8px">적용 모드 ${modeBadge}</div>
          <div class="dl">
            <dt>이번주 RSI</dt><dd>${rsiRow&&rsiRow.rsi!=null? rsiRow.rsi.toFixed(1):'—'}</dd>
            <dt>주 마감일</dt><dd>${rsiRow? rsiRow.d:'—'}</dd>
            <dt>전환 신호</dt><dd>${rsiRow&&rsiRow.sig? rsiRow.sig:'유지'}</dd>
            <dt>적용 시작일</dt><dd>${rsiRow? rsiRow.apply:'—'}</dd>

          </div>
        </div>

          ${fld(k+':rsiUpper','RSI 상단 (꺾이면 안전)',b.rsiUpper)}
          ${fld(k+':rsiLower','RSI 하단 (고개들면 공세)',b.rsiLower)}

      </div>

        <textarea id="wk-${k}" placeholder="2026-07-17\t566.12&#10;2026-07-24\t571.40">${(b.weekly||[]).map(w=>w.d+'\t'+w.c).join('\n')}</textarea></label>
      <div class="btnrow"><button class="btn sm" data-wk="${k}">주간 종가 반영</button>
        <span class="note" style="margin:0;align-self:center">${(b.weekly||[]).length}주 입력됨 · RSI는 Wilder 방식(시트와 동일)으로 계산됩니다</span></div>
    </div>
  </div>`;
  bindBook(k);
}

function recRows(k,b){
  const rs=(b.records||[]).slice().sort((a,c)=> a.d<c.d?-1:1);
  if(!rs.length) return `<tr><td colspan="8" class="empty">기록이 없습니다</td></tr>`;
  let acc=0;
  return rs.map((r,i)=>{ acc+=num(r.buy)-num(r.sell);
    return `<tr><td style="text-align:left">${esc(r.d)}${r.auto?' <span style="font-size:9px;color:var(--tx3);border:1px solid var(--line);border-radius:4px;padding:1px 4px">자동</span>':''}</td><td>${fUSD(num(r.close))}</td>
      <td class="up">${num(r.buy)||'—'}</td><td class="down">${num(r.sell)||'—'}</td>
      <td>${fUSD(num(r.buy)*num(r.close))}</td><td>${fUSD(num(r.sell)*num(r.close))}</td>
      <td>${fNum(acc)}주</td>
      <td><button class="btn sm dg" data-rdel="${k}:${esc(r.d)}">삭제</button></td></tr>`;
  }).reverse().join('');
}

function bindBook(k){
  const b=S.books[k], root=$('#p-'+k.toLowerCase());
  $$('[data-b]',root).forEach(el=> el.onchange=()=>{
    const [bk,f]=el.dataset.b.split(':');
    const v = el.tagName==='SELECT' ? (f==='sellDayBuyRule'? num(el.value): el.value) : num(el.value);
    S.books[bk][f]=v; touch(); renderBook(bk); });
  $$('[data-s]',root).forEach(el=> el.onchange=()=>{ S[el.dataset.s]=num(el.value); touch(); renderAll(); });
  $$('[data-tb]',root).forEach(el=> el.onclick=()=>{
    const [bk,f]=el.dataset.tb.split(':'); S.books[bk][f]=!S.books[bk][f]; touch(); renderBook(bk); });
  $$('[data-l]',root).forEach(el=> el.onchange=()=>{
    const [bk,i,f]=el.dataset.l.split(':');
    S.books[bk].lots[+i][f] = (f==='d'||f==='mode')? el.value : num(el.value);
    touch(); renderBook(bk); });
  $$('[data-relload]',root).forEach(el=> el.onclick=()=> loadRelease(el.dataset.relload));
  refreshBookFingerprint(k);
  $$('[data-ldel]',root).forEach(el=> el.onclick=()=>{
    const [bk,i]=el.dataset.ldel.split(':'); S.books[bk].lots.splice(+i,1); touch(); renderBook(bk); });
  $$('[data-ladd]',root).forEach(el=> el.onclick=()=>{
    S.books[k].lots.push(stampNewLot(S.books[k],{d:todayISO(), p:engine(b).prevClose, q:0, mode:engine(b).mode})); touch(); renderBook(k); });
  $$('[data-lbuy]',root).forEach(el=> el.onclick=()=>{
    const E=engine(b); if(!E.buyQty) return toast('오늘 매수 수량이 0입니다');
    S.books[k].lots.push(stampNewLot(S.books[k],{d:todayISO(), p:E.prevClose, q:E.buyQty, mode:E.mode}));
    S.books[k].records.push({d:todayISO(), close:E.prevClose, buy:E.buyQty, sell:0});
    touch(); renderBook(k); toast('로트와 기록에 추가했습니다'); });
  $$('[data-vx]',root).forEach(el=> el.onclick=()=>{
    const out=[];
    ($('#vx-'+k).value||'').split(/\n/).forEach(line=>{
      const m=line.trim().split(/[\t, ]+/).filter(Boolean); if(m.length<2) return;
      const d=m[0].replace(/[./]/g,'-'), c=num(m[1]); if(!/^\d{4}-\d{1,2}-\d{1,2}$/.test(d)||!c) return;
      const [y,mo,da]=d.split('-'); out.push({d:`${y}-${mo.padStart(2,'0')}-${da.padStart(2,'0')}`, c});
    });
    S.books[k].vxnSeries = out.sort((a,c)=> a.d<c.d?-1:1); touch(); renderBook(k);
    toast(out.length+'일 반영'); });
  $$('[data-wk]',root).forEach(el=> el.onclick=()=>{
    const txt=$('#wk-'+k).value, out=[];
    txt.split(/\n/).forEach(line=>{
      const m=line.trim().split(/[\t, ]+/).filter(Boolean); if(m.length<2) return;
      const d=m[0].replace(/[./]/g,'-'), c=num(m[1]); if(!/^\d{4}-\d{1,2}-\d{1,2}$/.test(d)||!c) return;
      const [y,mo,da]=d.split('-'); out.push({d:`${y}-${mo.padStart(2,'0')}-${da.padStart(2,'0')}`, c});
    });
    S.books[k].weekly = out.sort((a,c)=> a.d<c.d?-1:1); touch(); renderBook(k);
    toast(out.length+'주 반영 · 모드 재판정'); });
  $$('[data-stcalc]',root).forEach(el=> el.onclick=()=>{
    const p=num($('#st-p-'+k).value), d=$('#st-d-'+k).value||todayISO();
    const box=$('#st-out-'+k);
    if(!(p>0)) return box.innerHTML=`<div class="call warn" style="margin-top:12px">체결 종가를 입력하세요</div>`;
    const r=settle(b, engine(b), p, d);
    const dup=(b.records||[]).some(x=>x.d===d && !x.auto);
    box.innerHTML = `
      <div class="grid g2" style="margin-top:14px">
        <div class="call ${r.N>0?'buy':'hold'}"><div class="hd">매수</div>
          ${r.buyFills? `<b>${r.N}주</b> 체결 · ${fUSD(r.cost)}<br><span style="opacity:.8">종가 ${fUSD(p)} ≤ 지정가 ${fUSD(engine(b).buyLimit)}</span>`
                      : `미체결 — 종가 ${fUSD(p)} > 지정가 ${fUSD(engine(b).buyLimit)}`}</div>
        <div class="call ${r.S>0?'sell':'hold'}"><div class="hd">매도</div>
          ${r.S>0? `<b>${r.S}주</b> 체결 · ${fUSD(r.proceeds)}<br><span style="opacity:.8">실현손익 ${fUSD(r.realized)}</span>`
                 : '해당 로트 없음'}</div>
      </div>
      <div class="dl" style="margin-top:12px">
        <dt>실제 순매매</dt><dd class="${r.net>0?'up':r.net<0?'down':''}">${r.net>0?'+':''}${r.net}주 · 현금 ${r.cash>=0?'+':''}${fUSD(r.cash)}</dd>
        <dt>정리 후 로트</dt><dd>${(b.lots||[]).length}개 → ${r.keepLots}개</dd>
      </div>
      ${r.sells.length? `<div class="tw" style="margin-top:12px"><table style="min-width:520px">
        <thead><tr><th>삭제할 로트</th><th>수량</th><th>매수가</th><th>사유</th><th>손익</th></tr></thead>
        <tbody>${r.sells.map(l=>`<tr><td class="nm">#${l.i+1} <span style="color:var(--tx3);font-weight:400">${esc(l.d)}</span></td>
          <td style="color:var(--red)">−${l.q}주</td><td>${fUSD(num(l.p))}</td>
          <td style="text-align:left;font-size:12px">${l.expired?'기한 도래':'목표가 도달'}</td>
          <td class="${l.loss?'down':'up'}">${fUSD(l.gain)}</td></tr>`).join('')}</tbody></table></div>`:''}
      ${r.N>0? `<div class="call buy" style="margin-top:12px"><div class="hd">추가할 로트</div>
        ${d} · <b>${r.N}주</b> @ ${fUSD(p)} · ${r.mode} 모드 · 목표 ${fUSD(p*(1+(r.mode==='안전'?b.safeTarget:b.aggrTarget)+(2+(r.mode==='안전'?b.safeTarget:b.aggrTarget))*b.fee))}</div>`:''}
      ${r.ruleFlip? `<div class="call warn" style="margin-top:12px"><div class="hd">주의 — 매수금지 규칙 재판정</div>
        실제 종가 기준으로는 매수가 <b>${r.allowNow?'허용':'금지'}</b>입니다. 주문은 전일 종가 기준으로 이미 냈으므로
        계획 수량대로 반영합니다. 규칙을 엄격히 적용하려면 매수 부분을 수동으로 조정하세요.</div>`:''}
      ${dup? `<div class="call warn" style="margin-top:12px">${d} 기록이 이미 있습니다. 반영하면 <b>덮어씁니다.</b></div>`:''}
      <div class="card" style="margin-top:12px;background:var(--bg2,rgba(128,128,128,.06))">
        <div class="hd" style="font-weight:600;margin-bottom:8px">실제 체결 입력 <span class="hint">제안과 다르게 체결됐으면 수정 — 원장은 실제 값으로 기록됩니다</span></div>
        ${r.sells.length? `<table style="width:100%;font-size:12.5px"><tr><th style="text-align:left">매도 로트</th><th>계획</th><th>실제 수량</th></tr>
          ${r.sells.map((l,si)=>`<tr><td>${l.d} · ${fUSD(num(l.p))}</td><td style="text-align:center">${l.planSell}</td>
            <td style="text-align:center"><input data-stsq="${si}" value="${l.planSell}" inputmode="numeric" style="width:72px;text-align:center"></td></tr>`).join('')}
          </table>
          <div style="margin-top:6px"><label class="f" style="display:inline-flex;gap:6px;align-items:center"><span class="l">평균 매도단가 ($)</span>
            <input id="st-sp-${k}" value="${r.p}" style="width:110px"></label></div>`
        : '<div class="hint">오늘 매도 없음</div>'}
        <div style="margin-top:10px;display:flex;gap:12px;flex-wrap:wrap">
          <label class="f"><span class="l">실제 매수 수량</span><input id="st-bn-${k}" value="${r.N}" inputmode="numeric" style="width:90px"></label>
          <label class="f"><span class="l">실제 매수단가 ($)</span><input id="st-bp-${k}" value="${r.p}" style="width:110px"></label>
        </div>
      </div>
      <div class="btnrow"><button class="btn" data-stapply="${k}">원장·기록에 반영</button>
        <button class="btn g" data-stclear="${k}">닫기</button></div>`;
    box._r=r;
    $$('[data-stapply]',box).forEach(x=> x.onclick=()=>{
      const rr=box._r; const bb=S.books[k];
      // 실제 체결 값 수집
      const acts = rr.sells.map((l,si)=>{
        const el=box.querySelector(`[data-stsq="${si}"]`);
        const v=Math.max(0, Math.min(num(l.q), Math.floor(num(el? el.value : l.planSell))));
        return {i:l.i, act:v, plan:l.planSell};
      });
      const actS = acts.reduce((s,a)=>s+a.act,0);
      const actN = Math.max(0, Math.floor(num(($('#st-bn-'+k)||{}).value ?? rr.N)));
      const bpIn = num(($('#st-bp-'+k)||{}).value); const bp = bpIn>0? bpIn : rr.p;
      const spIn = num(($('#st-sp-'+k)||{}).value); const sp = spIn>0? spIn : rr.p;
      const manual = actS!==rr.S || actN!==rr.N || cents(bp)!==cents(rr.p) || (rr.S>0 && cents(sp)!==cents(rr.p));
      // 부분매도: 잔량 차감, 0이 되면 삭제 (계약 유지)
      const dec=new Map(acts.map(a=>[a.i,a.act]));
      bb.lots=(bb.lots||[]).map((l,i)=>{
        if(!dec.has(i)) return l;
        const rem=num(l.q)-dec.get(i);
        return rem>0 ? Object.assign({},l,{q:rem}) : null;
      }).filter(Boolean);
      if(actN>0) bb.lots.push(stampNewLot(bb,{d:rr.d, p:bp, q:actN, mode:rr.mode}));
      bb.records=(bb.records||[]).filter(x=>x.d!==rr.d);
      const rec={d:rr.d, close:rr.p, buy:actN, sell:actS};
      if(actN>0 && cents(bp)!==cents(rr.p)) rec.bp=bp;
      if(actS>0 && cents(sp)!==cents(rr.p)) rec.sp=sp;
      if(manual) rec.man=1;
      bb.records.push(rec);
      bb.records.sort((a,c)=> a.d<c.d?-1:1);
      touch(); renderBook(k);
      auditNote(k, 'settle', `${rr.d} 매수 ${actN}(계획 ${rr.N}) 매도 ${actS}(계획 ${rr.S})${manual?' · 수동수정':''}`);
      toast(`정산 완료 · 매수 ${actN}주 / 매도 ${actS}주 반영${manual?' (수동 수정됨)':''}`);
    });
    $$('[data-stclear]',box).forEach(x=> x.onclick=()=>{ box.innerHTML=''; });
  });
  $$('[data-radd]',root).forEach(el=> el.onclick=()=>{
    const d=$('#rd-'+k).value, c=num($('#rc-'+k).value);
    if(!d||!c) return toast('날짜와 종가를 입력하세요');
    S.books[k].records = (S.books[k].records||[]).filter(r=>r.d!==d);
    S.books[k].records.push({d, close:c, buy:num($('#rb-'+k).value), sell:num($('#rs-'+k).value)});
    S.books[k].prevClose = c; touch(); renderBook(k); toast('기록을 추가했습니다'); });
  $$('[data-rdel]',root).forEach(el=> el.onclick=()=>{
    const [bk,d]=el.dataset.rdel.split(':');
    S.books[bk].records=S.books[bk].records.filter(r=>r.d!==d); touch(); renderBook(bk); });
}

/* ── 시세 조회 : 직접 fetch → JSONP → 수동 붙여넣기 ───────── */
function applyQuote(j,src){
  if(!j || !j.prices) throw new Error('응답에 prices 가 없습니다');
  if(+j.fx>0) S.fx=+j.fx;
  const P=j.prices; QUOTE={}; let autoAdded=0;
  const pick=o=> ({ last:+(o.lastClose ?? o.price ?? 0) || 0,
                    lastD:(o.lastCloseDate||'').slice(0,10),
                    prev:+(o.prevClose ?? o.prev ?? 0) || 0,
                    prevD:(o.prevCloseDate||'').slice(0,10) });
  for(const k of Object.keys(P)){
    const q=pick(P[k]); if(!q.last) continue;
    QUOTE[k]=q;
    if(S.books[k]){
      S.books[k].price = q.last;
      if(!S.books[k].prevFromRecord) S.books[k].prevClose = q.last;
      autoAdded += autoRecord(k,q);
    }
    (S.holdings||[]).forEach(o=>{ if(o.t===k) o.p=q.last; });
  }
  // VXN 시계열 반영
  if(j.series && j.series.VXN && j.series.VXN.length){
    const vs=j.series.VXN.map(r=>({d:String(r[0]).slice(0,10), c:+r[1]})).filter(x=>x.c>0);
    bookKeys().forEach(k=>{ S.books[k].vxnSeries=vs.slice(-400); });
  }
  if(!Object.keys(QUOTE).length) throw new Error(
    '시트 아카이브가 비어 있습니다 — 「종목 데이터 수집」을 누르거나, 시트 메뉴 「2모드 콘솔 → 전체 시세 갱신」을 실행하세요');
  S.lastFetch = new Date().toLocaleString('ko-KR',{hour12:false}) + (src? ' · '+src : '');
  S.lastFetchDay = todayISO();
  return autoAdded;
}

/* 날짜 붙은 확정 종가 → ⑥ 일별 기록 자동 추가 (매매 수량 0)
   이미 그 날짜의 기록이 있으면 건드리지 않는다 — 사용자가 입력한 값이 항상 우선 */
function autoRecord(k,q){
  const b=S.books[k]; b.records=b.records||[];
  let n=0;
  const cutoff=lastCompletedUsSession();
  const ensure=(d,c)=>{
    if(!d||!(c>0)||!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
    if(d>cutoff) return;                                       // ★ 미완료 세션(장중 가격) 거부
    if(b.records.some(r=>r.d===d)) return;                     // 이미 있으면 유지
    const lastD=b.records.length? b.records.map(r=>r.d).sort().pop():'';
    if(lastD && d<lastD) return;                               // 과거 역주행 방지
    b.records.push({d, close:c, buy:0, sell:0, auto:true}); n++;
  };
  ensure(q.prevD,q.prev); ensure(q.lastD,q.last);
  if(n) b.records.sort((a,c)=> a.d<c.d?-1:1);
  return n;
}
function quoteTickers(){
  const t=[...bookKeys(),...(S.holdings||[]).map(o=>o.t).filter(Boolean)];
  if(bookKeys().some(k=>S.books[k].vxnOn)) t.push('VXN');
  return [...new Set(t)];
}
function quoteUrl(){ return hubUrl({mode:'quote', ids:quoteTickers().join(','), n:400}); }
function jsonp(url, ms){
  return new Promise((res,rej)=>{
    const cb='__q'+Math.random().toString(36).slice(2);
    const sc=document.createElement('script');
    const tm=setTimeout(()=>{clean();rej(new Error('시간 초과'))}, ms||20000);
    function clean(){ clearTimeout(tm); try{delete window[cb]}catch(e){} sc.remove(); }
    window[cb]=d=>{ clean(); res(d); };
    sc.onerror=()=>{ clean(); rej(new Error('스크립트 로드가 차단됨')); };
    sc.src=url+'&callback='+cb;
    document.body.appendChild(sc);
  });
}

/* ── 구글시트 클라우드 동기화 ─────────────────────────────
   설정된 gsUrl + syncToken 으로 앱 상태 전체를 _sync 탭에 저장/복원 */
function syncReady(){ return !!S.gsUrl; }
function hubUrl(params){
  const q=Object.assign({token:S.gsToken||''}, params);
  return S.gsUrl+(S.gsUrl.includes('?')?'&':'?')
    + Object.keys(q).map(k=>k+'='+encodeURIComponent(q[k])).join('&');
}
function syncUrl(action){ return hubUrl({mode:action==='save'?'cfgset':'cfgget'}); }
let pushTimer=null, lastPushErr='';
function cloudPush(){                      // save() 에서 자동 호출 (디바운스)
  if(!syncReady()) return;
  if(!S.syncLinked) return;                // ★ 최초 받기/올리기 전에는 자동 업로드 금지 (빈 상태로 덮어쓰기 방지)
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=> doPush(false,true), 1200);
}
async function doPush(force,silent){
  try{
    const r=await fetch(hubUrl({mode:'cfgset', ifmatch:S.cloudSavedAt||'', force:force?'1':'0', device:navigator.platform||'web'}),
                        {method:'POST', body:JSON.stringify(S)});
    const j=JSON.parse(await r.text());
    if(j.error==='conflict' || (j.ok===false && j.error==='conflict')){
      setSyncDot(false,'다른 기기가 더 최신 데이터를 올렸습니다 — 「클라우드에서 받기」 먼저');
      if(!silent) throw new Error('충돌 — 클라우드에 더 최신 데이터가 있습니다. 「클라우드에서 받기」로 먼저 확인하세요');
      return null;
    }
    if(/토큰/.test(j.error||'')) throw new Error(j.error);
    if(j.error && j.error!=='conflict') throw new Error(j.error);
    S.cloudSavedAt=j.savedAt; S.syncLinked=true; await Store.set(S);
    lastPushErr=''; setSyncDot(true,'클라우드 저장됨 '+new Date().toLocaleTimeString('ko-KR',{hour12:false}));
    return j;
  }catch(e){
    if(!silent) throw e;
    lastPushErr=e.message||'전송 실패'; setSyncDot(false,'클라우드 저장 실패: '+lastPushErr);
    return null;
  }
}
async function cloudPull(){
  if(!syncReady()) throw new Error('URL과 동기화 암호를 먼저 설정하세요');
  let j;
  try{ j=JSON.parse(await (await fetch(syncUrl('load'))).text()); }
  catch(e){ j=await jsonp(syncUrl('load'),12000); }     // CORS 차단 시 JSONP
  if(j.ok===false) throw new Error(j.error||'불러오기 실패');
  if(!j.cfg || !j.cfg.data) return {empty:true};
  return {state:JSON.parse(j.cfg.data), savedAt:j.cfg.at};
}

    feeModel:'exact', feeNettingMode:'legacy-overlap-netting',

    defaultMode:b.baseMode,
    vxnEnabled:!!b.vxnOn, vxnModel:'four-stage', vxnSource:'index',
    vxnStableThreshold:num(b.vxnCalm), vxnCautionThreshold:num(b.vxnWarn), vxnPanicThreshold:num(b.vxnPanic),
    vxnStableMultiplier:num(b.vxnCalmRatio), vxnNormalMultiplier:num(b.vxnNormRatio),

/* ── 허브 호출 헬퍼 : 직접 fetch 실패 시 JSONP ── */
async function hubGet(url){
  try{
    const r=await fetch(url,{redirect:'follow'});
    const t=await r.text();
    if(/<html/i.test(t)) throw new Error('HTML 반환 — 배포 액세스 권한 「모든 사용자」 확인');
    return JSON.parse(t);
  }catch(e){
    if(e instanceof TypeError || /fetch/i.test(e.message)) return await jsonp(url,15000);
    throw e;
  }
}
/* ── 최초 수집 : GOOGLEFINANCE 이력을 시트 아카이브에 적재 ──
   prepare(수식 기록) → collect(값 회수) 를 종목마다 수행. 로딩이 끝날 때까지 폴링. */
async function hubCollect(id, prog){
  const p=await hubGet(hubUrl({mode:'prepare', id, ticker:id, years:3}));
  if(p.ok===false) throw new Error(p.error||'prepare 실패');
  for(let i=0;i<12;i++){
    await new Promise(r=>setTimeout(r, i===0?3000:2500));
    if(prog) prog(`${id} 수집 중… (${i+1}/12)`);
    const c=await hubGet(hubUrl({mode:'collect', id, n:400}));
    if(c.done) return {ok:true, rows:c.rows, resolved:c.resolved};
    if(c.ok===false) return {ok:false, error:c.error||'수집 실패', diag:c.diag||''};
    if(!c.pending)   return {ok:false, error:'데이터를 받지 못했습니다', diag:c.diag||''};
  }
  return {ok:false, error:'시간 초과 — 잠시 후 다시 시도하세요'};
}
async function hubCollectAll(ids, prog){
  const done=[], fail=[];
  for(const id of ids){
    try{ const r=await hubCollect(id, prog); r.ok? done.push(id) : fail.push(id+'('+r.error+')'); }
    catch(e){ fail.push(id+'('+e.message+')'); }
  }
  return {done, fail};
}

/* Twelve Data — 무료 EOD 종가 (브라우저 직접 호출 허용, 하루 800크레딧) */
async function tdQuote(){
  const t=quoteTickers().filter(x=>x!=='VXN'&&x!=='USDKRW');
  const out={fx:0,prices:{}};
  const r=await fetch('https://api.twelvedata.com/time_series?symbol='+encodeURIComponent(t.join(','))
    +'&interval=1day&outputsize=2&apikey='+encodeURIComponent(S.tdKey));
  const j=await r.json();
  if(j.status==='error') throw new Error(j.message||'Twelve Data 오류');
  const one = j.values? {[t[0]]:j} : j;                 // 단일 심볼이면 평평한 형태로 옴
  for(const k of Object.keys(one)){
    const v=one[k]&&one[k].values; if(!v||!v.length) continue;
    out.prices[k.toUpperCase()]={
      lastClose:+v[0].close, lastCloseDate:v[0].datetime,
      prevClose:v[1]? +v[1].close:0, prevCloseDate:v[1]? v[1].datetime:'' };
  }
  try{
    const fr=await fetch('https://api.twelvedata.com/exchange_rate?symbol=USD/KRW&apikey='+encodeURIComponent(S.tdKey));
    const fj=await fr.json(); if(+fj.rate>0) out.fx=+fj.rate;
  }catch(e){}
  if(!Object.keys(out.prices).length) throw new Error('종가 데이터가 비어 있습니다');
  return out;
}

/* Claude API + 웹검색으로 시세 조회 — 아티팩트 안에서 동작하는 유일한 자동 경로 */
async function aiQuote(){
  const t=quoteTickers().filter(x=>x!=='VXN'&&x!=='USDKRW');
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:1500,
      tools:[{type:'web_search_20250305',name:'web_search'}],
      messages:[{role:'user',content:
        'Today is '+todayISO()+'. For each of these US-listed ETFs/stocks: '+t.join(', ')+
        ' find the two most recent DAILY CLOSING prices with their exact trading dates. '+
        'Search each ticker separately and use the official daily close, not an intraday or delayed quote. '+
        'Also find the current USD/KRW exchange rate. '+
        'Return JSON only, no markdown fences, no commentary, exactly: '+
        '{"fx":1400.0,"prices":{"SOXL":{"lastClose":0,"lastCloseDate":"YYYY-MM-DD","prevClose":0,"prevCloseDate":"YYYY-MM-DD"}}} '+
        'lastClose = most recent completed session close. prevClose = the session before that. '+
        'If you cannot verify a ticker, omit it entirely rather than guessing.'}] })});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data=await res.json();
  const txt=(data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n');
  const a=txt.indexOf('{'), b=txt.lastIndexOf('}');
  if(a<0||b<0) throw new Error('시세를 해석하지 못했습니다');
  return JSON.parse(txt.slice(a,b+1));
}

function migrate(o){
  const s=JSON.parse(JSON.stringify(DEFAULT));
  Object.assign(s,o);
  s.books={};
  const srcBooks=o.books||{};
  for(const k of [...new Set([...Object.keys(DEFAULT.books), ...Object.keys(srcBooks)])]){
    s.books[k]=newBook(Object.assign({ticker:k}, DEFAULT.books[k]||{}, srcBooks[k]||{}));
  }
  s.holdings=o.holdings||o.others||DEFAULT.holdings; delete s.others;
  s.snapshots=o.snapshots||[];
  s.syncLinked=false;   // 기기별 상태 — 받은 쪽에서 다시 설정
  return s;
}

    + bookKeys().map(k=>`<button class="tab" data-p="${k.toLowerCase()}"><span class="g">${bookGlyph(k)}</span><span class="t">${k}</span></button>`).join('')
    + `<button class="tab" data-p="set"><span class="g">⚙</span><span class="t">설정</span></button>`;
  // 페이지 컨테이너 동기화 (p-ov, p-set 은 고정)
  const main=document.querySelector('main.wrap');

      main.insertBefore(sec, document.getElementById('p-set'));

  const target = $$('.tab').find(t=>t.dataset.p===cur) || $$('.tab')[0];

    $$('.tab').forEach(x=>x.classList.remove('on')); t.classList.add('on');

    $$('.page').forEach(p=>p.classList.remove('on'));

  }
  /* 다른 기기에서 수정한 내용 자동 반영:
     탭이 다시 활성화되면 저장소 최신본을 다시 읽어온다 */
  document.addEventListener('visibilitychange', async ()=>{
    if(document.visibilityState!=='visible' || !window.storage) return;
    try{
      const fresh=await Store.get();
      if(fresh && JSON.stringify(fresh)!==JSON.stringify(S)){
        S=migrate(fresh); renderAll(); toast('다른 기기의 변경사항을 불러왔습니다');
      }
    }catch(e){}
  });
})();
</script>
</body>
</html>
