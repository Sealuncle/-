<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="레버리지 콘솔">
<meta name="mobile-web-app-capable" content="yes">
<title>레버리지 콘솔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1014; --bg2:#0E1014; --card:#171A20; --card2:#1E222A; --line:#2A2F38; --line2:#23272F;
  --tx:#ECEEF1; --tx2:#A1A7B0; --tx3:#8A919C; --tx4:#5D636D;
  --up:#FF8A8A; --upf:#FF6B6B; --dn:#6FB0FF; --dnf:#5AA2FF;
  --red:#FF6B6B; --amber:#F5B94A; --green:#3DD68C; --orange:#F2761F; --blue:#5AA2FF; --purple:#8b5cf6;
  --ok:#7BE3AD; --okbg:#13291E; --warn:#F5C76A; --warnbg:#33270F; --warnline:#6B5320; --bad:#FF8A8A;
  --safe:#7EE6D3; --safebg:#12302D; --aggr:#FFB49E; --aggrbg:#3A1E16;
  --acc:#2563EB; --accbg:#15243A; --accline:#2B4568; --acctx:#A9C8EE;
  --nav:#111318;
  --r:16px; --r2:12px;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',system-ui,sans-serif;
  --navh:64px;
}
html[data-theme="light"]{
  --bg:#F4F5F7; --bg2:#FFFFFF; --card:#FFFFFF; --card2:#F1F3F6; --line:#E1E4E9; --line2:#ECEEF2;
  --tx:#14171C; --tx2:#545C68; --tx3:#6A717C; --tx4:#9AA0A9;
  --up:#D33A30; --upf:#E5483D; --dn:#1F5FD1; --dnf:#2F6FE4;
  --ok:#147A3D; --okbg:#E4F5EA; --warn:#8A5A00; --warnbg:#FDF3DD; --warnline:#EBCB85; --bad:#C1352B;
  --safe:#0E6B5C; --safebg:#DDF4EF; --aggr:#9A3A1E; --aggrbg:#FCE9E3;
  --acc:#2563EB; --accbg:#E8F0FD; --accline:#B9CFF5; --acctx:#1E4FA8;
  --nav:#FFFFFF;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;overflow-x:hidden;
  padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 12px)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--dn)}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}

/* 상단 바 */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.brand{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;margin:0}
.top .sp{flex:1}
.syncpill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:0 12px;height:36px;white-space:nowrap}
.syncpill .dot{width:7px;height:7px;border-radius:50%;background:var(--tx4)}
.iconbtn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--tx2);display:flex;align-items:center;justify-content:center;flex:none}

/* 하단 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--nav);border-top:1px solid var(--line2);
  padding-bottom:env(safe-area-inset-bottom)}
.tabs .inner{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:4px 8px}
.tab{background:none;border:0;min-height:52px;color:var(--tx3);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;font-size:11px;position:relative}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--tx);font-weight:500}
.tab .badge-n{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--upf);
  color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* 페이지 */
.page{display:none;padding:6px 0 20px}
.page.on{display:block}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card+.card{margin-top:12px}
.card h2,.h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.between{justify-content:space-between}
.row.base{align-items:baseline}
.mut{color:var(--tx2)} .mut3{color:var(--tx3)}
.s12{font-size:12px} .s13{font-size:13px} .s14{font-size:14px}
.b{font-weight:700} .m{font-weight:500}
.up{color:var(--up)} .down{color:var(--dn)}
.grow{flex:1;min-width:0}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 칩·알약 */
.chipbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px}
.chipbar::-webkit-scrollbar{display:none}
.tchip{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--tx2);font-size:14px;display:flex;align-items:center;gap:6px}
.tchip.on{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:700}
.tchip .n{font-size:11px;border-radius:999px;background:var(--upf);color:#fff;padding:0 6px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:999px;padding:5px 10px;line-height:1.3;
  background:var(--card);border:1px solid var(--line);color:var(--tx2)}
.pill.safe{background:var(--safebg);border-color:transparent;color:var(--safe);font-weight:500}
.pill.aggr{background:var(--aggrbg);border-color:transparent;color:var(--aggr);font-weight:500}
.pill.ok{background:var(--okbg);border-color:transparent;color:var(--ok);font-weight:500}
.pill.warn{background:var(--warnbg);border-color:transparent;color:var(--warn);font-weight:500}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:flex;gap:3px;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:3px}
.seg button{height:34px;padding:0 12px;border-radius:8px;border:0;background:none;color:var(--tx2);font-size:13px}
.seg button.on{background:var(--card2);color:var(--tx);font-weight:700}

/* 버튼 */
.btn{min-height:44px;border-radius:12px;border:0;background:var(--acc);color:#fff;font-weight:700;font-size:14px;padding:0 16px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.g{background:var(--card2);color:var(--tx);border:1px solid var(--line);font-weight:500}
.btn.dg{background:none;border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad);font-weight:500}
.btn{white-space:nowrap}
.btn.sm{min-height:36px;font-size:13px;padding:0 12px;border-radius:10px}
.btn.wide{width:100%}
.btn.big{min-height:52px;font-size:16px;border-radius:14px}
.btn[disabled]{opacity:.55}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.linkrow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 18px;background:none;border:0;
  border-top:1px solid var(--line2);color:var(--tx);text-align:left;text-decoration:none}
.linkrow:first-child{border-top:0}
.linkrow svg{flex:none;color:var(--tx3)}
.mini{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--tx);font-size:12px}

/* 하단 고정 액션 */
.actionbar{position:sticky;bottom:calc(var(--navh) + env(safe-area-inset-bottom));z-index:30;margin:14px -16px 0;padding:12px 16px;
  background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line2)}
.actionbar .sub2{font-size:12px;color:var(--tx3);text-align:center;margin-top:8px}

/* 주문표 */
.ord{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}
.ord:first-of-type{border-top:0}
.ord .no{flex:none;width:20px;font-size:13px;color:var(--tx3);padding-top:2px}
.ord .q{font-size:16px;font-weight:500}
.side-b{color:var(--up)} .side-s{color:var(--dn)}
.band{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;background:var(--card2);margin-top:6px}
.band.hit{background:var(--accbg);border:1px solid var(--accline)}
.band .rg{flex:none;width:96px;font-size:13px}
.band .ds{flex:1;font-size:12px;color:var(--tx2);min-width:0}
.band .nt{flex:none;font-size:14px;font-weight:700}
.note-box{font-size:12px;color:var(--tx2);background:var(--card2);border-radius:10px;padding:9px 11px;margin-top:10px;line-height:1.55}
.note-box.warn{background:var(--warnbg);color:var(--warn)}
.alert{border-radius:var(--r2);padding:12px 14px;font-size:13px;line-height:1.55;background:var(--warnbg);color:var(--warn);border:1px solid var(--warnline)}
.alert b{font-weight:700}
.alert.info{background:var(--accbg);border-color:var(--accline);color:var(--acctx)}
.alert.bad{background:color-mix(in srgb,var(--bad) 14%,var(--card));border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}

/* 로트 카드 */
.lot{padding:14px 0;border-top:1px solid var(--line2)}
.lot:first-of-type{border-top:0}
.lot .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;background:none;border:0;padding:0;color:var(--tx);text-align:left;min-height:28px}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--dnf);border-radius:3px}
.bar>i.w{background:var(--amber)} .bar>i.x{background:var(--upf)}
.lotx{margin-top:10px;padding:12px;border-radius:12px;background:var(--card2);font-size:13px}

/* 개요 그래프 */
.chart svg{display:block;width:100%;height:auto}
.bars{display:flex;align-items:stretch;gap:1px;height:76px;margin-top:6px}
.bars>div{flex:1;display:flex;flex-direction:column;min-width:0}
.bars .u{flex:1;display:flex;align-items:flex-end;justify-content:center}
.bars .d{flex:1;display:flex;align-items:flex-start;justify-content:center}
.bars .u i,.bars .d i{display:block;width:80%;min-width:1px}
.bars .u i{background:var(--upf);border-radius:2px 2px 0 0}
.bars .d i{background:var(--dnf);border-radius:0 0 2px 2px}
.bars .z{height:1px;background:var(--line)}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.kbox{background:var(--card2);border-radius:12px;padding:10px 12px;min-width:0}
.kbox .k{font-size:12px;color:var(--tx2)}
.kbox .v{font-size:17px;font-weight:700;margin-top:2px}
.kbox .d{font-size:11px;color:var(--tx3)}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.mgrid .k{font-size:12px;color:var(--tx2)} .mgrid .v{font-size:15px;font-weight:500;margin-top:2px}

/* 할 일 */
.todo{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line2);min-height:56px;width:100%;
  background:none;border-left:0;border-right:0;border-bottom:0;color:var(--tx);text-align:left}
.todo:first-of-type{border-top:0}
.todo .no{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;
  border:1px solid var(--line);color:var(--tx2)}
.todo.now .no{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.todo.done .no{background:var(--okbg);border-color:transparent;color:var(--ok)}

/* 정산 */
.srow{display:flex;align-items:center;gap:6px;border-radius:12px;border:1px solid var(--line);background:var(--card2);padding:6px 6px 6px 4px;margin-top:8px}
.srow.on{border:1.5px solid var(--dnf);background:var(--accbg)}
.srow .lbl{flex:1;min-width:0;min-height:52px;padding:4px 8px;border:0;background:none;color:var(--tx);text-align:left}
.stepper{flex:none;display:flex;align-items:center;background:var(--bg2);border-radius:10px}
.stepper button{width:40px;height:44px;border:0;background:none;color:var(--tx);font-size:20px}
.stepper span{min-width:30px;text-align:center;font-size:16px;font-weight:700}
.tag{font-size:11px;font-weight:700;border-radius:999px;padding:2px 7px}
.tag.part{background:var(--amber);color:#1a1205}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.preview{background:var(--accbg);border:1px solid var(--accline);border-radius:var(--r);padding:14px 16px;color:var(--acctx)}
.preview .ln{display:flex;gap:8px;font-size:14px;line-height:1.55;margin-top:6px}
.preview .ln span:first-child{flex:none;width:14px}

/* 일지 */
.ev{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.ev.adj{border-color:var(--warnline)}
.ev .ic{flex:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card2);color:var(--tx2)}
.ev .ic.ok{background:var(--okbg);color:var(--ok)} .ev .ic.wn{background:var(--warnbg);color:var(--warn)} .ev .ic.ac{background:var(--accbg);color:var(--dn)}
.daylabel{font-size:13px;color:var(--tx2);margin:10px 4px 0}
.lrow2{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line2);font-size:14px}
.lrow2:first-child{border-top:0}

/* details 접기 */
details.fold{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.fold+details.fold{margin-top:0}
details.fold>summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 18px;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .chev{flex:none;color:var(--tx3);transition:transform .15s}
details.fold[open]>summary .chev{transform:rotate(90deg)}
details.fold>.inner{padding:0 18px 16px;border-top:1px solid var(--line2);padding-top:14px}

/* 폼 (설정 화면 공용) */
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fgrid.c1{grid-template-columns:minmax(0,1fr)}
.fgrid.c3{grid-template-columns:repeat(2,minmax(0,1fr))}
label.f{display:block;min-width:0}
label.f .l{font-size:12px;color:var(--tx2);display:block;margin-bottom:6px;line-height:1.35}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:44px;font-size:16px;outline:none;color:var(--tx)}
textarea{padding:10px 12px;min-height:110px;resize:vertical;line-height:1.6;font-family:var(--mono);font-size:13px}
input:focus,select:focus,textarea:focus{border-color:var(--dnf)}
input[readonly]{color:var(--tx2)}
input[type=checkbox]{width:auto;min-height:0}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);min-height:56px}
.sw:last-child{border-bottom:0}
.sw .t{font-size:14px;min-width:0}
.sw .t small{display:block;color:var(--tx3);font-size:12px;margin-top:2px}
.toggle{width:50px;height:30px;border-radius:999px;background:var(--line);border:0;position:relative;flex:none}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.16s}
.toggle.on{background:#2FA864}
.toggle.on::after{left:23px}

/* 기존 설정 화면 호환 */
.eyebrow{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--tx3);margin:8px 0 6px;flex-wrap:wrap}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--tx2);font-size:13px;margin:0 0 14px}
.sec{margin-top:18px}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.sec-h .n{font-size:11px;color:var(--tx3);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.sec-h h2{font-size:16px;font-weight:700;margin:0}
.sec-h .hint{margin-left:auto;font-size:12px;color:var(--tx3)}
.grid{display:grid;gap:12px} .g2{grid-template-columns:minmax(0,1fr)}
.statrow{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.stat .k{font-size:12px;color:var(--tx2)} .stat .v{font-size:20px;font-weight:700;margin-top:4px} .stat .d{font-size:12px;color:var(--tx3)}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2);min-width:0}
.lrow:last-child{border-bottom:0}
.lrow .nm{font-weight:700;font-size:15px} .lrow .sp{flex:1}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:0 18px;max-width:calc(100% + 36px)}
table{border-collapse:collapse;width:100%}
th{font-size:11px;color:var(--tx3);text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:500}
th:first-child,td:first-child{text-align:left}
td{padding:9px 8px;border-bottom:1px solid var(--line2);font-size:13px;text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
.empty{color:var(--tx3);font-size:13px;text-align:center;padding:22px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--tx2)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:700}
.call{border-radius:var(--r2);padding:12px 14px;font-size:13px;line-height:1.55;border:1px solid var(--line);background:var(--card2);color:var(--tx2)}
.call .hd{font-size:12px;font-weight:700;margin-bottom:4px}
.call.buy{background:var(--okbg);border-color:transparent;color:var(--ok)}
.call.sell,.call.warn{background:var(--warnbg);border-color:var(--warnline);color:var(--warn)}
.call.hold{background:var(--card2)}
.call b{color:inherit}
.badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.badge.a{background:var(--aggrbg);border-color:transparent;color:var(--aggr)}
.badge.s{background:var(--safebg);border-color:transparent;color:var(--safe)}
.note{font-size:12px;color:var(--tx3);line-height:1.6;margin-top:10px}
.note b{color:var(--tx2)}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:13px}
.dl dt{color:var(--tx3);font-size:12px} .dl dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--mono)}
.foot{text-align:center;font-size:11px;color:var(--tx4);padding:22px 0 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 64px);
  width:max-content;max-width:calc(100vw - 32px);line-height:1.45;background:var(--tx);color:var(--bg);font-size:13px;font-weight:700;padding:10px 18px;border-radius:999px;
  z-index:99;opacity:0;pointer-events:none;transition:.2s;text-align:center}
.toast.on{opacity:1}
svg{max-width:100%}
.maskin{-webkit-text-security:disc;text-security:disc}
.maskin.show{-webkit-text-security:none;text-security:none}

<script>
/* 초기 시드값 없음 — 개인 데이터는 소스에 포함하지 않습니다. 아래 함수로 예시(가짜) 데이터만 넣습니다. */
const SEED_WEEKLY = [];
const SEED_SOXL_LOTS = [];
const SEED_SOXL_REC = [];
const SEED_TQQQ_LOTS = [];
const SEED_TQQQ_REC = [];
/* ============================================================
   1. 저장소 어댑터  (Claude 아티팩트 storage → localStorage 순)
   ============================================================ */
const APP_BUILD='console-3.0.0-mobile';
const KEY = 'lev2mode:v1';
const Store = {
  mode: 'local',
  async get(){
    if (window.storage) {
      try { const r = await window.storage.get(KEY); this.mode='cloud'; if(r&&r.value) return JSON.parse(r.value); }
      catch(e){ this.mode='cloud'; }
    }
    try { const s = localStorage.getItem(KEY); if(s) return JSON.parse(s); } catch(e){}
    return null;
  },
  async set(obj){
    const s = JSON.stringify(obj);
    try { localStorage.setItem(KEY, s); } catch(e){}
    if (window.storage) { try { await window.storage.set(KEY, s); this.mode='cloud'; return true; } catch(e){ return false; } }
    return true;
  },
  /* 임의 키 접근 (백업용) */
  async rawGet(k){
    if (window.storage) { try { const r=await window.storage.get(k); if(r&&r.value!=null) return r.value; } catch(e){} }
    try { return localStorage.getItem(k); } catch(e){ return null; }
  },
  async rawSet(k,v){
    try { localStorage.setItem(k,v); } catch(e){}
    if (window.storage) { try { await window.storage.set(k,v); } catch(e){} }
    return true;
  },
  async rawDel(k){
    try { localStorage.removeItem(k); } catch(e){}
    if (window.storage) { try { await window.storage.delete(k); } catch(e){} }
  }
};

/* ============================================================
   1-2. 자격증명 보안 (PIN 기반 AES-GCM 암호화)
   ── 웹앱 주소·접근 토큰은 평문 저장하지 않고, PIN으로 봉인할 수 있습니다.
      PIN을 걸면 앱을 열 때마다 PIN을 입력해야 시트에 접근합니다.
   ============================================================ */
const CRED_KEY='lev2mode:cred', CRED_FIELDS=['gsUrl','gsToken','tdKey'];
let CRED_TOUCHED=false;   // 사용자가 자격증명 칸을 직접 만졌는지 (자동완성 구분용)
const b64={ enc:buf=>btoa(String.fromCharCode(...new Uint8Array(buf))),
            dec:str=>Uint8Array.from(atob(str), c=>c.charCodeAt(0)) };
async function deriveKey(pin, salt){
  const base=await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function sealCreds(pin, obj){
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pin, salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  return {v:1, s:b64.enc(salt), i:b64.enc(iv), c:b64.enc(ct)};
}
async function openCreds(pin, box){
  const key=await deriveKey(pin, b64.dec(box.s));
  const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64.dec(box.i)}, key, b64.dec(box.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
const credBox=()=>{ try{ return JSON.parse(localStorage.getItem(CRED_KEY)||'null'); }catch(e){ return null; } };
const isLocked=()=>!!credBox();

/* ============================================================
   2. 유틸
   ============================================================ */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const num = v => { const n = parseFloat(String(v??'').replace(/,/g,'')); return isFinite(n)?n:0; };
const r2  = v => Math.round(v*100)/100;
const cents = v => Math.round(v*100);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const D = s => { if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };

/** 엑셀 NETWORKDAYS(start,end) — 주말 제외, 양끝 포함 */
function networkDays(a,b){
  if(!a||!b) return 0;
  let s=new Date(a), e=new Date(b), sign=1;
  if(s>e){ [s,e]=[e,s]; sign=-1; }
  let n=0; const cur=new Date(s);
  while(cur<=e){ const w=cur.getDay(); if(w!==0&&w!==6) n++; cur.setDate(cur.getDate()+1); }
  return sign*n;
}

/* ── 미국 거래 세션 시계 ─────────────────────────────────
   기준 종가 = "완료된 마지막 미국 세션"의 종가.
   ET 16:05 이전에는 당일 세션이 미완료이므로 전 거래일이 기준. */
// 정규 휴장일. 임시 휴장은 YYYY-MM-DD를 EXTRA_US_HOLIDAYS에 추가한다.
var EXTRA_US_HOLIDAYS = ['2025-01-09'];
function isUsTradingDay_(d) {
  var y=d.getFullYear(), m=d.getMonth(), day=d.getDate(), w=d.getDay();
  if(w===0 || w===6) return false;
  var iso=y+'-'+('0'+(m+1)).slice(-2)+'-'+('0'+day).slice(-2);
  if(EXTRA_US_HOLIDAYS.indexOf(iso)>=0) return false;
  function observed(month, date, saturday) {
    var x=new Date(y,month,date,12);
    if(x.getDay()===6 && saturday!==false) x.setDate(x.getDate()-1);
    if(x.getDay()===0) x.setDate(x.getDate()+1);
    return m===x.getMonth() && day===x.getDate();
  }
  if(observed(0,1,false) || observed(6,4) || observed(11,25) || (y>=2022 && observed(5,19))) return false;
  if(w===1 && ((m===0 && day>=15 && day<=21) || (m===1 && day>=15 && day<=21) || (m===4 && day>=25) || (m===8 && day<=7))) return false;
  if(m===10 && w===4 && day>=22 && day<=28) return false;
  var a=y%19,b=Math.floor(y/100),c=y%100,e=Math.floor(b/4),f=Math.floor((b+8)/25),
      gg=Math.floor((b-f+1)/3),hh=(19*a+b-e-gg+15)%30,i=Math.floor(c/4),k=c%4,
      l=(32+2*(b%4)+2*i-hh-k)%7,n=Math.floor((a+11*hh+22*l)/451),z=hh+l-7*n+114;
  var friday=new Date(y,Math.floor(z/31)-1,z%31+1,12); friday.setDate(friday.getDate()-2);
  return !(m===friday.getMonth() && day===friday.getDate());
}

function usEasternNow(){
  const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',
    year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})
    .formatToParts(new Date());
  const g=t=>+p.find(x=>x.type===t).value;
  return {y:g('year'),m:g('month'),d:g('day'),H:(g('hour')%24),M:g('minute')};
}
const fmtD=dt=>dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
function lastCompletedUsSession(){
  const n=usEasternNow();
  const closed=(n.H>16)||(n.H===16&&n.M>=5);        // 16:05 버퍼
  let dt=new Date(n.y,n.m-1,n.d,12);
  if(!closed) dt.setDate(dt.getDate()-1);
  while(!isUsTradingDay_(dt)) dt.setDate(dt.getDate()-1);
  return fmtD(dt);
}
function targetUsSession(){                          // 지금 낼 주문이 체결될 세션
  const n=usEasternNow();
  const closed=(n.H>16)||(n.H===16&&n.M>=5);
  let dt=new Date(n.y,n.m-1,n.d,12);
  if(closed) dt.setDate(dt.getDate()+1);
  while(!isUsTradingDay_(dt)) dt.setDate(dt.getDate()+1);
  return fmtD(dt);
}

const fUSD = (v,d=2) => (v<0?'-':'')+'$'+Math.abs(v).toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fNum = (v,d=0) => v.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fPct = (v,d=1) => (v>=0?'':'')+ (v*100).toFixed(d)+'%';
/** 6.87억 / 3327만 / 1,240원 표기 */
function fKRW(v){
  const a=Math.abs(v), sg=v<0?'-':'';
  if(a>=1e8) return sg+(a/1e8).toFixed(2)+'억';
  if(a>=1e4) return sg+Math.round(a/1e4).toLocaleString('ko-KR')+'만';
  return sg+Math.round(a).toLocaleString('ko-KR');
}
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1800); }

/* ════════════════════════════════════════════════════════════════
   StrategyCore — 2모드 분할매매 공통 전략 엔진
   콘솔과 백테스터에 "문자 단위로 동일하게" 삽입된다.
   UI 렌더링과 원장 조작은 이 모듈 밖에서 한다.
   ════════════════════════════════════════════════════════════════ */
const StrategyCore = (() => {
  'use strict';

  const ENGINE_VERSION = '2mode-core-1.0.0';
  const STRATEGY_SCHEMA_VERSION = 2;

  const cents = v => Math.round(v * 100);

  /* ── 매수 지정가 ─────────────────────────────────────────────
     전략 조건: 종가 < 전일종가 × (1 + 매수제한률)  (엄격 부등식)
     이 부등식을 만족하는 가장 높은 센트 가격을 지정가로 쓴다. */
  function calcStrictBuyLimitCents(prevClose, rate) {
    const rawCents = prevClose * (1 + rate) * 100;
    return Math.ceil(rawCents - 1e-10) - 1;
  }
  function calcBuyLimit(prevClose, rate) {
    return calcStrictBuyLimitCents(prevClose, rate) / 100;
  }

  /* ── 주문 수량 (지정가 기준 사전 확정) ─────────────────────
     실제 종가가 지정가보다 낮아도 수량을 사후에 늘리지 않는다. */
  function calcPlannedBuyQty(availableBuyBudget, buyLimit, buyFeeRate) {
    if (!(buyLimit > 0) || !(availableBuyBudget > 0)) return 0;
    return Math.floor(availableBuyBudget / (buyLimit * (1 + (buyFeeRate || 0))));
  }

  /* ── 목표가 ──────────────────────────────────────────────────
     exact  : P×(1+buyFee)×(1+r)÷(1−sellFee), 조건 충족 최소 센트로 올림
     legacy-approx : P×(1+r+(2+r)×f)  — 구 시트 호환(올림 없음) */
  function calcTargetPrice(buyPrice, targetReturnRate, buyFeeRate, sellFeeRate, feeModel) {
    if (feeModel === 'legacy-approx') {
      const f = buyFeeRate;
      return buyPrice * (1 + targetReturnRate + (2 + targetReturnRate) * f);
    }
    const raw = buyPrice * (1 + buyFeeRate) * (1 + targetReturnRate) / (1 - sellFeeRate);
    return Math.ceil(raw * 100 - 1e-10) / 100;
  }

  /* ── VXN 4단계 ───────────────────────────────────────────── */
  function classifyVxn(value, cfg) {
    if (value === null || value === undefined || !isFinite(value)) {
      return { stage: 'missing', multiplier: null, forceSafe: false };
    }
    if (value < cfg.vxnStableThreshold) {
      return { stage: 'stable', multiplier: cfg.vxnStableMultiplier, forceSafe: false };
    }
    if (value < cfg.vxnCautionThreshold) {
      return { stage: 'normal', multiplier: cfg.vxnNormalMultiplier, forceSafe: false };
    }
    if (value < cfg.vxnPanicThreshold) {
      return { stage: 'caution', multiplier: cfg.vxnCautionMultiplier,
               forceSafe: !!cfg.vxnForceSafeOnCaution };
    }
    return { stage: 'panic', multiplier: cfg.vxnPanicMultiplier,
             forceSafe: !!cfg.vxnForceSafeOnPanic };
  }
  const VXN_STAGE_KO = { stable: '안정', normal: '보통', caution: '경계', panic: '패닉', missing: '데이터 없음' };

  /* ── 유효 모드 ───────────────────────────────────────────────
     baseMode('공세'|'안전'|'방어') 에 VXN 강제안전을 결합한다.
     '방어'(위험필터)는 VXN보다 우선한다. */
  function resolveEffectiveMode(baseMode, vxnStageInfo, vxnEnabled) {
    if (!vxnEnabled || !vxnStageInfo) return baseMode;
    if (baseMode === '방어') return baseMode;
    if (vxnStageInfo.forceSafe) return '안전';
    return baseMode;
  }

  /* ── 최종 매수 배수 ──────────────────────────────────────────
     위험필터 배수 × VXN 배수. VXN 데이터 누락 시 null(매수 보류). */
  function resolveBuyMultiplier(riskRatio, vxnStageInfo, vxnEnabled) {
    const r = isFinite(riskRatio) ? riskRatio : 1;
    if (!vxnEnabled) return r;
    if (!vxnStageInfo || vxnStageInfo.stage === 'missing' || vxnStageInfo.multiplier === null) return null;
    return r * vxnStageInfo.multiplier;
  }

  /* ── 매수 주문 평가 ──────────────────────────────────────────
     ctx = { prevClose, buyCapRate, chunkAmount, cash, buyFeeRate,
             multiplier(null=VXN누락), openLots, maxOpenLots(0=무제한),
             blockedBySellRule(bool) }
     반환 = { allowed, reason, limit, plannedQty, budget } */
  function evaluateBuyOrder(ctx) {
    const out = { allowed: false, reason: '', limit: null, plannedQty: 0, budget: 0 };
    if (ctx.blockedBySellRule) { out.reason = 'SELL_DAY_RULE'; return out; }
    if (ctx.multiplier === null) { out.reason = 'VXN_DATA_MISSING'; return out; }
    if (ctx.multiplier <= 0) { out.reason = 'MULTIPLIER_ZERO'; return out; }
    const cap = ctx.maxOpenLots > 0 ? ctx.maxOpenLots : Infinity;
    if (ctx.openLots >= cap) { out.reason = 'MAX_OPEN_LOTS'; return out; }
    if (!(ctx.prevClose > 0)) { out.reason = 'NO_PREV_CLOSE'; return out; }

    const limit = calcBuyLimit(ctx.prevClose, ctx.buyCapRate);
    const budget = Math.min(ctx.chunkAmount * ctx.multiplier, ctx.cash); // 차입 금지
    const qty = calcPlannedBuyQty(budget, limit, ctx.buyFeeRate);
    out.limit = limit; out.budget = budget; out.plannedQty = qty;
    if (qty <= 0) { out.reason = 'INSUFFICIENT_CASH'; return out; }
    out.allowed = true; out.reason = 'OK';
    return out;
  }

  /* ── 매수 체결 판정 ────────────────────────────────────────── */
  function isBuyFilled(actualClose, buyLimit) {
    return cents(actualClose) <= cents(buyLimit);
  }

  /* ── 보유 세션 수 ────────────────────────────────────────────
     완료된 거래 세션 인덱스 기준. 매수 세션 자체는 0으로 센다
     (기존 콘솔·백테스터의 '매수 다음날부터' 규칙 유지). */
  function calcHoldingSessions(currentSessionIndex, buySessionIndex) {
    return currentSessionIndex - buySessionIndex;
  }

  /* ── 매도 평가 ───────────────────────────────────────────────
     lot = { targetPrice, maxHoldSessions, buySessionIndex, qty }
     반환 = { shouldSell, kind('TARGET'|'EXPIRE'|null), heldSessions }
     실제 정산가는 항상 당일 종가다. */
  function evaluateSellForLot(lot, actualClose, currentSessionIndex) {
    const held = calcHoldingSessions(currentSessionIndex, lot.buySessionIndex);
    if (held < 1) return { shouldSell: false, kind: null, heldSessions: held };
    if (held >= lot.maxHoldSessions) return { shouldSell: true, kind: 'EXPIRE', heldSessions: held };
    if (cents(actualClose) >= cents(lot.targetPrice)) {
      return { shouldSell: true, kind: 'TARGET', heldSessions: held };
    }
    return { shouldSell: false, kind: null, heldSessions: held };
  }
  function evaluateSellOrders(lots, actualClose, currentSessionIndex) {
    return (lots || []).map(l => Object.assign(
      { lot: l }, evaluateSellForLot(l, actualClose, currentSessionIndex)));
  }

  /* ── 전략 설정 정규화·지문 ─────────────────────────────────── */
  const STRATEGY_KEYS = [
    'symbol', 'capital', 'splits', 'maxOpenLots',
    'buyFeeRate', 'sellFeeRate', 'feeModel', 'feeNettingMode',
    'quantityModel', 'buyLimitFormulaVersion',
    'aggrTarget', 'aggrHold', 'safeTarget', 'safeHold',
    'buyCap', 'sellDayBuyRule',
    'rsiSource', 'rsiPeriod', 'rsiUpper', 'rsiLower', 'defaultMode',
    'vxnEnabled', 'vxnModel', 'vxnSource',
    'vxnStableThreshold', 'vxnCautionThreshold', 'vxnPanicThreshold',
    'vxnStableMultiplier', 'vxnNormalMultiplier', 'vxnCautionMultiplier', 'vxnPanicMultiplier',
    'vxnForceSafeOnCaution', 'vxnForceSafeOnPanic', 'vxnLagSessions',
    'riskMaFilter', 'riskVolFilter', 'safeCut', 'safeCutRatio', 'defenseRatio',
    'holidayCalendar'
  ];
  function canonicalizeStrategyConfig(cfg) {
    const out = {
      engineVersion: ENGINE_VERSION,
      schemaVersion: STRATEGY_SCHEMA_VERSION
    };
    for (const k of STRATEGY_KEYS) {
      let v = cfg[k];
      if (v === undefined || v === null) v = null;
      else if (typeof v === 'boolean') v = v ? 1 : 0;
      else if (typeof v === 'number' && !isFinite(v)) v = null;
      out[k] = v;
    }
    return out;
  }
  function stableStringify(obj) {
    if (obj === null || typeof obj !== 'object') return JSON.stringify(obj);
    if (Array.isArray(obj)) return '[' + obj.map(stableStringify).join(',') + ']';
    return '{' + Object.keys(obj).sort()
      .map(k => JSON.stringify(k) + ':' + stableStringify(obj[k])).join(',') + '}';
  }
  async function hashStrategyConfig(cfg) {
    const canon = canonicalizeStrategyConfig(cfg);
    const text = stableStringify(canon);
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    const hex = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    return { hash: hex, short: hex.slice(0, 8), canonical: canon, text };
  }

  return {
    ENGINE_VERSION, STRATEGY_SCHEMA_VERSION, VXN_STAGE_KO, STRATEGY_KEYS,
    cents, calcStrictBuyLimitCents, calcBuyLimit, calcPlannedBuyQty,
    calcTargetPrice, classifyVxn, resolveEffectiveMode, resolveBuyMultiplier,
    evaluateBuyOrder, isBuyFilled, calcHoldingSessions,
    evaluateSellForLot, evaluateSellOrders,
    canonicalizeStrategyConfig, stableStringify, hashStrategyConfig
  };
})();

/** 목표가·기한을 매수 시점 계약으로 로트에 고정한다.
    - 기존 로트: 마이그레이션 시점의 현행 설정값으로 1회 스탬프 (동작 변화 없음, 이후 소급 변동 종료)
    - 신규 로트: stampNewLot() 이 정확식으로 스탬프
    - 멱등: ct 가 이미 있으면 건드리지 않는다 */
function migrateContracts(){
  let n=0;
  for(const k of Object.keys(S.books||{})){
    const b=S.books[k]; if(!b) continue;
    (b.lots||[]).forEach(l=>{
      if(!l || !l.d || l.ct) return;
      const t = l.mode==='안전'? num(b.safeTarget) : num(b.aggrTarget);
      l.ct = {
        tp  : r2(num(l.p)*(1+t+(2+t)*num(b.fee))),          // 현행(근사식) 값 그대로 고정
        hold: l.mode==='안전'? num(b.safeDays) : num(b.aggrDays),
        fm  : 'legacy-approx',
        ev  : StrategyCore.ENGINE_VERSION,
        contractMigrated:true, contractSource:'legacy-current-settings'
      };
      n++;
    });
    b.contractMigrationId = CONTRACT_MIGRATION_ID;
  }
  return n;
}

/** 보유 세션 수: ⑥ 일별 기록의 실제 세션(종가 존재일)으로 센다.
    기록이 성긴 경우 주말제외 근사(networkDays)로 보수 폴백하고 경고 플래그를 준다. */
/** 로트의 보유 세션 수.
    기준은 "이번 주문이 체결될 세션(sessionISO)"이다. 매수 세션은 0으로 세고,
    그 다음 세션부터 1, 2 … 로 증가한다. (원본 콘솔의 networkDays(매수일, 오늘)−1 과 같은 기준)
    기록된 실제 거래 세션을 우선 사용하되, 아직 기록되지 않은 진행 중 세션도 1로 친다.
    → 어제 매수한 로트는 오늘 주문 판단에서 보유 1세션이 되어 매도 대상에 포함된다. */
function heldSessions(b, lotDateISO, sessionISO){
  if(!lotDateISO || !sessionISO || lotDateISO>=sessionISO) return {held:0, src:'records', gap:0};
  const nd = Math.max(0, networkDays(D(lotDateISO), D(sessionISO)) - 1);
  // 매수일 다음날 ~ 기준 세션 사이의 기록된 세션 (기준 세션이 아직 기록 전이면 아래에서 +1)
  const recDays = new Set((b.records||[])
    .filter(r=> r.d && num(r.close)>0 && r.d>lotDateISO && r.d<=sessionISO)
    .map(r=> r.d));
  let sess = recDays.size;
  const pending = recDays.has(sessionISO) ? 0 : 1;   // 진행 중(미기록) 기준 세션
  sess += pending;
  if(recDays.size===0 && nd>sess) return {held:nd, src:'networkDays', gap:nd};
  const gap = Math.max(0, nd - sess);
  return {held:sess, src: recDays.size? 'records' : 'networkDays', gap};
}


/* ============================================================
   4. 주간 RSI → 모드 판정  (QQQ주간RSI 시트 수식 이식)
   ============================================================ */
function rsiTable(b){
  const w = (b.weekly||[]).slice().sort((x,y)=> x.d<y.d?-1:1);
  const P=b.rsiPeriod, up=b.rsiUpper, dn=b.rsiLower;
  const out=[]; let ag=null, al=null, mode=b.baseMode;
  for(let i=0;i<w.length;i++){
    const c=w[i].c, prev=i>0?w[i-1].c:null;
    let ch=null, rsi=null, sig='';
    if(prev!=null){
      ch = c-prev;
      const g=Math.max(ch,0), l=Math.max(-ch,0);
      ag = (ag==null)? g : (ag*(P-1)+g)/P;
      al = (al==null)? l : (al*(P-1)+l)/P;
      rsi = (al===0)?100:100-100/(1+ag/al);
      const pr = out.length?out[out.length-1].rsi:null;
      if(pr!=null){
        if(pr>=up && rsi<pr) sig='안전';
        else if(pr<=dn && rsi>pr) sig='공세';
      }
    }
    if(sig) mode=sig;
    const ap=D(w[i].d); if(ap) ap.setDate(ap.getDate()+3);
    out.push({d:w[i].d, c, ch, rsi, sig, mode, apply: ap? ap.toISOString().slice(0,10):w[i].d});
  }
  return out;
}
function autoMode(b){
  const t=rsiTable(b);
  // RSI 자동판정을 켠 상태에서 원천 데이터가 없거나 RSI가 아직 계산되지 않았다면
  // 임의로 기준모드(과거에는 기본 '공세')를 사용하지 않는다. 신규매수는 엔진에서 보류한다.
  if(!t.length) return {mode:null, row:null, tbl:t, ready:false, reason:'RSI 원천 데이터 없음'};
  const td=todayISO(); let row=null;
  for(const r of t){ if(r.apply<=td) row=r; }
  if(!row) row=t[t.length-1];
  const ready=!!(row && row.rsi!=null);
  return {mode:ready?row.mode:null, row, tbl:t, ready,
          reason:ready?'':'RSI 계산에 필요한 주간 데이터가 부족함'};
}

/* ── VXN 기반 변동성 필터 ─────────────────────────────────
   VXN(나스닥100 변동성지수) 수준으로 신규매수 투입액을 조절한다.
   낮으면 증액, 높으면 감액, 패닉 구간은 신규매수 중단.
   보유 로트의 익절·기한 매도는 영향받지 않는다(청산은 항상 허용). */
function vxnState(b){
  const on=!!b.vxnOn;
  const ser=(b.vxnSeries||[]).filter(x=>x&&x.d&&num(x.c)>0).sort((x,y)=> x.d<y.d?-1:1);
  const cut=lastCompletedUsSession();
  const usable=ser.filter(x=> x.d<=cut);
  const last=usable.length? usable[usable.length-1] : null;
  const prev=usable.length>1? usable[usable.length-2] : null;
  if(!on)   return {on:false, level:'미사용', ratio:null, forceSafe:false, last, prev, stale:null};
  if(!last) return {on:true,  level:'데이터 없음', ratio:null, forceSafe:false, last:null, prev:null, stale:null,
                    warn:'VXN 시계열이 없습니다 — 시세 갱신에서 VXN을 받아오거나 직접 입력하세요'};
  if(last.d!==cut) return {on:true,level:'데이터 지연',ratio:null,forceSafe:false,last,prev,v:num(last.c),stale:null,
    warn:`VXN 최신 종가 미수신 — 마지막 ${last.d}, 필요 ${cut}. 신규 매수 보류. 매도 관리는 유지됩니다.`};
  const v=num(last.c);
  const cls=StrategyCore.classifyVxn(v,{
    vxnStableThreshold:num(b.vxnCalm), vxnCautionThreshold:num(b.vxnWarn), vxnPanicThreshold:num(b.vxnPanic),
    vxnStableMultiplier:num(b.vxnCalmRatio), vxnNormalMultiplier:num(b.vxnNormRatio),
    vxnCautionMultiplier:num(b.vxnWarnRatio), vxnPanicMultiplier:num(b.vxnPanicRatio),
    vxnForceSafeOnCaution:!!b.vxnForceSafe, vxnForceSafeOnPanic:!!b.vxnForceSafe});
  const level=StrategyCore.VXN_STAGE_KO[cls.stage], ratio=cls.multiplier;
  const stale=Math.max(0, networkDays(D(last.d), D(cut))-1);
  return {on:true, level, ratio, v, last, prev, stage:cls.stage,
          chg: prev? v-num(prev.c) : null, stale,
          forceSafe: cls.forceSafe,
          warn: last.status==='pending'? 'Yahoo 보충값(미확인)을 계산에 사용 중입니다. 아래 표에서 직접 확인하세요' : (stale>=2? `VXN 기록이 ${stale}거래일 오래됐습니다`:'')};
}

function engine(b){
  const fx = S.fx||1;
  const E = {};
  E.seedUSD   = b.seedKRW/fx + b.seedUSD;                 // E4 총 최초 투자금($)
  // ── 실현금 회계: 수수료 반영 + 당일 상계 절감(왕복수수료 환급) + 실체결 단가(bp/sp) 지원
  const feeR = num(b.fee);
  E.bought=0; E.sold=0; E.qty=0; E.feeSaved=0;
  (b.records||[]).forEach(r=>{
    const bq=num(r.buy), sq=num(r.sell), cl=num(r.close);
    const bpx=num(r.bp)>0? num(r.bp) : cl;                 // 실 매수단가 (없으면 종가)
    const spx=num(r.sp)>0? num(r.sp) : cl;                 // 실 매도단가 (없으면 종가)
    const recordFee=r.feeRate!=null?num(r.feeRate):feeR;
    E.bought += bq*bpx*(1+recordFee);
    E.sold   += sq*spx*(1-recordFee);
    const off = r.feeSaved!=null?num(r.feeSaved):2*recordFee*cl*Math.min(bq,sq);                 // 상계 사다리 왕복수수료 절감
    E.feeSaved += off;
    E.qty    += bq - sq;
  });
  E.cash      = E.seedUSD - E.bought + E.sold + E.feeSaved;   // E8 예수금 (수수료 반영)
  E.evalUSD   = E.qty * num(b.price);                     // E9
  E.totalUSD  = E.cash + E.evalUSD;                       // E10
  E.totalKRW  = E.totalUSD * fx;                          // E11
  E.pnlUSD    = E.totalUSD - E.seedUSD;                   // E12
  E.pnlKRW    = E.totalKRW - (b.seedKRW + b.seedUSD*fx);  // E13
  E.rateKRW   = (b.seedKRW+b.seedUSD*fx)? E.pnlKRW/(b.seedKRW+b.seedUSD*fx):0;
  E.rateUSD   = E.seedUSD? E.pnlUSD/E.seedUSD:0;
  E.chunk     = b.splits? E.seedUSD/b.splits:0;           // E18 1덩이 금액

  // ── 전일 종가(=직전 거래일 종가) 결정 ──────────────────────
  //   기본: ⑥ 일별 매매 기록의 가장 최근 종가 (사용자가 매일 직접 입력하는 값 = 가장 신뢰도 높음)
  //   해제 시: 설정에서 직접 입력한 값
  E.cutoff = lastCompletedUsSession();               // 완료된 마지막 미국 세션
  E.session = targetUsSession();                     // 오늘 주문이 체결될 세션
  const recSorted=(b.records||[]).filter(r=>r.d&&num(r.close)>0).sort((x,y)=> x.d<y.d?-1:1);
  const eligible=recSorted.filter(r=> r.d<=E.cutoff);          // 미완료 세션 종가는 기준에서 제외
  E.lastRec = eligible.length? eligible[eligible.length-1] : null;
  E.futureRec = recSorted.filter(r=> r.d>E.cutoff);            // 장중 가격이 섞여 들어온 기록 (경고용)
  E.prevFromRecord = !!b.prevFromRecord && !!E.lastRec;
  E.prevClose = E.prevFromRecord ? num(E.lastRec.close) : num(b.prevClose);
  E.prevSrc   = E.prevFromRecord ? (E.lastRec.d+' 종가') : '직접 입력';
  E.prevStale = E.prevFromRecord ? Math.max(0, networkDays(D(E.lastRec.d), D(E.cutoff))-1) : null;

  // ③ 모드
  const am = autoMode(b);
  E.rsi = am;
  E.vxn = vxnState(b);
  E.rsiMissing = b.manualMode==='자동' && !!b.useRSI && !am.ready;
  let mode;
  if(b.manualMode!=='자동') mode=b.manualMode;
  else if(!b.useRSI) mode=b.baseMode;
  else if(b.riskState==='방어') mode='안전';
  else if(b.riskState==='안전') mode='안전';
  else if(E.vxn.forceSafe) mode='안전';
  else mode=am.mode || '판정대기';
  E.mode = mode;
  E.target = mode==='안전'? b.safeTarget : (mode==='공세'? b.aggrTarget : null);   // B35
  E.limit  = mode==='안전'? b.safeDays  : (mode==='공세'? b.aggrDays : null);      // B36

  // 위험필터 매수비율 (G30) + 안전모드 매수축소
  let ratio = b.riskState==='방어' ? 0 : num(b.riskRatio);
  if(b.safeCut && mode==='안전') ratio = Math.min(ratio, num(b.safeCutRatio));
  if(E.vxn.on && E.vxn.ratio!=null) ratio = ratio * E.vxn.ratio;   // VXN 배수 적용
  E.ratio = ratio;

  // ⑤ 로트 원장 — 계약(ct) 고정값 우선, 보유일은 기록 세션 기준
  E.sessGapWarn = 0;
  E.lots = (b.lots||[]).filter(l=>l.d).map((l,i)=>{
    const sp  = l.ct? num(l.ct.tp)
                    : r2(num(l.p)*(1+(l.mode==='안전'?num(b.safeTarget):num(b.aggrTarget))
                        +(2+(l.mode==='안전'?num(b.safeTarget):num(b.aggrTarget)))*num(b.fee)));
    const hs  = heldSessions(b, l.d, E.session);
    const held= hs.held;
    if(hs.src==='records' && hs.gap>=3) E.sessGapWarn++;
    const lim = l.ct? num(l.ct.hold) : (l.mode==='안전'? num(b.safeDays) : num(b.aggrDays));
    const expired = held>=lim;
    let sell=0;
    if(held>=1) sell = expired? num(l.q) : (E.prevClose>=sp? num(l.q):0);   // J (전일종가 기준 예상)
    const fill = sell? (expired? E.prevClose : sp) : null;                  // K 최소 예상 체결가 — 정산은 실제 종가
    const loss = sell>0 && (fill*(1-num(b.fee)) < num(l.p)*(1+num(b.fee)));
    return {i, ...l, sp:r2(sp), held, lim, expired, sell, fill, loss, heldSrc:hs.src,
            type: expired?'MOC 강제매도':'LOC 익절 @'+fUSD(sp)};
  });
  E.sellLots  = E.lots.filter(l=>l.sell>0).length;              // E37
  E.lossLots  = E.lots.filter(l=>l.loss).length;                // G37
  E.sellQty   = E.lots.reduce((s,l)=>s+l.sell,0);               // B42
  E.sellAmt   = E.lots.reduce((s,l)=>s+l.sell*(l.fill||0),0);   // B43

  // 매도일 매수금지 규칙 (AA37)
  const rule = num(b.sellDayBuyRule);
  E.allowBuy = rule===0 ? true : (E.sellLots===0 ? true : (rule===1 ? E.lossLots>0 : E.lossLots===E.sellLots));
  E.buyVerdict = E.allowBuy
    ? (rule===0?'허용 (규칙 미적용)': E.sellLots===0?'허용 (오늘 매도 없음)': rule===1?'허용 (손실 매도 포함)':'허용 (전부 손실 매도)')
    : (rule===1?'금지 (이익 매도만 있음)':'금지 (이익 매도 포함)');

  // ④ 오늘 주문 — StrategyCore 표준 (엄격 센트 지정가 · 지정가 기준 사전 수량 · 차입 금지)
  E.opMode = b.opMode || 'ACTIVE';
  E.buyLimit = E.prevClose>0 ? StrategyCore.calcBuyLimit(E.prevClose, num(b.buyLimitPct)) : 0;
  E.full = E.lots.length >= b.splits;      // 표시용 — 분할 수는 1덩이 금액 기준일 뿐 (매수 차단 안 함)
  E.over = E.lots.length > b.splits;
  const vxnMissing = E.vxn.on && E.vxn.ratio==null;
  E.buyEval = StrategyCore.evaluateBuyOrder({
    prevClose:E.prevClose, buyCapRate:num(b.buyLimitPct),
    chunkAmount:E.chunk, cash:Math.max(0,E.cash), buyFeeRate:num(b.fee),
    multiplier: vxnMissing? null : ratio,
    openLots:E.lots.length, maxOpenLots:0,
    blockedBySellRule: !E.allowBuy
  });
  const opBlocked = E.opMode!=='ACTIVE';
  E.buyQty = (opBlocked || E.rsiMissing || !E.buyEval.allowed) ? 0 : E.buyEval.plannedQty;
  E.buyAmt = E.buyQty*E.buyLimit;

  E.buyMsg = opBlocked ? (E.opMode==='EXIT_ONLY' ? '신규매수 중단 — 기존 로트 청산 대기' : '신규매수 일시중단 — 운용 설정')
           : E.rsiMissing ? '매수 보류 — '+(E.rsi.reason||'RSI 데이터 없음')+' (시세 갱신으로 '+b.rsiSource+' 이력을 먼저 수집하세요)'
           : E.buyEval.reason==='SELL_DAY_RULE' ? '매수 금지 — 매도일 매수금지 규칙'
           : E.buyEval.reason==='VXN_DATA_MISSING' ? '매수 보류 — 직전 세션 VXN 데이터 없음 (매도 관리는 정상)'
           : E.buyEval.reason==='MULTIPLIER_ZERO' ? (E.vxn.on && E.vxn.level==='패닉' ? '신규매수 중단 — VXN 패닉 구간' : '신규매수 중단 — 위험필터 방어 상태')
           : E.buyEval.reason==='INSUFFICIENT_CASH' ? '수량 0 — 예수금 부족 또는 매수비율 축소'
           : `LOC 매수 ${E.buyQty}주 @ ${fUSD(E.buyLimit)}`
             + (ratio!==1?` · 투입액 ${Math.round(ratio*100)}% 적용`:'')
             + (E.over?` · 보유 덩이 ${E.lots.length}/${b.splits} 초과 (재투자 복리)`:'');

  E.ladder = ladder(b,E);
  return E;
}

/* ── ⑦ 상계 사다리 ─────────────────────────────────────────
   원칙: 어떤 종가 p 에서도 기존 로직의 순매매수량과 동일하되
        매수·매도 지정가가 겹치지 않도록 재배치 (자전거래 방지).
   v(p) = (p ≤ 매수지정가 ? N : 0) − Σ(목표가 ≤ p 인 LOC 매도) − MOC 강제매도
------------------------------------------------------------ */
const FP_CACHE = {};   // k → {short, at}
async function refreshBookFingerprint(k){
  try{
    const b=S.books[k]; if(!b||typeof StrategyCore==='undefined') return;
    const h=await StrategyCore.hashStrategyConfig(strategyConfigOfBook(k));
    FP_CACHE[k]={short:h.short, hash:h.hash};
    const el=document.querySelector('#fp-'+k.toLowerCase());
    if(el){
      const rel=b.appliedRelease||null;
      const match = rel && rel.strategyHashShort===h.short;
      el.innerHTML = rel
        ? (match? `검증 전략 <b>${h.short}</b> · 일치`
                : `현재 설정 <b>${h.short}</b> · <span style="color:var(--warn)">검증본 ${rel.strategyHashShort}와 다름 (미검증)</span>`)
        : `현재 설정 <b>${h.short}</b> · <span style="color:var(--tx3)">적용된 검증본 없음</span>`;
    }
  }catch(e){
    const el=document.querySelector('#fp-'+k.toLowerCase());
    if(el) el.innerHTML=`<span style="color:var(--bad)">지문 계산 실패 — ${esc(e.message||e)}</span>`;
  }
}
function isLegacyAddedTickerPlaceholder(b){
  if(!b || ['SOXL','TQQQ'].includes(String(b.ticker||'').toUpperCase()) || b.appliedRelease) return false;
  return Math.abs(num(b.aggrTarget)-0.14)<1e-12 && num(b.aggrDays)===8 &&
         Math.abs(num(b.safeTarget)-0.01)<1e-12 && num(b.safeDays)===35 &&
         num(b.rsiPeriod)===18 && num(b.rsiUpper)===66 && num(b.rsiLower)===38;
}
function repairPlaceholderLotContracts(b, oldCfg){
  if(!oldCfg) return 0;
  let n=0;
  (b.lots||[]).forEach(l=>{
    if(!l || !l.ct || !(num(l.p)>0)) return;
    const oldT=l.mode==='안전'?num(oldCfg.safeTarget):num(oldCfg.aggrTarget);
    const oldH=l.mode==='안전'?num(oldCfg.safeDays):num(oldCfg.aggrDays);
    const exactOld=StrategyCore.calcTargetPrice(num(l.p),oldT,num(oldCfg.fee),num(oldCfg.fee),'exact');
    const legacyOld=r2(num(l.p)*(1+oldT+(2+oldT)*num(oldCfg.fee)));
    if(num(l.ct.hold)!==oldH || (Math.abs(num(l.ct.tp)-exactOld)>.011 && Math.abs(num(l.ct.tp)-legacyOld)>.011)) return;
    stampNewLot(b,l);
    l.ct.contractMigrated=true;
    l.ct.contractSource='repair-added-ticker-placeholder-2026-08-10';
    n++;
  });
  return n;
}
async function loadRelease(k){
  if(!syncReady()){ toast('설정 탭에서 구글시트 연동을 먼저 완료하세요'); return; }
  const btn=document.querySelector('[data-relload="'+k+'"]');
  const label=btn? btn.textContent : '';
  if(btn){ btn.disabled=true; btn.textContent='확인 중…'; }
  toast(k+' 검증본을 확인하는 중입니다…');
  const restore=()=>{ if(btn){ btn.disabled=false; btn.textContent=label; } };
  try{
    const r=await Promise.race([
      hubGet(hubUrl({mode:'slotget', slot:'verified_release:'+k})),
      new Promise((_,rej)=> setTimeout(()=> rej(new Error('응답이 없습니다 (20초) — 시트 배포 상태를 확인하세요')), 20000))
    ]);
    if(r && r.ok===false) throw new Error((r.error||'')+' — 설정 탭의 「연결 진단」으로 브리지 버전을 확인하세요');
    if(!r || !r.entry || !r.entry.data) throw new Error('시트에 '+k+' 검증본이 없습니다 — 백테스터에서 [검증본으로 확정]을 먼저 실행하세요');
    const rel=JSON.parse(r.entry.data);
    const b=S.books[k], p=rel.parameters||{};
    const repairOld=isLegacyAddedTickerPlaceholder(b)?Object.assign({},b):null;
    const map=[['aggrTarget','aggrTarget'],['aggrHold','aggrDays'],['safeTarget','safeTarget'],['safeHold','safeDays'],
      ['buyCap','buyLimitPct'],['sellDayBuyRule','sellDayBuyRule'],['splits','splits'],
      ['rsiPeriod','rsiPeriod'],['rsiUpper','rsiUpper'],['rsiLower','rsiLower'],
      ['vxnStableThreshold','vxnCalm'],['vxnCautionThreshold','vxnWarn'],['vxnPanicThreshold','vxnPanic'],
      ['vxnStableMultiplier','vxnCalmRatio'],['vxnNormalMultiplier','vxnNormRatio'],
      ['vxnCautionMultiplier','vxnWarnRatio'],['vxnPanicMultiplier','vxnPanicRatio']];
    const diffs=[];
    for(const [pk,bk] of map){
      if(p[pk]===undefined||p[pk]===null) continue;
      const cur=num(b[bk]), nv=num(p[pk]);
      if(Math.abs(cur-nv)>1e-12) diffs.push(`${bk}: ${cur} → ${nv}`);
    }
    let vxnDiff=null;
    if(p.vxnEnabled!==undefined && (!!p.vxnEnabled)!==(!!b.vxnOn)) vxnDiff=`vxnOn: ${!!b.vxnOn} → ${!!p.vxnEnabled}`;
    if(vxnDiff) diffs.push(vxnDiff);
    if(p.rsiSource && String(p.rsiSource).toUpperCase()!==String(b.rsiSource||'').toUpperCase())
      diffs.push(`rsiSource: ${b.rsiSource||''} → ${String(p.rsiSource).toUpperCase()}`);
    if(p.defaultMode && p.defaultMode!==b.baseMode) diffs.push(`baseMode: ${b.baseMode} → ${p.defaultMode}`);
    const head=`검증본 ${rel.strategyHashShort} (${(rel.verifiedAt||'').slice(0,10)} · ${rel.dataStart||''}~${rel.dataThrough||''})\n`
      +(rel.results? `백테스트: CAGR ${(rel.results.cagr*100).toFixed(1)}% · MDD ${(rel.results.mdd*100).toFixed(1)}%\n`:'');
    if(!diffs.length){
      b.appliedRelease={strategyHashShort:rel.strategyHashShort, releaseId:rel.releaseId, appliedAt:new Date().toISOString()};
      await persistLocalState(); renderAll();
      toast('검증본과 현재 설정이 이미 일치합니다 — 적용 표시만 갱신');
      auditNote(b,'release-apply','일치 '+rel.strategyHashShort);
      restore(); return;
    }
    if(!confirm(head+'\n변경될 파라미터 (신규 로트부터 적용, 기존 로트 계약은 불변):\n'+diffs.join('\n')+'\n\n적용할까요?')){ restore(); return; }
    for(const [pk,bk] of map){ if(p[pk]!==undefined&&p[pk]!==null) b[bk]=num(p[pk]); }
    if(p.vxnEnabled!==undefined) b.vxnOn=!!p.vxnEnabled;
    if(p.rsiSource) b.rsiSource=String(p.rsiSource).toUpperCase();
    if(p.defaultMode) b.baseMode=p.defaultMode;
    const repaired=repairPlaceholderLotContracts(b,repairOld);
    b.addedGenericDefault=false;
    b.appliedRelease={strategyHashShort:rel.strategyHashShort, releaseId:rel.releaseId, appliedAt:new Date().toISOString()};
    await persistLocalState(); renderAll();
    toast('검증본 '+rel.strategyHashShort+' 적용'+(repaired?` · 잘못 생성된 기존 로트 계약 ${repaired}건 교정`:'')+' — 신규 로트부터 새 조건으로 매수합니다');
    auditNote(b,'release-apply',rel.releaseId+' 변경 '+diffs.length+'건');
    restore();
  }catch(e){ restore(); toast('검증본 불러오기 실패: '+(e.message||e)); }
}

function ladder(b,E){
  const N = E.buyQty;
  const mocLots = E.lots.filter(l=>l.expired && l.held>=1);
  const locLots = E.lots.filter(l=>!l.expired && l.held>=1 && num(l.q)>0);
  const moc = mocLots.reduce((s,l)=>s+num(l.q),0);
  const loc = locLots.map(l=>({p:r2(l.sp), q:num(l.q)}));

  /* 배분용 잔여 수량 원장.
     기한도래(MOC) 로트는 어떤 가격에서도 청산 대상이므로 sp=0 으로 두어 항상 먼저 소진한다.
     (매수와 상계되면 MOC 물량이 LOC 매도 행에 흡수되기 때문) */
  const pool=[
    ...mocLots.map(l=>({n:l.i+1, d:l.d, buy:num(l.p), sp:0,        q:num(l.q), rem:num(l.q), moc:true})),
    ...locLots.map(l=>({n:l.i+1, d:l.d, buy:num(l.p), sp:r2(l.sp), q:num(l.q), rem:num(l.q), moc:false}))
  ].sort((a,x)=> a.sp-x.sp || a.n-x.n);
  /* 주문 수량을 로트에 배분. maxPrice 이하 목표가 로트만 대상. */
  const alloc=(src, qty, maxPrice)=>{
    let rem=qty; const out=[];
    for(const c of src){
      if(rem<=0) break;
      if(maxPrice!=null && cents(c.sp)>cents(maxPrice)) continue;
      if(c.rem<=0) continue;
      const take=Math.min(rem, c.rem);
      c.rem-=take; rem-=take;
      out.push({n:c.n, d:c.d, buy:c.buy, take, partial:take<c.q});
    }
    return out;
  };

  const setP = new Set(loc.map(l=>cents(l.p)));
  setP.add(cents(r2(E.buyLimit+0.01)));
  const th = Array.from(setP).sort((a,x)=>a-x).map(c=>c/100);
  const V = p => {
    let v = (cents(p) <= cents(E.buyLimit) ? N : 0) - moc;
    for(const l of loc) if(cents(l.p) <= cents(p)) v -= l.q;
    return v;
  };
  const v = [ V(th.length? th[0]-0.01 : 0) ];
  th.forEach(t=> v.push(V(t)));
  const P = x=>Math.max(0,x), M = x=>Math.max(0,-x);
  const rows=[];
  const mocNet = P(v[v.length-1]) - M(v[0]);
  if(mocNet<0) rows.push({side:'매도', kind:'MOC', qty:-mocNet, price:null,
      cond:'종가 무조건 체결', memo:'기한도래 강제매도 순매도분',
      lots:alloc(pool, -mocNet, null)});
  if(mocNet>0) rows.push({side:'매수', kind:'MOC', qty:mocNet, price:null,
      cond:'종가 무조건 체결', memo:'상계 후 순매수분', lots:[]});
  for(let j=1;j<v.length;j++){
    const bq = P(v[j-1])-P(v[j]);
    const sq = M(v[j])-M(v[j-1]);
    if(bq>0){ const lp=r2(th[j-1]-0.01);
      rows.push({side:'매수',kind:'LOC',qty:bq,price:lp,
        cond:`종가 ≤ ${fUSD(lp)} 시 체결`, memo:'상계 사다리 매수 (매일 재주문)', lots:[]}); }
    if(sq>0){ const lp=th[j-1];
      rows.push({side:'매도',kind:'LOC',qty:sq,price:lp,
        cond:`종가 ≥ ${fUSD(lp)} 시 체결`, memo:'상계 사다리 매도 (매일 재주문)',
        lots:alloc(pool, sq, lp)}); }
  }
  rows.sort((a,x)=> (a.price??-1e9)-(x.price??-1e9));

  // 로트 번호 → 오늘 걸린 주문 (원장 표에서 역참조)
  const lotMap={};
  rows.forEach(r=> (r.lots||[]).forEach(l=>{
    (lotMap[l.n]=lotMap[l.n]||[]).push({kind:r.kind, price:r.price, take:l.take, partial:l.partial});
  }));

  const buys = rows.filter(r=>r.side==='매수'), sells=rows.filter(r=>r.side==='매도');
  const maxBuy  = Math.max(...buys.map(r=>r.price??-Infinity), -Infinity);
  const minSell = Math.min(...sells.map(r=>r.price?? Infinity),  Infinity);
  return {
    rows, lotMap,
    buyQty : buys.reduce((s,r)=>s+r.qty,0),
    sellQty: sells.reduce((s,r)=>s+r.qty,0),
    buyAmt : buys.reduce((s,r)=>s+r.qty*(r.price||0),0),
    overlap: maxBuy>=minSell,
    saved  : Math.min(N, E.sellQty)*2*b.fee*(E.buyLimit||0)
  };
}

const PAL=['#e8443a','#f5a623','#22c55e','#f2761f','#3b82f6','#8b5cf6','#14b8a6','#ec4899'];

function portfolio(){
  const fx=S.fx||1;
  const items=(S.holdings||[]).filter(o=>num(o.q)>0)
      .map(o=>({t:o.t, q:num(o.q), p:num(o.p), v:num(o.q)*num(o.p)}));
  const cash = S.cashKRW/fx + S.cashUSD;
  const stockUSD = items.reduce((s,i)=>s+i.v,0);
  const totalUSD = stockUSD + cash;
  const rows = items.concat([{t:'현금',q:null,p:null,v:cash}])
                    .sort((a,b)=>b.v-a.v)
                    .map((r,i)=>({...r, c:PAL[i%PAL.length], w: totalUSD? r.v/totalUSD*100:0}));
  return {rows, items, cash, stockUSD, totalUSD, totalKRW: totalUSD*fx};
}
function snapshot(force){
  const P=portfolio(); const d=todayISO();
  const w={}; P.rows.forEach(r=> w[r.t]=+r.w.toFixed(2));
  const rec={d, krw:Math.round(P.totalKRW), usd:+P.totalUSD.toFixed(2), w};
  S.snapshots = S.snapshots||[];
  const last=S.snapshots[S.snapshots.length-1];
  if(last && last.d===d){ if(force) S.snapshots[S.snapshots.length-1]=rec; }
  else S.snapshots.push(rec);
  if(S.snapshots.length>400) S.snapshots=S.snapshots.slice(-400);
  touch();
}

const REC_MONTH_VIEW = Object.create(null);
function recordMonthKey(d){
  const v=String(d||'');
  return /^\d{4}-\d{2}/.test(v)? v.slice(0,7) : todayISO().slice(0,7);
}
function getRecordMonth(k){
  const m=REC_MONTH_VIEW[k];
  if(/^\d{4}-\d{2}$/.test(m||'')) return m;
  return (REC_MONTH_VIEW[k]=todayISO().slice(0,7));
}
function moveRecordMonth(k,delta){
  const m=getRecordMonth(k), a=m.split('-').map(Number);
  let idx=a[0]*12+(a[1]-1)+delta;
  const y=Math.floor(idx/12), mo=((idx%12)+12)%12+1;
  REC_MONTH_VIEW[k]=`${y}-${String(mo).padStart(2,'0')}`;
  return REC_MONTH_VIEW[k];
}

async function confirmVxnRow(k,date,button){
  const root=$('#p-'+k.toLowerCase()),input=root.querySelector('[data-vxn-value="'+date+'"]');
  const row=(S.books[k].vxnSeries||[]).find(x=>x.d===date),value=Number(input.value);
  if(!row || !row.revision || !Number.isFinite(value) || value<=0) return toast('유효한 VXN 값과 최신 시세가 필요합니다');
  if(!S.gsUrl) return toast('구글시트 연결을 먼저 설정하세요');
  button.disabled=true;
  try{
    const j=await bridgePost({mode:'vxnreview'},JSON.stringify({date,value,revision:row.revision}),async()=>{
      const result=await hubGet(hubUrl({mode:'vxnreviewget'})),entry=result.entries && result.entries[date];
      return result.ok && entry && entry.status==='manual' && entry.c===value && entry.revision!==row.revision ? {ok:true,entry}:null;
    });
    if(!j.ok || !j.entry) throw new Error(j.error||'확인값 저장 실패');
    bookKeys().forEach(bk=>{S.books[bk].vxnSeries=(S.books[bk].vxnSeries||[]).map(x=>x.d===date?{...x,...j.entry}:x);});
    await save();renderAll();toast(date+' VXN 확인·저장 완료');
  }catch(e){toast(e.message||'저장 실패');}
  finally{button.disabled=false;}
}

/* ── 시세 조회 : 직접 fetch → JSONP → 수동 붙여넣기 ───────── */
function outdatedQuoteIds(j){
  const cut=lastCompletedUsSession();
  return quoteTickers().filter(t=>{
    const q=j && j.prices && j.prices[t];
    return !q || !(+q.lastClose>0) || q.lastCloseDate!==cut;
  });
}
function requireCurrentQuotes(j){
  if(!j || j.ok===false || !j.prices) throw new Error(j && j.error || '시세 응답이 없습니다');
  const stale=new Set(outdatedQuoteIds(j)), prices={}, series={};
  for(const k of quoteTickers()){
    if(stale.has(k)) continue;
    prices[k]=j.prices[k];
    if(j.series && Array.isArray(j.series[k])) series[k]=j.series[k].filter(r=>r[0]<=lastCompletedUsSession());
  }
  if(!Object.keys(prices).length) throw new Error('최신 종가 미수신: '+[...stale].join(', '));
  return {...j,prices,series};
}

function applyQuote(j,src){
  if(!j || !j.prices) throw new Error('응답에 prices 가 없습니다');
  if(+j.fx>0) S.fx=+j.fx;
  const P=j.prices; QUOTE=QUOTE||{}; let autoAdded=0;
  const pick=o=> ({ last:+(o.lastClose ?? o.price ?? 0) || 0,
                    lastD:(o.lastCloseDate||'').slice(0,10),
                    prev:+(o.prevClose ?? o.prev ?? 0) || 0,
                    prevD:(o.prevCloseDate||'').slice(0,10) });
  for(const k of Object.keys(P)){
    const q=pick(P[k]); if(!q.last) continue;
    QUOTE[k]=q;
    if(S.books[k]){
      S.books[k].price = q.last;
      if(!S.books[k].prevFromRecord) S.books[k].prevClose = q.last;
      autoAdded += autoRecord(k,q);
    }
    (S.holdings||[]).forEach(o=>{ if(o.t===k) o.p=q.last; });
  }
  // 거래대상 일봉으로 누락된 0/0 세션을 먼저 복구한다.
  // 실제 체결/수동 기록이 이미 있는 날짜는 backfillAutoRecords()가 건드리지 않는다.
  if(j.series){
    bookKeys().forEach(k=>{
      const own=j.series[k];
      if(Array.isArray(own) && own.length) autoAdded += backfillAutoRecords(k, own);
    });
  }
  // RSI 원천 일봉 → 주간 종가 자동 변환. 새 티커도 QQQ(또는 지정 rsiSource)를 자동으로 받는다.
  if(j.series){
    bookKeys().forEach(k=>{
      const b=S.books[k], src=String(b.rsiSource||'').trim().toUpperCase();
      const ser=src && j.series[src];
      if(Array.isArray(ser) && ser.length){
        const wk=dailySeriesToWeekly(ser);
        if(wk.length) b.weekly=wk.slice(-160);
      }
    });
  }
  // VXN 시계열 반영
  if(j.series && Array.isArray(j.series.VXN) && j.series.VXN.length){
    const vs=j.series.VXN.map(r=>({...(j.vxnMeta && j.vxnMeta[String(r[0]).slice(0,10)] || {}),d:String(r[0]).slice(0,10), c:+r[1]})).filter(x=>x.c>0);
    bookKeys().forEach(k=>{ S.books[k].vxnSeries=vs.slice(-400); });
  }
  if(!Object.keys(QUOTE).length) throw new Error(
    '시트 아카이브가 비어 있습니다 — 「종목 데이터 수집」을 누르거나, 시트 메뉴 「2모드 콘솔 → 전체 시세 갱신」을 실행하세요');
  S.lastFetch = new Date().toLocaleString('ko-KR',{hour12:false}) + (src? ' · '+src : '');
  S.lastFetchDay = todayISO();
  return autoAdded;
}

/* 날짜 붙은 확정 종가 → ⑥ 일별 기록 자동 추가 (매매 수량 0)
   이미 그 날짜의 기록이 있으면 건드리지 않는다 — 사용자가 입력한 값이 항상 우선 */
function autoRecord(k,q){
  const b=S.books[k]; b.records=b.records||[];
  let n=0;
  const cutoff=lastCompletedUsSession();
  const ensure=(d,c)=>{
    if(!d||!(c>0)||!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
    if(d>cutoff) return;                                       // ★ 미완료 세션(장중 가격) 거부
    if(b.records.some(r=>r.d===d)) return;                     // 이미 있으면 유지
    const lastD=b.records.length? b.records.map(r=>r.d).sort().pop():'';
    if(lastD && d<lastD) return;                               // 과거 역주행 방지
    b.records.push({d, close:c, buy:0, sell:0, auto:true}); n++;
  };
  ensure(q.prevD,q.prev); ensure(q.lastD,q.last);
  if(n) b.records.sort((a,c)=> a.d<c.d?-1:1);
  return n;
}
/** 아카이브 일봉으로 기록 공백을 보충한다.
    - 기존 실제/수동 기록은 절대 덮어쓰지 않는다.
    - 해당 모듈의 최초 기록일 이후 세션만 0/0 자동 기록으로 채운다.
    - 따라서 모듈 추가 전의 긴 과거 이력이 원장에 유입되지 않는다. */
function backfillAutoRecords(k, rows){
  const b=S.books[k]; if(!b) return 0;
  b.records=b.records||[];
  const a=(rows||[]).map(r=>({d:String(r[0]||'').slice(0,10), c:+r[1]}))
    .filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x.d)&&x.c>0)
    .sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0);
  if(!a.length) return 0;
  const cutoff=lastCompletedUsSession();
  // autoRecord()가 먼저 실행되므로 신규 모듈도 보통 직전/최근 세션 1~2개가 이미 있다.
  const firstExisting=(b.records||[]).filter(r=>r.d).map(r=>r.d).sort()[0] || a[a.length-1].d;
  const have=new Set((b.records||[]).filter(r=>r.d).map(r=>r.d));
  let n=0;
  for(const x of a){
    if(x.d<firstExisting || x.d>cutoff || have.has(x.d)) continue;
    b.records.push({d:x.d, close:x.c, buy:0, sell:0, auto:true});
    have.add(x.d); n++;
  }
  if(n) b.records.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0);
  return n;
}

function quoteSeriesIds(){
  // 거래대상 자체의 일봉도 요청한다. 앱을 며칠 열지 않았더라도 누락 세션을 자동 복구하기 위함.

function dailySeriesToWeekly(rows){
  const a=(rows||[]).map(r=>({d:String(r[0]||'').slice(0,10), c:+r[1]}))
    .filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x.d)&&x.c>0)
    .sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0);
  const by={};
  for(const x of a){
    const [yy,mm,dd]=x.d.split('-').map(Number);
    const d=new Date(Date.UTC(yy,mm-1,dd)), day=d.getUTCDay();
    const add=(5-day+7)%7; // 해당 거래일이 속한 주의 금요일
    const f=new Date(d.getTime()+add*86400000).toISOString().slice(0,10);
    by[f]=x.c; // 월~금 중 가장 늦은 실제 거래일 종가가 남는다(금요일 휴장도 처리)
  }
  return Object.keys(by).sort().map(d=>({d,c:by[d]}));
}
function jsonp(url, ms){
  return new Promise((res,rej)=>{
    const cb='__q'+Math.random().toString(36).slice(2);
    const sc=document.createElement('script');
    const tm=setTimeout(()=>{clean();rej(new Error('시간 초과'))}, ms||20000);
    function clean(){ clearTimeout(tm); try{delete window[cb]}catch(e){} sc.remove(); }
    window[cb]=d=>{ clean(); res(d); };
    sc.onerror=()=>{ clean(); rej(new Error('스크립트 로드가 차단됨')); };
    sc.src=url+'&callback='+cb;
    document.body.appendChild(sc);
  });
}

async function bridgePost(params, payloadText, verifyAfterOpaqueFailure){
  let directError=null;
  try{
    const r=await fetch(hubUrl(params), {method:'POST', body:payloadText, redirect:'follow', cache:'no-store'});
    const text=await r.text();
    if(/<html/i.test(text)) throw new Error('HTML 반환 — 배포 액세스 권한 「모든 사용자」 확인');
    return JSON.parse(text);
  }catch(e){ directError=e; }

  // Apps Script POST는 서버 저장은 끝났지만 브라우저가 리다이렉트/CORS 응답만 차단하는 경우가 있다.
  // 같은 요청을 재전송하지 않고 GET/JSONP로 저장 결과를 검증해 중복·충돌을 방지한다.
  if(verifyAfterOpaqueFailure){
    try{
      const verified=await verifyAfterOpaqueFailure();
      if(verified) return verified;
    }catch(e){ directError=new Error((directError?.message||'POST 응답 실패')+' / 저장 확인 실패: '+(e.message||e)); }
  }
  throw directError || new Error('POST 전송 실패');
}
let pushTimer=null, lastPushErr='', pushQueue=Promise.resolve();
function cloudPush(){                      // save() 에서 자동 호출 (디바운스)
  if(!syncReady() || PLAN_BUSY) return;
  if(!S.syncLinked) return;                // 최초 받기/올리기 전에는 자동 업로드 금지
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{pushTimer=null;doPush(false,true);},1200);
}
function doPush(force,silent){
  const task=()=>doPushNow(force,silent);
  const next=pushQueue.catch(()=>null).then(task);
  pushQueue=next;
  return next;
}
async function doPushNow(force,silent){
  try{
    S.savedAt=Math.max(Date.now(), num(S.savedAt)+1);
    const payload=cloudPayloadText(), localStamp=String(S.savedAt);
    const params={mode:'cfgset', ifmatch:S.cloudSavedAt||'', force:force?'1':'0', device:navigator.platform||'web'};
    const j=await bridgePost(params, payload, async()=>{
      const g=await hubGet(hubUrl({mode:'cfgget', _:Date.now()}));
      if(!g || g.ok===false || !g.cfg || !g.cfg.data) return null;
      let remote=null; try{ remote=JSON.parse(g.cfg.data); }catch(e){ return null; }
      if(String(remote.savedAt||'')===localStamp)
        return {ok:true, savedAt:g.cfg.at, bytes:payload.length, verifiedAfterOpaquePost:true};
      if(params.ifmatch && String(g.cfg.at||'')!==String(params.ifmatch))
        return {ok:false, error:'conflict', serverAt:g.cfg.at};
      return null;
    });
    if(j.error==='conflict' || (j.ok===false && j.error==='conflict')){
      setSyncDot(false,'다른 기기가 더 최신 데이터를 올렸습니다 — 「클라우드에서 받기」 먼저');
      if(!silent) throw new Error('충돌 — 클라우드에 더 최신 데이터가 있습니다. 「클라우드에서 받기」로 먼저 확인하세요');
      return null;
    }
    if(j.ok===false || j.error) throw new Error(j.error||'저장 실패');
    S.cloudSavedAt=j.savedAt; S.syncLinked=true; await persistLocalState();
    PUSHED_SAVEDAT=localStamp; lastPushErr=''; setSyncDot(true,'클라우드 저장됨 '+new Date().toLocaleTimeString('ko-KR',{hour12:false}));
    return Object.assign({bytes:payload.length},j);
  }catch(e){
    if(!silent) throw e;
    lastPushErr=e.message||'전송 실패'; setSyncDot(false,'클라우드 저장 실패: '+lastPushErr);
    return null;
  }
}

/* ── 허브 호출 헬퍼 : 직접 fetch 실패 시 JSONP ── */
async function hubGet(url){
  try{
    const r=await fetch(url,{redirect:'follow',cache:'no-store'});
    const t=await r.text();
    if(/<html/i.test(t)) throw new Error('HTML 반환 — 배포 액세스 권한 「모든 사용자」 확인');
    return JSON.parse(t);
  }catch(e){
    // CORS 차단(TypeError) 뿐 아니라 로그인/리다이렉트 HTML 이 온 경우에도
    // JSONP 는 성공하는 경우가 많으므로 함께 폴백한다.
    if(e instanceof TypeError || /fetch|HTML 반환/i.test(e.message)){
      try{ return await jsonp(url,20000); }
      catch(e2){ throw new Error(e.message+' / JSONP 도 실패: '+(e2.message||e2)); }
    }
    throw e;
  }
}
/* ── 최초 수집 : GOOGLEFINANCE 이력을 시트 아카이브에 적재 ──
   prepare(수식 기록) → collect(값 회수) 를 종목마다 수행. 로딩이 끝날 때까지 폴링. */
async function hubCollect(id, prog){
  const p=await hubGet(hubUrl({mode:'prepare', id, years:3}));
  if(p.ok===false) throw new Error(p.error||'prepare 실패');
  if(p.done) return {ok:true,rows:p.rows,resolved:p.resolved};
  for(let i=0;i<20;i++){
    await new Promise(r=>setTimeout(r, i===0?3000:2500));
    if(prog) prog(`${id} 수집 중… (${i+1}/20)`);
    const c=await hubGet(hubUrl({mode:'collect', id, n:400}));
    if(c.done) return {ok:true, rows:c.rows, resolved:c.resolved};
    if(c.ok===false) return {ok:false, error:c.error||'수집 실패', diag:c.diag||''};
    if(!c.pending)   return {ok:false, error:'데이터를 받지 못했습니다', diag:c.diag||''};
  }
  return {ok:false, error:'시간 초과 — 잠시 후 다시 시도하세요'};
}
async function hubCollectAll(ids, prog){
  const done=[], fail=[];
  for(const id of ids){
    try{ const r=await hubCollect(id, prog); r.ok? done.push(id) : fail.push(id+'('+r.error+')'); }
    catch(e){ fail.push(id+'('+e.message+')'); }
  }
  return {done, fail};
}

async function tdQuote(){
  if(S.tdKey && S.gsToken && S.tdKey===S.gsToken)
    throw new Error('Twelve Data 키 자리에 시트 접근 토큰이 들어 있습니다 — 설정에서 확인하세요');
  const t=quoteTickers().filter(x=>x!=='VXN'&&x!=='USDKRW');

  const r=await fetch('https://api.twelvedata.com/time_series?symbol='+encodeURIComponent(t.join(','))
    +'&interval=1day&outputsize=600&adjust=none&apikey='+encodeURIComponent(S.tdKey));
  const j=await r.json();

  const one = j.values? {[t[0]]:j} : j;                 // 단일 심볼이면 평평한 형태로 옴
  for(const k of Object.keys(one)){
    const values=one[k]&&one[k].values; if(!Array.isArray(values)) continue;
    const v=values.filter(x=>x.datetime<=lastCompletedUsSession() && Number.isFinite(+x.close) && +x.close>0).sort((a,b)=>b.datetime.localeCompare(a.datetime));
    if(!v.length) continue;
    out.series[k.toUpperCase()]=v.map(x=>[x.datetime,+x.close]).reverse();
    out.prices[k.toUpperCase()]={
      lastClose:+v[0].close, lastCloseDate:v[0].datetime,
      prevClose:v[1]? +v[1].close:0, prevCloseDate:v[1]? v[1].datetime:'' };
  }

function bandsOf(lots,buyQty,buyLimit){
  const act=(lots||[]).filter(l=>num(l.q)>0 && num(l.held)>=1);
  const moc=act.filter(l=>l.expired), loc=act.filter(l=>!l.expired);
  const cs=new Set(loc.map(l=>cents(l.sp))); if(buyQty>0) cs.add(cents(buyLimit)+1);
  const cuts=[...cs].sort((a,c)=>a-c);
  const at=pc=>{
    const sells=[...moc, ...loc.filter(l=>cents(l.sp)<=pc)];
    const sq=sells.reduce((s,l)=>s+num(l.q),0), buy=(buyQty>0 && pc<=cents(buyLimit))?buyQty:0;
    return {sells, sq, buy, net:buy-sq};
  };
  const out=[];
  if(!cuts.length){ const r=at(0); return [{lo:null,hi:null,...r}]; }
  out.push({lo:null, hi:cuts[0]-1, ...at(cuts[0]-1)});
  for(let i=0;i<cuts.length;i++) out.push({lo:cuts[i], hi:i+1<cuts.length?cuts[i+1]-1:null, ...at(cuts[i])});
  return out.reverse();
}
function trimBands(bands,buyLimit,Cc){
  const cap=cents(buyLimit)+1;
  return bands.filter(b=> b.lo==null || b.lo<=cap || (Cc!=null && Cc>=b.lo && (b.hi==null||Cc<=b.hi)));
}
function bandLabel(b){ const f=c=>(c/100).toFixed(2);
  return b.lo==null? '≤ '+f(b.hi) : b.hi==null? '≥ '+f(b.lo) : f(b.lo)+' ~ '+f(b.hi); }
function bandText(b,buyQty){
  const parts=[b.sq>0? `로트 ${b.sq}주 매도` : '로트 유지'];
  if(b.buy>0) parts.push(b.sq>0? `+ 매수 ${b.buy}주` : `· 매수 ${b.buy}주`);
  else if(buyQty>0) parts.push('· 매수 없음');
  return parts.join(' ');
}
function isNetting(lots,buyQty,buyLimit){
  if(!(buyQty>0)) return false;
  const act=(lots||[]).filter(l=>num(l.q)>0 && num(l.held)>=1);
  return act.some(l=>l.expired || cents(l.sp)<=cents(buyLimit));

function rowNote(r,ctx){
  if(r.side==='매수'){
    if(r.kind==='MOC') return '상계 후 순매수 · 종가 무조건 체결';
    return ctx.netting? `상계 · 종가 ≤ ${p2(r.price)}이면 체결` : `종가가 ${p2(r.price)} 이하이면 체결 · 신규 로트`;
  }
  const ls=r.lots||[];
  const net=ctx.netting && (r.kind==='MOC' || cents(r.price)<=cents(ctx.bl)+1 || ls.some(x=>x.partial));
  ctx={...ctx, netting:net};
  const allFull=ls.length && ls.every(x=>!x.partial);
  const who = (!ctx.netting && allFull)? ls.map(x=>md(x.d)).join('·')+' 로트 '+(r.kind==='MOC'?'기한 도달':'목표가')
            : ls.map(x=>`${md(x.d)} 로트${x.partial?' 중':''} ${x.take}주`).join(' · ');
  if(r.kind==='MOC') return (ctx.netting?'상계 · ':'')+who+' · 종가 무조건 매도';
  const need=ctx.ref>0? (r.price/ctx.ref-1)*100 : null;
  return (ctx.netting?'상계 · ':'')+who+(need!=null?` · ${pctS(need)} 필요`:'');
}

function bindOvChart(){
  const box=$('#ovChart'), C=OV_CHART; if(!box||!C) return;
  const svgEl=box.querySelector('svg'), cur=svgEl.querySelector('[data-cur]'), dot=svgEl.querySelector('[data-dot]'), tip=$('#ovTip');
  const show=(i,active)=>{
    dot.setAttribute('cx',C.xs[i].toFixed(1)); dot.setAttribute('cy',C.ys[i].toFixed(1));
    cur.setAttribute('x1',C.xs[i]); cur.setAttribute('x2',C.xs[i]); cur.setAttribute('opacity',active?'.6':'0');
    const c=C.ch[i];
    tip.innerHTML=`${md(C.dates[i])} · ${C.fmt(C.vals[i])}${i?` · <span class="${c>=0?'up':'down'}">${pctS(c,2)}</span>`:''}`;
  };
  const pick=e=>{ const r=svgEl.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*C.W;
    let bi=0, bd=1e9; C.xs.forEach((v,i)=>{ const d=Math.abs(v-x); if(d<bd){bd=d;bi=i;} }); show(bi,true); };
  svgEl.addEventListener('pointerdown',pick); svgEl.addEventListener('pointermove',pick);
  svgEl.addEventListener('pointerleave',()=>show(C.n-1,false));
  show(C.n-1,false);
}
function bindFolds(root){
  $$('details[data-fold]',root).forEach(d=>d.addEventListener('toggle',()=>{ d.open? FOLDS.add(d.dataset.fold) : FOLDS.delete(d.dataset.fold); }));
}

/* ============================================================
   14. 종목 화면 (오늘 주문표 = 저장·정산되는 주문표와 동일한 행)
   ============================================================ */
function fold(id,title,sub,body){
  return `<details class="fold" data-fold="${id}" ${FOLDS.has(id)?'open':''}><summary><span class="grow"><span style="display:block;font-size:15px">${title}</span>
    <span class="s12 mut ellip" style="display:block">${sub}</span></span><span class="chev">${SV(IC.right)}</span></summary><div class="inner">${body}</div></details>`;
}
function reconState(k){
  const b=S.books[k], total=lotsTotal(b);
  const evs=(S.journal||[]).filter(e=>e.k===k);
  const last=evs.filter(e=>e.t==='recon').pop();
  if(!last) return {cls:'',txt:`잔고 확인 · 원장 ${total}주`,total};
  const later=evs.some(e=>e.at>last.at && (e.t==='adjust'||e.t==='base'))
    || Object.values(S.planSettlements||{}).some(r=>r&&r.ticker===k && r.at>last.at);
  if(later) return {cls:'',txt:`잔고 확인 · 원장 ${total}주`,total};
  if(num(last.broker)===total) return {cls:'ok',txt:`잔고 ${total}주 일치`,total};
  return {cls:'warn',txt:`잔고 차이 ${sgnN(num(last.broker)-total)}주`,total};
}
async function doRecon(k,auto){
  const total=lotsTotal(S.books[k]);
  const v=auto!=null? auto : prompt(`${k} 증권사 실제 보유 수량을 입력하세요 (원장 ${total}주)`);
  if(v===null||v===undefined||String(v).trim()==='') return;
  const n=Number(String(v).replace(/[^0-9.]/g,''));
  if(!Number.isFinite(n)||n<0||Math.floor(n)!==n) return toast('정수 수량을 입력하세요');
  journalAdd({t:'recon',k,d:todayISO(),broker:n,ledger:total});
  touch(); renderCurrent();
  toast(n===total? '증권사 잔고와 원장이 일치합니다' : `차이 ${sgnN(n-total)}주 — 일지에 기록했습니다`);
}
function renderBook(k){
  if(V3.tab!=='book' || k!==V3.book) return;
  const root=$('#p-'+k.toLowerCase()); if(!root) return;
  const b=S.books[k], E=engine(b), L=E.ladder;
  const rows=L.rows, net=isNetting(E.lots,E.buyQty,E.buyLimit), ctx={netting:net, ref:E.prevClose, bl:E.buyLimit};
  const total=lotsTotal(b), heldLots=E.lots.filter(l=>num(l.q)>0);
  const cost=heldLots.reduce((s,l)=>s+num(l.q)*num(l.p),0), val=total*num(b.price);
  const linked=syncReady()&&S.syncLinked, idx=PLAN_IDX[k];
  const pend=pendingSettles(k), sp=sessionPlan(k,E.session);
  const spPlan=sp? PLAN_CACHE[sp.id] : null;
  const changed = spPlan? (rowSig(spPlan.orders)!==rowSig(rows) || num(spPlan.buyQty)!==E.buyQty) : false;
  const rc=reconState(k);
  const modeCls=E.mode==='안전'?'safe':E.mode==='공세'?'aggr':'warn';

  // 경고
  const alerts=[];
  if(pend.length) alerts.push(`<div class="alert info row between" style="gap:10px"><span><b>${md(pend[0].date)} 체결 정산</b>이 남았습니다${pend.length>1?` (총 ${pend.length}건)`:''}. 정산 후 오늘 주문을 확정하세요.</span><button class="btn sm" data-settle="${esc(k)}|${esc(pend[0].id)}" style="flex:none">정산</button></div>`);
  if(E.prevFromRecord && E.prevStale>=1) alerts.push(`<div class="alert"><b>기준 종가가 오래됐습니다</b> — 마지막 기록 ${md(E.lastRec.d)}, 필요 ${md(E.cutoff)}. 위 ↻ 로 시세를 갱신하거나 일별 기록에 종가를 넣으세요.</div>`);
  if(E.futureRec.length) alerts.push(`<div class="alert">장중 가격으로 보이는 기록(${E.futureRec.map(r=>md(r.d)).join(', ')})은 기준에서 제외했습니다.</div>`);
  if(E.vxn.warn) alerts.push(`<div class="alert">${esc(E.vxn.warn)}</div>`);
  if(E.sessGapWarn) alerts.push(`<div class="alert">일별 기록에 빠진 세션이 있어 보유 세션 수가 실제보다 적을 수 있습니다 (로트 ${E.sessGapWarn}건).</div>`);
  if(Math.round(E.qty)!==total) alerts.push(`<div class="alert">일별 기록 누적 <b>${fNum(E.qty)}주</b>와 로트 합계 <b>${total}주</b>가 다릅니다. 예수금·손익 계산은 기록 기준입니다 — <button class="mini" data-go="log">일지에서 확인</button></div>`);

  // 주문표

  // 하단 버튼
