/* ============================================================
   15. 체결 정산 (저장 주문표의 행 단위 체결 → 로트 매도·신규 매수로 분해)
   ============================================================ */
const SETTLE={k:'',planId:'',plan:null,fills:null,close:'',broker:'',err:'',loading:false,touched:false,showAll:false,arm:0};
function settleCloseFor(k,date){
  const r=(S.books[k].records||[]).find(x=>x.d===date && num(x.close)>0); if(r) return num(r.close);
  if(QUOTE[k] && QUOTE[k].lastD===date) return num(QUOTE[k].last);
  return 0;
}
function expectedFill(r,Cc){
  if(Cc==null) return 0;
  if(r.kind==='MOC') return r.qty;
  if(r.side==='매수') return Cc<=cents(r.price)? r.qty : 0;
  return Cc>=cents(r.price)? r.qty : 0;
}
function defaultFills(plan,C){ const Cc=C>0?cents(C):null; return (plan.orders||[]).map(r=>expectedFill(r,Cc)); }
function settleCalc(plan,C,fills){
  const out={warns:[],lines:[],error:'',buy:0,sell:{},sellTotal:0,actualBuy:0,actualSell:0,actualNet:0,before:0,after:0};
  const rows=plan.orders||[], Cc=cents(C), lots=plan.lots||[];
  const lotOfN={}; lots.forEach((l,i)=>{ lotOfN[(Number.isInteger(l.i)?l.i:i)+1]=l; });
  rows.forEach((r,i)=>{ const f=fills[i]||0; if(r.side==='매수') out.actualBuy+=f; else out.actualSell+=f; });
  out.actualNet=out.actualBuy-out.actualSell;
  out.before=lots.reduce((s,l)=>s+num(l.q),0); out.after=out.before+out.actualNet;
  const act=lots.filter(l=>num(l.q)>0 && num(l.held)>=1);
  let buy=(num(plan.buyQty)>0 && Cc<=cents(plan.buyLimit))? num(plan.buyQty) : 0;
  const sell={}; lots.forEach(l=>sell[l.id]=0);
  act.forEach(l=>{ if(l.expired || cents(l.sp)<=Cc) sell[l.id]=num(l.q); });
  const sumSell=()=>Object.values(sell).reduce((a,c)=>a+c,0);
  let diff=out.actualNet-(buy-sumSell());
  // 행 단위 점검
  const fb=[], fs=[];
  rows.forEach((r,i)=>{ const f=fills[i]||0, e=expectedFill(r,Cc), px=r.price==null?'종가(MOC)':p2(r.price);
    if(f>0 && r.kind==='LOC') (r.side==='매수'?fb:fs).push(cents(r.price));
    if(f>0 && e===0) out.warns.push(`${r.side} ${px} 행은 종가 ${p2(C)}에서 체결될 수 없는 주문입니다.`);
    else if(f===0 && e>0) out.warns.push(`${r.side} ${px} 행은 종가 ${p2(C)}이면 체결 대상인데 미체결로 입력했습니다.`);
  });
  if(fb.length && fs.length) out.warns.unshift('매수 행과 매도 행은 같은 종가에서 함께 체결될 수 없습니다. 증권사 화면을 다시 확인하세요.');
  const order=(list)=>{ const seen=new Set(), o=[]; list.forEach(id=>{ if(id && !seen.has(id)){ seen.add(id); o.push(id); } }); return o; };
  if(diff>0){
    const ids=[];
    rows.map((r,i)=>({r,i})).filter(x=>x.r.side==='매도' && (fills[x.i]||0)<expectedFill(x.r,Cc))
      .sort((a,c)=>(c.r.price??0)-(a.r.price??0)).forEach(x=>(x.r.lots||[]).slice().reverse().forEach(a=>ids.push(lotOfN[a.n]?.id)));
    act.slice().sort((a,c)=>(a.expired?1:0)-(c.expired?1:0) || num(c.sp)-num(a.sp)).forEach(l=>ids.push(l.id));
    for(const id of order(ids)){ if(diff<=0) break; const t=Math.min(diff,sell[id]||0); sell[id]-=t; diff-=t; }
    if(diff>0){ const t=Math.min(diff, num(plan.buyQty)-buy); buy+=t; diff-=t; }
  } else if(diff<0){
    let need=-diff; const t=Math.min(need,buy); buy-=t; need-=t;
    if(need>0){
      const ids=[];
      rows.map((r,i)=>({r,i})).filter(x=>x.r.side==='매도' && (fills[x.i]||0)>expectedFill(x.r,Cc))
        .sort((a,c)=>(a.r.price??0)-(c.r.price??0)).forEach(x=>(x.r.lots||[]).forEach(a=>ids.push(lotOfN[a.n]?.id)));
      act.slice().sort((a,c)=>num(a.sp)-num(c.sp)).forEach(l=>ids.push(l.id));
      for(const id of order(ids)){ if(need<=0) break; const l=lots.find(x=>x.id===id); const t=Math.min(need,num(l.q)-(sell[id]||0)); sell[id]+=t; need-=t; }
    }
    diff=-need;
  }
  if(diff!==0) out.error='입력한 체결 수량을 원장으로 설명할 수 없습니다 — 보유 로트 수량이나 매수 계획을 넘습니다.';
  if(buy>0 && plan.mode!=='안전' && plan.mode!=='공세') out.error='주문표의 매수 모드가 확정되지 않아 신규 로트를 만들 수 없습니다.';
  out.buy=buy; out.sell=sell; out.sellTotal=sumSell();
  lots.forEach(l=>{ const s=sell[l.id]||0; if(s>0) out.lines.push({m:'−',t:`${md(l.d)} 로트 ${s}주 매도`+(s<num(l.q)?` · 잔량 ${num(l.q)-s}주 유지`:'')+(l.expired?' · 기한 도달':'')}); });
  if(buy>0){ const f=num(plan.fee), tp=Math.ceil(C*(1+f)*(1+num(plan.buyTarget))/(1-f)*100-1e-10)/100;
    out.lines.push({m:'+',t:`신규 로트 ${buy}주 매수 @ ${p2(C)} · 목표 ${p2(tp)} · ${num(plan.buyHold)}세션 고정 (${plan.mode})`}); }
  if(buy>0 && out.sellTotal>0) out.lines.push({m:'=',t:`상계로 증권사에는 ${out.actualNet>0?'순매수 '+out.actualNet+'주':out.actualNet<0?'순매도 '+(-out.actualNet)+'주':'순매매 0주'}`});
  if(!buy && num(plan.buyQty)>0 && Cc>cents(plan.buyLimit)) out.lines.push({m:'·',t:`매수 미체결 · 종가가 지정가 ${p2(plan.buyLimit)} 초과`});
  if(!out.lines.length) out.lines.push({m:'·',t:'체결 없음 · 종가만 기록하고 보유 세션이 1 늘어납니다'});
  return out;
}
function settleRequest(plan,C,calc){
  return {planId:plan.id, close:C, buyQty:calc.buy, buyPrice:C, netting:calc.buy>0&&calc.sellTotal>0,
    fills:plan.lots.map(l=>({lotId:l.id, qty:calc.sell[l.id]||0, price:C}))};
}

function bindSettle(){
  const el=$('#p-settle');
  $$('[data-back]',el).forEach(b=>b.onclick=()=>goBook(SETTLE.k||V3.book));
  $$('[data-retry]',el).forEach(b=>b.onclick=()=>openSettle(SETTLE.k,SETTLE.planId));
  if(!SETTLE.plan || SETTLE.plan._receipt) return;
  const rows=SETTLE.plan.orders||[];
  const setF=(i,v)=>{ SETTLE.fills=(SETTLE.fills||defaultFills(SETTLE.plan,num(SETTLE.close))).slice(); SETTLE.fills[i]=Math.max(0,Math.min(rows[i].qty,v)); SETTLE.touched=true; SETTLE.arm=0; renderSettle(); };
  $$('[data-tg]',el).forEach(b=>b.onclick=()=>{ const i=+b.dataset.tg, f=(SETTLE.fills||[])[i]||0; setF(i, f>0?0:rows[i].qty); });
  $$('[data-dec]',el).forEach(b=>b.onclick=()=>{ const i=+b.dataset.dec; setF(i,((SETTLE.fills||[])[i]||0)-1); });
  $$('[data-inc]',el).forEach(b=>b.onclick=()=>{ const i=+b.dataset.inc; setF(i,((SETTLE.fills||[])[i]||0)+1); });
  $$('[data-showall]',el).forEach(b=>b.onclick=()=>{ SETTLE.showAll=true; renderSettle(); });
  $$('[data-refill]',el).forEach(b=>b.onclick=()=>{ SETTLE.fills=defaultFills(SETTLE.plan,num(SETTLE.close)); SETTLE.touched=false; SETTLE.arm=0; renderSettle(); });
  const ci=$('#stClose'); if(ci) ci.onchange=()=>{ SETTLE.close=ci.value.trim(); if(!SETTLE.touched) SETTLE.fills=defaultFills(SETTLE.plan,num(SETTLE.close)); SETTLE.arm=0; renderSettle(); };
  const bi=$('#stBroker'); if(bi) bi.onchange=()=>{ SETTLE.broker=bi.value.trim(); renderSettle(); };
  $$('[data-skip]',el).forEach(b=>b.onclick=async()=>{
    const p=SETTLE.plan, k=SETTLE.k;
    const why=prompt(`${md(p.date)} 주문표를 정산하지 않고 건너뜁니다.\n(주문을 내지 않았거나 일별 기록으로 따로 입력한 경우)\n사유를 적어 주세요.`);
    if(why===null) return;
    S.planSkips=S.planSkips||{}; S.planSkips[k+':'+p.date]=true;
    journalAdd({t:'skip',k,d:p.date,planId:p.id,why:why.trim()});
    await save(); goBook(k); toast(md(p.date)+' 주문표를 건너뛰었습니다');
  });
  $$('[data-apply]',el).forEach(b=>b.onclick=()=>{
    if(SETTLE.arm<Date.now()){ SETTLE.arm=Date.now()+5000; renderSettle(); setTimeout(()=>{ if(V3.tab==='settle' && SETTLE.arm && SETTLE.arm<=Date.now()){ SETTLE.arm=0; renderSettle(); } },5100); return; }
    SETTLE.arm=0; commitSettle();
  });
}
async function commitSettle(){
  await commitSettleRun();
  if(S.syncLinked) cloudPush();
}
async function commitSettleRun(){
  const k=SETTLE.k, plan=SETTLE.plan, C=num(SETTLE.close), fills=(SETTLE.fills||[]).slice();
  const calc=settleCalc(plan,C,fills); if(calc.error) return toast(calc.error);
  const request=settleRequest(plan,C,calc);
  const brokerN=SETTLE.broker===''? null : Number(String(SETTLE.broker).replace(/[^0-9]/g,''));
  return planRun(async()=>{
    if(needsPush()) await doPush(false,false);
    let r;
    try{ r=await bridgePost({mode:'plansettle',ifmatch:S.cloudSavedAt,device:navigator.platform||'web'},JSON.stringify(request),async()=>{
      const g=await hubGet(hubUrl({mode:'cfgget',_:Date.now()})); if(!g?.cfg?.data) return null;
      const state=JSON.parse(g.cfg.data), receipt=state.planSettlements?.[k+':'+plan.date];
      return receipt?{ok:true,receipt,entry:g.cfg}:null; });
    }catch(e){ S.syncLinked=false; await persistLocalState(); throw new Error('정산 결과 확인이 필요합니다. 설정에서 클라우드 받기 후 다시 여세요. '+e.message); }
    if(!r?.ok || !r.entry?.data) throw new Error(r?.error||'정산 실패');
    const keep={theme:S.theme}; CRED_FIELDS.forEach(f=>keep[f]=S[f]);
    S=migrate(JSON.parse(r.entry.data)); Object.assign(S,keep); S.cloudSavedAt=r.entry.at; S.syncLinked=true;
    PUSHED_SAVEDAT=String(S.savedAt);
    if(!r.alreadySettled){
      journalAdd({t:'settle',k,d:plan.date,planId:plan.id,close:C,
        rows:(plan.orders||[]).map((x,i)=>({side:x.side,kind:x.kind,qty:x.qty,price:x.price,fill:fills[i]||0})),
        sells:plan.lots.filter(l=>calc.sell[l.id]>0).map(l=>({id:l.id,d:l.d,q:calc.sell[l.id],of:num(l.q)})),
        buy:calc.buy, net:calc.actualNet});
      if(brokerN!=null) journalAdd({t:'recon',k,d:plan.date,broker:brokerN,ledger:lotsTotal(S.books[k]),
        at:new Date(Math.max(Date.now(),Date.parse(r.receipt?.at||'')||0)+1).toISOString()});
    }
    REC_MONTH_VIEW[k]=recordMonthKey(plan.date);
    const idx=PLAN_IDX[k]; if(idx) idx.plans.forEach(p=>{ if(p.date===plan.date) p.settled=true; });
    if(PLAN_CACHE[plan.id]) PLAN_CACHE[plan.id]._receipt=r.receipt;
    await save();
    UI.openLot=''; goBook(k);
    toast(r.alreadySettled?'이미 정산된 내역을 불러왔습니다':md(plan.date)+' 정산을 원장에 반영했습니다');
    refreshPlanIndex(k).then(()=>softRerender());
  });
}

    if(e.t==='recon'){ const ok=num(e.broker)===num(e.ledger);
      ev.push({type:'recon',at:e.at,ic:ok?'ok':'wn',icon:IC.scale,title:'잔고 대사',sub:`증권사 ${e.broker}주 ${ok?'=':'≠'} 원장 ${e.ledger}주 · ${ok?'일치':'차이 '+sgnN(num(e.broker)-num(e.ledger))+'주'}`,chips:[],note:''}); }
    else if(e.t==='base'){ ev.push({type:'adjust',at:e.at,ic:'',icon:IC.base,title:'기초 잔고',sub:`이 시점 원장 ${e.lots.reduce((s,l)=>s+num(l.q),0)}주를 기준으로 기록`,chips:e.lots.map(l=>`${md(l.d)} · ${l.q}주 @${p2(l.p)}`),note:e.why||''}); }
    else if(e.t==='skip'){ ev.push({type:'adjust',at:e.at,ic:'wn',icon:IC.skip,title:`정산 건너뜀 · ${md(e.d)} 세션`,sub:'주문표를 원장에 반영하지 않았습니다',chips:[],note:e.why?'사유: '+e.why:''}); }
    else if(e.t==='adjust'){
      let title='정정', sub='';
      if(e.act==='add'){ title='정정 · 로트 추가'; sub=`${md(e.lot.d)} · ${e.lot.q}주 @${p2(e.lot.p)} · 목표 ${p2(e.lot.tp)}`; }
      else if(e.act==='del'){ title=`정정 · 로트 ${e.lot.q}주 제거`; sub=`${md(e.lot.d)} · ${e.lot.q}주 @${p2(e.lot.p)}`; }
      else if(e.act==='edit'){ title='정정 · 로트 수정'; const a=e.before,c=e.after, ch=[];
        if(a.d!==c.d) ch.push(`매수일 ${md(a.d)}→${md(c.d)}`); if(a.p!==c.p) ch.push(`매수가 ${p2(a.p)}→${p2(c.p)}`);
        if(a.q!==c.q) ch.push(`수량 ${a.q}→${c.q}`); if(a.mode!==c.mode) ch.push(`모드 ${a.mode}→${c.mode}`); if(a.tp!==c.tp) ch.push(`목표 ${p2(a.tp)}→${p2(c.tp)}`);
        sub=`${md(c.d)} 로트 · `+ch.join(' · '); }
      else if(e.act==='rec'){ title=`정정 · ${md(e.rec.d)} 일별 기록`; const f=x=>x?`매수 ${x.buy} · 매도 ${x.sell} @${p2(x.close)}`:'없음'; sub=`${f(e.rec.before)} → ${f(e.rec.after)}`; }
      ev.push({type:'adjust',at:e.at,ic:'wn',icon:IC.edit,title,sub,chips:[],note:e.why?'사유: '+e.why:''});
    }
  });
  return ev.filter(e=>e.at).sort((a,c)=>String(c.at).localeCompare(String(a.at)));
}
function renderLog(){
  const el=$('#p-log'); if(!el) return;
  if(!S.books[V3.logBook]) V3.logBook=S.books[V3.book]? V3.book : bookKeys()[0];
  const k=V3.logBook, b=S.books[k];
  if(!b){ el.innerHTML='<div class="empty">종목이 없습니다</div>'; return; }
  const all=logEvents(k), T=V3.logType;
  const evs=all.filter(e=> T==='all' || e.type===T);
  const groups=[]; let cur=null;
  evs.forEach(e=>{ const day=new Date(e.at).toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});
    if(!cur||cur.day!==day){ cur={day,items:[]}; groups.push(cur); } cur.items.push(e); });
  const legacy=(b.records||[]).filter(r=>(num(r.buy)||num(r.sell)) && !r.planId).slice().sort((a,c)=>a.d<c.d?1:-1);
  const lim=20+UI.logMore, rc=reconState(k);
  el.innerHTML=`
  <div class="row between" style="margin:8px 0 10px"><div style="font-size:22px;font-weight:700">거래 일지</div><span class="pill ${rc.cls}">${rc.txt}</span></div>
  <div class="chipbar">${bookKeys().map(x=>`<button class="tchip ${x===k?'on':''}" data-lb="${esc(x)}">${esc(x)}</button>`).join('')}</div>
  <div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap">${[['all','전체'],['fill','체결'],['adjust','정정'],['recon','대사']].map(([v,l])=>`<button class="tchip ${T===v?'on':''}" data-lt="${v}" style="min-height:36px;font-size:13px">${l}</button>`).join('')}</div>
  <div class="btnrow"><button class="btn g sm" data-lrecon>${SV(IC.scale,15)} 잔고 대사</button><button class="btn g sm" data-lbase>${SV(IC.base,15)} 기초 잔고 기록</button></div>
  <div class="stack" style="margin-top:6px">
    ${groups.length? groups.map(g=>`<div class="daylabel">${esc(g.day)}</div>`+g.items.map(e=>`<article class="ev ${e.type==='adjust'&&e.ic==='wn'?'adj':''}">
      <span class="ic ${e.ic}">${SV(e.icon,18,2.2)}</span><div class="grow">
        <div class="row between base"><span class="b s14">${esc(e.title)}</span><span class="s12 mut3">${hhmm(e.at)}</span></div>
        <div class="s13 mut" style="margin-top:2px">${esc(e.sub)}</div>
        ${e.chips.length?`<div class="pills" style="margin-top:8px">${e.chips.map(c=>`<span class="pill" style="font-size:11.5px;padding:3px 8px">${esc(c)}</span>`).join('')}</div>`:''}
        ${e.note?`<div class="s12 mut3" style="margin-top:6px">${esc(e.note)}</div>`:''}
      </div></article>`).join('')).join('')
      : `<div class="card"><div class="empty">${T==='all'?'아직 일지가 없습니다. 주문 확정·체결 정산·정정·대사가 여기에 시간순으로 남습니다.':'해당 종류의 기록이 없습니다'}</div></div>`}
    ${legacy.length? `<div class="row between" style="margin-top:12px"><span class="b s14">주문표 없이 입력된 기록</span><span class="s12 mut3">검증 안 됨 · 읽기 전용</span></div>
      <section class="card" style="padding:4px 16px">${legacy.slice(0,lim).map(r=>`<div class="lrow2"><span style="width:52px" class="b">${md(r.d)}</span>
        <span class="grow">${num(r.buy)?`<span class="up">매수 ${num(r.buy)}</span>`:''}${num(r.buy)&&num(r.sell)?' · ':''}${num(r.sell)?`<span class="down">매도 ${num(r.sell)}</span>`:''}</span><span class="mut s13">@${p2(r.close)}</span></div>`).join('')}
        ${legacy.length>lim?`<button class="linkrow s13" data-lmore style="justify-content:center;color:var(--dn)">이전 기록 ${legacy.length-lim}건 더 보기</button>`:''}</section>`:''}
  </div>`;
  $$('[data-lb]',el).forEach(x=>x.onclick=()=>{ V3.logBook=x.dataset.lb; UI.logMore=0; v3Save(); renderLog(); });
  $$('[data-lt]',el).forEach(x=>x.onclick=()=>{ V3.logType=x.dataset.lt; v3Save(); renderLog(); });
  $$('[data-lmore]',el).forEach(x=>x.onclick=()=>{ UI.logMore+=50; renderLog(); });
  $$('[data-lrecon]',el).forEach(x=>x.onclick=()=>doRecon(k));
  $$('[data-lbase]',el).forEach(x=>x.onclick=()=>{
    const lots=(S.books[k].lots||[]).filter(l=>l.d&&num(l.q)>0).map(l=>({id:l.id,d:l.d,p:num(l.p),q:num(l.q),mode:l.mode,tp:l.ct?num(l.ct.tp):null}));
    const why=prompt(`현재 ${k} 원장(${lots.reduce((s,l)=>s+l.q,0)}주)을 기초 잔고로 기록합니다.\n이후 정산·정정은 이 시점부터 추적됩니다. 메모(선택):`,'');
    if(why===null) return;
    journalAdd({t:'base',k,d:todayISO(),lots,why:why.trim()}); touch(); renderLog(); toast('기초 잔고를 기록했습니다');
  });
}

/* ============================================================
   17. 상단 바 · 탭 · 초기화
   ============================================================ */
let SYNC_MSG='클라우드 미연동 — 설정에서 구글시트를 연결하세요';
function setSyncDot(ok,msg){
  SYNC_MSG=msg||(ok?'클라우드 연결됨':'클라우드 연결 실패');
  const el=$('#syncDot'); if(!el) return;
  el.querySelector('.dot').style.background = ok===null? 'var(--tx4)' : ok? 'var(--green)' : 'var(--red)';
  el.querySelector('.t').textContent = ok===null? '미연동' : ok? '동기화 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}) : '동기화 오류';
  el.setAttribute('aria-label', SYNC_MSG);
}
$('#syncDot').onclick=()=>toast(SYNC_MSG);
$$('nav.tabs .tab').forEach(t=>t.onclick=()=>{ if(t.dataset.p==='book'){ UI.openLot=''; UI.editLot=''; } go(t.dataset.p); });
$('#btnFetch').onclick=async()=>{
  const b=$('#btnFetch'); if(b.disabled) return;
  b.disabled=true; b.classList.add('spin');
  try{ await fetchPrices(false); snapshot(true); }finally{ b.disabled=false; b.classList.remove('spin'); }
};
if($('#buildTag')) $('#buildTag').textContent='빌드 '+APP_BUILD;

async function unlockPrompt(){
  const box=credBox(); if(!box) return;
  for(let i=0;i<5;i++){
    const pin=prompt(i? 'PIN이 올바르지 않습니다. 다시 입력하세요.' : 'PIN을 입력하세요.');
    if(pin===null) return;
    try{ Object.assign(S, await openCreds(pin, box)); return; }catch(e){}
  }
  toast('PIN 확인에 실패했습니다 — 설정에서 다시 입력하세요');
}

(async function init(){
  const loaded=await Store.get();
  if(loaded) S=migrate(loaded);
  try{ const t=localStorage.getItem('lev2mode:theme'); if(t) S.theme=t; }catch(e){}
  await unlockPrompt();
  if(loaded) await backupState();
  { const n=migrateContracts();
    if(n>0){ await persistLocalState();
      toast(`로트 ${n}건에 목표가·기한 계약을 고정했습니다 (이후 설정 변경은 신규 로트에만 적용)`); } }
  renderAll();
  snapshot(false);
  setSyncDot(syncReady()? true : null, syncReady()? '클라우드 확인 중…' : undefined);
  if(syncReady()){
    try{
      const r=await cloudPull();
      if(r.state && (+r.state.savedAt||0) > (+S.savedAt||0)){
        const keep={gsUrl:S.gsUrl, gsToken:S.gsToken, tdKey:S.tdKey, theme:S.theme};
        S=migrate(r.state); Object.assign(S,keep);
        S.cloudSavedAt=r.savedAt; S.syncLinked=true; PUSHED_SAVEDAT=String(S.savedAt);
        migrateContracts();
        await persistLocalState(); renderAll();
        toast('클라우드의 최신 데이터를 불러왔습니다');
      } else if(r.savedAt){
        S.cloudSavedAt=r.savedAt; S.syncLinked=true;
        if(r.state && String(r.state.savedAt)===String(S.savedAt)) PUSHED_SAVEDAT=String(S.savedAt);
      }
      setSyncDot(true,'클라우드 연결됨');
    }catch(e){ setSyncDot(false,'클라우드 연결 실패: '+e.message); }
    if(S.syncLinked) refreshAllPlans();
  }
  if(S.gsUrl && S.autoFetch && S.lastFetchDay!==todayISO()){
    await fetchPrices(true); snapshot(true);
  }
  document.addEventListener('visibilitychange', async ()=>{
    if(PLAN_BUSY || document.visibilityState!=='visible') return;
    if(syncReady() && S.syncLinked && bookKeys().some(k=>!PLAN_IDX[k] || Date.now()-PLAN_IDX[k].at>5*60e3)) refreshAllPlans();
    if(!window.storage) return;
    try{
      const fresh=await Store.get();
      if(fresh && JSON.stringify(fresh)!==JSON.stringify(S)){
        S=migrate(fresh); renderAll(); toast('다른 기기의 변경사항을 불러왔습니다');
      }
    }catch(e){}
  });
})();

</script>
